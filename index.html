<script>
/* ============ CONFIG(ここを書き換える) ============ */
const SUPABASE_URL = "https://hwoltvzmsznprsbyrbaj.supabase.co";
const SUPABASE_ANON = "sb_publishable_1JsQKCxHNyH4fGzFUJeEHg_czjaZxPR";
const GAS_URL = "https://script.google.com/macros/s/AKfycbyQ3OxIQ3fA60kAOKf3_kcXWtE0N8A3WPH4c4uG-KdyiYwo2HIS0U8IjmS-AHftieOP/exec";
let _lastAuthToken = "";   /* sendBeacon用に直近トークンを保持 */
/* ページ離脱(Xを開く等)でも送信が切れないsendBeacon送信。成功でtrue */
function gasBeacon_(action, extra) {
  try {
    if (!navigator.sendBeacon || !_lastAuthToken) return false;
    const payload = JSON.stringify(Object.assign({ auth: _lastAuthToken, action: action }, extra || {}));
    return navigator.sendBeacon(GAS_URL, new Blob([payload], { type: "text/plain;charset=UTF-8" }));
  } catch (e) { return false; }
}
/* 挨拶の送信ペース管理: 直近windowMin分の送信数がlimit未満ならOK(Xの30分細切れ上限対策) */
function greetPaceOk_(screen, limit, windowMin) {
  try {
    var arr = JSON.parse(localStorage.getItem("xpl_greet_times_" + screen) || "[]");
    var cut = Date.now() - windowMin * 60000;
    return arr.filter(function (t) { return t > cut; }).length < limit;
  } catch (e) { return true; }
}
function greetPaceMark_(screen) {
  try {
    var arr = JSON.parse(localStorage.getItem("xpl_greet_times_" + screen) || "[]");
    arr.push(Date.now());
    localStorage.setItem("xpl_greet_times_" + screen, JSON.stringify(arr.slice(-200)));
  } catch (e) {}
}
/* 送る相手にリプ済みかをX APIで直接確認(全ジャンル共通)。セッション内はキャッシュして無駄打ちしない */
const _repliedCache = {};
async function checkRepliedTo(screen, handle) {
  if (!screen || !handle) return false;
  const k = String(screen).toLowerCase() + "|" + String(handle).toLowerCase().replace(/^@/, "");
  if (k in _repliedCache) return _repliedCache[k];
  try {
    const r = await gasFetch_("checkReplied", { screen_name: screen, handle: handle });
    const v = !!(r && r.replied);
    _repliedCache[k] = v;
    return v;
  } catch (e) { return false; }
}
/* 画面遷移(Xを開く等)が起きても完走する確実な送信。挨拶済み記録など"絶対に落としたくない"書き込みに使う */
function gasReliable_(action, extra) {
  try {
    const payload = JSON.stringify(Object.assign({ auth: _lastAuthToken, action: action }, extra || {}));
    return fetch(GAS_URL, { method: "POST", keepalive: true, headers: { "Content-Type": "text/plain;charset=UTF-8" }, body: payload }).catch(function () {});
  } catch (e) { try { return gasFetch_(action, extra || {}); } catch (e2) {} }
}

/* v163: SNS切替のスイープ演出。transform/opacityのみ=GPU合成で低電力。
   省電力設定(prefers-reduced-motion)の人には演出なしで即切替 */
window.snsSwitchFx = function (btn, after) {
  try {
    if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) { after(); return; }
    const v = document.createElement("div");
    v.className = "sns-sweep";
    document.body.appendChild(v);
    if (btn) { btn.classList.add("pop"); setTimeout(() => { try { btn.classList.remove("pop"); } catch (e) {} }, 400); }
    setTimeout(after, 180); /* スイープが画面を覆う中間で切替(切替の瞬間が隠れて気持ちいい) */
    v.addEventListener("animationend", () => v.remove());
    setTimeout(() => { try { v.remove(); } catch (e) {} }, 800); /* 保険 */
  } catch (e) { after(); }
};

/* ============================================================
 * 🎬 動画AIスタジオ v202 — 既存機能から完全独立
 * 動画はGASを通さずSupabase Storageへ直接PUT → Cloud Runが処理
 * ============================================================ */
window.openVideoStudio = function () {
  if (window._videoStudioOpen) return; /* 二重起動防止 */
  window._videoStudioOpen = true;
  try { renderTop(); } catch (e) {}

  const vEsc = (s) => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  /* サーバー側のsplitTwoLinesと同じ考え方の軽量版(編集画面のプレビュー用)。
     カタカナの連続(外来語)の途中で改行しないよう保護する */
  function vSplitTwoLines(text, words) {
    const mc = 9;
    const t = String(text || "");
    if (t.length <= mc) return { line1: t, line2: "" };
    const isKata = (ch) => { const c = ch.codePointAt(0); return c >= 0x30A0 && c <= 0x30FF; };
    if (words && words.length > 1) {
      const merged = [];
      let cur = null;
      words.forEach((w) => {
        const chars = Array.from(String(w.word || ""));
        const pureKata = chars.length > 0 && chars.every(isKata);
        if (cur && cur._k && pureKata) { cur.word += w.word; }
        else { cur = { word: w.word, _k: pureKata }; merged.push(cur); }
      });
      let acc = "", bestIdx = 1, bestDiff = Infinity;
      merged.forEach((w, i) => {
        acc += w.word;
        const diff = Math.abs(acc.length - t.length / 2);
        if (diff < bestDiff && acc.length < t.length) { bestDiff = diff; bestIdx = i + 1; }
      });

      /* 話す速さ(横スライダー) */
      h += '<div style="margin-top:12px"><div style="display:flex;justify-content:space-between;align-items:baseline"><span style="font-size:12px;font-weight:700;color:#3DFFA8">話す速さ</span><span class="muted" style="font-size:12px" id="vsRateVal">×' + V.speaking_rate.toFixed(2) + '</span></div>'
        + '<input type="range" id="vsRate" min="0.75" max="1.4" step="0.05" value="' + V.speaking_rate + '" style="width:100%;accent-color:#38d4f0;margin-top:4px"></div>';
      h += '</div>';

      /* BGM(縦スクロール・試聴つき) */
      h += '<div style="margin-bottom:14px"><div style="font-size:12px;font-weight:700;color:#3DFFA8;margin-bottom:6px">🎵 BGM <span class="muted" style="font-weight:400">(Supabaseのbgmバケットに入れた曲)</span></div>';
      if (!V.bgmList) {
        h += '<button id="vsBgmLoad" style="width:100%;background:var(--card);border:1px solid var(--border);color:var(--ink);font-weight:700;padding:11px;border-radius:11px;font-size:13px">BGM一覧を読み込む</button>';
      } else if (!V.bgmList.length) {
        h += '<div class="muted" style="font-size:12px">bgmバケットに曲がありません。Supabase→Storage→bgm にmp3を入れてください。</div>';
      } else {
        h += '<div style="max-height:210px;overflow-y:auto;border:1px solid var(--border);border-radius:11px">';
        h += '<div class="vsBgmRow" data-key="" style="display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border);' + (V.bgm_key === "" ? 'background:rgba(56,212,240,.12)' : '') + '"><span style="flex:1;font-size:13px;font-weight:700">BGMなし</span>' + (V.bgm_key === "" ? '<span style="color:#38d4f0;font-size:12px">✓選択中</span>' : '') + '</div>';
        V.bgmList.forEach(function (b) {
          const on = V.bgm_key === b.name;
          h += '<div class="vsBgmRow" data-key="' + vEsc(b.name) + '" style="display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border);' + (on ? 'background:rgba(56,212,240,.12)' : '') + '">'
            + '<button class="vsBgmPrev" data-url="' + vEsc(b.url) + '" style="border:1px solid var(--border);background:transparent;color:#fbbf24;border-radius:8px;padding:5px 10px;font-size:12px">▶</button>'
            + '<span style="flex:1;font-size:12px;word-break:break-all">' + vEsc(b.name) + '</span>'
            + (on ? '<span style="color:#38d4f0;font-size:12px;white-space:nowrap">✓選択中</span>' : '')
            + '</div>';
        });
        h += '</div>';
      }
      h += '</div>';
    }

    /* 締め文 */
    h += '<div style="margin-bottom:18px"><div style="font-size:12px;font-weight:700;color:#3DFFA8;margin-bottom:6px">締め文</div>'
      + '<input type="text" id="vsOutro" value="' + vEsc(V.outro_text) + '" style="width:100%;background:var(--card);border:1px solid var(--border);border-radius:10px;color:var(--ink);font-size:16px;padding:11px">'
      + (V.mode === "jikkyo" ? '<div class="muted" style="font-size:11px;margin-top:6px">🔊 実況音声つきモードでは、この締め文を最後にボイスキャラが必ず読み上げます(字幕だけでなく声でも締まります)</div>' : '')
      + '</div>';

    /* 実行ボタン */
    h += '<button id="vsRun"' + (V.busy ? ' disabled' : '') + ' style="width:100%;background:' + (V.busy ? 'var(--card)' : 'linear-gradient(135deg,#b98cff,#38d4f0)') + ';color:' + (V.busy ? 'var(--muted,#889)' : '#001') + ';font-weight:800;border:none;padding:16px;border-radius:12px;font-size:15px">' + (V.busy ? '処理中…' : '🎬 作成する') + '</button>';

    /* 診断ボタン（配線チェック用） */
    h += '<button id="vsDiag" style="width:100%;margin-top:8px;background:transparent;border:1px solid var(--border);color:var(--muted,#889);font-weight:700;padding:11px;border-radius:11px;font-size:12px">🔧 診断（うまくいかない時に押す）</button>';
    if (V.diag) {
      h += '<pre style="margin-top:10px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:11px;font-size:11px;white-space:pre-wrap;word-break:break-all;color:var(--ink);max-height:320px;overflow:auto">' + vEsc(V.diag) + '</pre>';
    }

    /* 進捗 */
    if (V.busy || V.statusText) {
      h += '<div style="margin-top:18px"><div style="font-size:13px;font-weight:700;margin-bottom:7px" id="vsStatus">' + vEsc(V.statusText || "準備中…") + '</div>'
        + '<div style="height:9px;background:var(--card);border-radius:99px;overflow:hidden"><div id="vsBar" style="height:100%;width:' + (V.progress || 0) + '%;background:linear-gradient(90deg,#b98cff,#38d4f0);transition:width .4s"></div></div></div>';
    }

    /* 完成 */
    if (V.result) {
      h += '<div style="margin-top:20px">'
        + '<video src="' + V.result + '" controls playsinline style="width:100%;border-radius:12px;background:#000"></video>'
        + (V.summary ? '<div class="muted" style="font-size:12px;margin-top:8px">' + vEsc(V.summary) + '</div>' : '')
        + '<button id="vsSave" style="display:block;width:100%;text-align:center;margin-top:10px;background:#3DFFA8;color:#001;font-weight:800;padding:15px;border-radius:12px;font-size:15px;border:none">💾 写真/ファイルに保存</button>'
        + '<a href="' + V.result + '" target="_blank" rel="noopener" style="display:block;text-align:center;margin-top:8px;color:var(--muted);font-size:12px;text-decoration:underline">開けない場合はこちら(ブラウザで開く)</a>';

      /* 設定が実際どう使われたか(「機能が起動してるか」を画面で即確認できるように) */
      if (V.usedSettings) {
        const US = V.usedSettings;
        h += '<div style="margin-top:14px;background:var(--card);border:1px solid var(--border);border-radius:11px;padding:12px 14px">'
          + '<div style="font-size:11px;font-weight:700;color:#3DFFA8;margin-bottom:6px">⚙️ 今回使われた設定</div>'
          + '<div class="muted" style="font-size:11.5px;line-height:1.7">'
          + 'モード: <b style="color:var(--ink)">' + vEsc(US.mode || "-") + '</b> ／ '
          + 'エフェクト: <b style="color:var(--ink)">' + vEsc(US.caption_fx || "none") + '</b> ／ '
          + 'サムネ: <b style="color:var(--ink)">' + (US.thumb_path ? "あり(" + vEsc(US.thumb_kind || "?") + ")" : "なし") + '</b>'
          + '</div></div>';
      }
      if (V.renderNotes) {
        h += '<div style="margin-top:10px;background:var(--card);border:1px solid var(--border);border-radius:11px;padding:12px 14px">'
          + '<div style="font-size:11px;font-weight:700;color:#3DFFA8;margin-bottom:6px">📋 処理結果</div>'
          + '<div style="font-size:11.5px;line-height:1.8;white-space:pre-wrap">' + vEsc(V.renderNotes) + '</div></div>';
      }
      /* 話者の名前を修正(検出された人数ぶんだけ入力欄を出す。STT再実行なしで再レンダリング) */
      if (V.speakerCountDetected > 0) {
        h += '<div style="margin-top:10px;background:var(--card);border:1px solid var(--border);border-radius:11px;padding:12px 14px">'
          + '<div style="font-size:11px;font-weight:700;color:#3DFFA8;margin-bottom:8px">🗣 話者の名前を修正 <span class="muted" style="font-weight:400">(' + V.speakerCountDetected + '人検出)</span></div>';
        const SPK_COLORS = { 1: '#00C9FF', 2: '#FF7AC1', 3: '#FF9A00', 4: '#C173FF' };
        for (let i = 1; i <= V.speakerCountDetected; i++) {
          h += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">'
            + '<span style="width:10px;height:10px;border-radius:99px;background:' + (SPK_COLORS[i] || '#888') + ';flex-shrink:0"></span>'
            + '<input type="text" class="vsSpkNameEdit" data-i="' + i + '" placeholder="話者' + i + 'の名前" value="' + vEsc(V.speakerNames[i] || "") + '" style="flex:1;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--ink);font-size:13px;padding:8px">'
            + '</div>';
        }
        h += '<button id="vsSpkSave" style="width:100%;background:var(--card);border:1px solid #3DFFA8;color:#3DFFA8;font-weight:800;padding:11px;border-radius:11px;font-size:13px;margin-top:4px">🔄 名前を反映して作り直す</button></div>';
      }
      /* 音声認識(STT)字幕の修正 — 実際に動画へ焼き込まれた字幕そのもの。
         Geminiの台本(下のブロック)とは別物。行ごとにエフェクトも変えられる */
      if (V.sttCaptions && V.sttCaptions.length) {
        h += '<div style="margin-top:18px"><div style="font-size:12px;font-weight:700;color:#3DFFA8;margin-bottom:4px">📝 字幕の修正(実際に焼き込まれる字幕そのものです)</div>'
          + '<div class="muted" style="font-size:11px;margin-bottom:8px">行ごとに音声連動エフェクトも個別に変えられます</div>';
        const FX_SHORT = [["", "(全体の設定を使う)"], ["none", "なし"], ["bounce", "弾む"], ["shake", "振動"], ["jump", "縦バウンド"], ["glow", "発光"], ["colorpulse", "色脈動"], ["tilt", "傾き"], ["flash", "フラッシュ"], ["zoompunch", "パンチ"], ["wave", "波打ち"], ["karaoke", "カラオケ"]];
        V.sttCaptions.forEach((c, i) => {
          const sp = vSplitTwoLines(c.text || "", c.words);
          const initial = sp.line2 ? (sp.line1 + "\n" + sp.line2) : (c.text || "");
          h += '<div style="background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:8px">'
            + '<div class="muted" style="font-size:10px;margin-bottom:4px">字幕' + (i + 1) + ' (' + Number(c.start).toFixed(1) + '〜' + Number(c.end).toFixed(1) + '秒)' + (c.speakerTag ? ' ・話者' + c.speakerTag : '') + '</div>'
            + '<textarea class="vsSttCapEdit" data-i="' + i + '" rows="2" style="width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--ink);font-size:14px;padding:8px;margin-bottom:4px;resize:vertical;line-height:1.4">' + vEsc(initial) + '</textarea>'
            + '<div class="muted" style="font-size:10px;margin-bottom:6px">2行に分けて表示されます。改行位置は自由に編集できます</div>'
            + '<select class="vsSttFxEdit" data-i="' + i + '" style="width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--ink);font-size:12px;padding:6px">'
            + FX_SHORT.map((fx) => '<option value="' + fx[0] + '"' + ((c.effect || "") === fx[0] ? ' selected' : '') + '>' + fx[1] + '</option>').join('')
            + '</select></div>';
        });
        h += '<button id="vsFixSttCaptions" style="width:100%;background:var(--card);border:1px solid #3DFFA8;color:#3DFFA8;font-weight:800;padding:13px;border-radius:11px;font-size:14px;margin-top:4px">🔄 修正を反映して作り直す(STT再実行なし)</button></div>';
      }

      /* 台本・字幕の修正(艇番の誤り等をここで直す・Geminiが書いた台本。STTとは別物) */
      if ((V.captions && V.captions.length) || (V.lines && V.lines.length)) {
        h += '<div style="margin-top:18px"><div style="font-size:12px;font-weight:700;color:#3DFFA8;margin-bottom:8px">📝 字幕・実況の修正(艇番・名前の間違いはここで直せます)</div>';
        (V.captions || []).forEach((c, i) => {
          h += '<div style="margin-bottom:6px"><div class="muted" style="font-size:10px;margin-bottom:2px">字幕' + (i + 1) + '</div>'
            + '<input type="text" class="vsCapEdit" data-i="' + i + '" value="' + vEsc(c.text || "") + '" style="width:100%;background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--ink);font-size:14px;padding:8px"></div>';
        });
        (V.lines || []).forEach((l, i) => {
          h += '<div style="margin-bottom:6px"><div class="muted" style="font-size:10px;margin-bottom:2px">🎙 実況' + (i + 1) + '</div>'
            + '<input type="text" class="vsLineEdit" data-i="' + i + '" value="' + vEsc(l.text || "") + '" style="width:100%;background:var(--card);border:1px solid #fbbf24;border-radius:8px;color:var(--ink);font-size:14px;padding:8px"></div>';
        });
        h += '<button id="vsFixScript" style="width:100%;background:var(--card);border:1px solid #3DFFA8;color:#3DFFA8;font-weight:800;padding:13px;border-radius:11px;font-size:14px;margin-top:4px">🔄 修正を反映して作り直す</button></div>';
      }

      /* 微調整 */
      if (V.clips && V.clips.length) {
        h += '<div style="margin-top:18px"><div style="font-size:12px;font-weight:700;color:#3DFFA8;margin-bottom:8px">✂️ 微調整(AI再解析なし=無料)</div>';
        V.clips.forEach((c, i) => {
          h += '<div style="background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:8px">'
            + '<div class="muted" style="font-size:11px;margin-bottom:6px">クリップ' + (i + 1) + (c.reason ? ' — ' + vEsc(c.reason) : '') + '</div>'
            + '<div style="display:flex;gap:8px;align-items:center"><span style="font-size:11px;width:28px">開始</span><input type="number" step="0.1" class="vsClipS" data-i="' + i + '" value="' + Number(c.start).toFixed(1) + '" style="flex:1;background:var(--bg);border:1px solid var(--border);border-radius:7px;color:var(--ink);font-size:14px;padding:6px"></div>'
            + '<div style="display:flex;gap:8px;align-items:center;margin-top:5px"><span style="font-size:11px;width:28px">終了</span><input type="number" step="0.1" class="vsClipE" data-i="' + i + '" value="' + Number(c.end).toFixed(1) + '" style="flex:1;background:var(--bg);border:1px solid var(--border);border-radius:7px;color:var(--ink);font-size:14px;padding:6px"></div>'
            + '</div>';
        });
        h += '<button id="vsRerender" style="width:100%;background:var(--card);border:1px solid #38d4f0;color:#38d4f0;font-weight:800;padding:13px;border-radius:11px;font-size:14px">🔄 この設定で作り直す</button></div>';
      }
      h += '</div>';
    }

    body.innerHTML = h;
    wire();
  }

  function wire() {
    const c = ov.querySelector("#vsClose"); if (c) c.onclick = close;
    ov.querySelectorAll(".vsAcct").forEach(b => b.onclick = () => { V.screen = b.dataset.sn; render(); });
    ov.querySelectorAll(".vsChip").forEach(b => b.onclick = () => {
      V[b.dataset.k] = b.dataset.num === "1" ? Number(b.dataset.v) : b.dataset.v;
      render();
    });
    const f = ov.querySelector("#vsFile");
    if (f) f.onchange = (e) => { V.file = e.target.files[0] || null; render(); };
    const o = ov.querySelector("#vsOutro");
    if (o) o.onchange = () => { V.outro_text = o.value; };
    const r = ov.querySelector("#vsRun"); if (r) r.onclick = run;
    const sv = ov.querySelector("#vsSave"); if (sv) sv.onclick = () => vsSaveVideo(sv);
    const dg = ov.querySelector("#vsDiag"); if (dg) dg.onclick = diag;
    const rr = ov.querySelector("#vsRerender"); if (rr) rr.onclick = rerender;
    const fx = ov.querySelector("#vsFixScript"); if (fx) fx.onclick = fixScript;
    const spk = ov.querySelector("#vsSpkSave"); if (spk) spk.onclick = saveSpeakerNames;
    const sttfx = ov.querySelector("#vsFixSttCaptions"); if (sttfx) sttfx.onclick = saveSttCaptions;
    /* 話す速さスライダー(再描画せず値だけ更新=スムーズ) */
    const rt = ov.querySelector("#vsRate");
    if (rt) rt.oninput = () => {
      V.speaking_rate = Number(rt.value);
      const lb = ov.querySelector("#vsRateVal"); if (lb) lb.textContent = "×" + V.speaking_rate.toFixed(2);
    };
    /* 挨拶・感情の切替(即反映・音は鳴らさない) */
    ov.querySelectorAll(".vsFontBtn").forEach(b => b.onclick = () => { V.caption_font = b.dataset.v; render(); });
    ov.querySelectorAll(".vsFxBtn").forEach(b => b.onclick = () => { V.caption_fx = b.dataset.v; render(); });
    /* サムネイル選択・削除・表示時間・トランジション */
    const ti = ov.querySelector("#vsThumbInput");
    if (ti) ti.onchange = () => {
      const f = ti.files && ti.files[0];
      if (!f) return;
      if (V.thumbPreviewUrl) { try { URL.revokeObjectURL(V.thumbPreviewUrl); } catch (e) {} }
      V.thumbFile = f;
      V.thumbKind = f.type.startsWith("video/") ? "video" : "image";
      V.thumbPreviewUrl = URL.createObjectURL(f);
      render();
    };
    const tc = ov.querySelector("#vsThumbClear");
    if (tc) tc.onclick = () => {
      if (V.thumbPreviewUrl) { try { URL.revokeObjectURL(V.thumbPreviewUrl); } catch (e) {} }
      V.thumbFile = null; V.thumbKind = ""; V.thumbPreviewUrl = "";
      render();
    };
    const td = ov.querySelector("#vsThumbDur");
    if (td) td.oninput = () => { V.thumbDuration = Number(td.value); };
    ov.querySelectorAll(".vsTransBtn").forEach(b => b.onclick = () => { V.transition = b.dataset.v; render(); });
    ov.querySelectorAll(".vsSpkModeBtn").forEach(b => b.onclick = () => { V.speaker_mode = b.dataset.v; render(); });
    ov.querySelectorAll(".vsSpkCountBtn").forEach(b => b.onclick = () => { V.speaker_count = Number(b.dataset.v); render(); });
    ov.querySelectorAll(".vsColorBtn").forEach(b => b.onclick = () => { V.caption_style = b.dataset.v; render(); });
    ov.querySelectorAll(".vsGreetBtn").forEach(b => b.onclick = () => { V.sampleGreet = Number(b.dataset.i); render(); });
    ov.querySelectorAll(".vsEmoBtn").forEach(b => b.onclick = () => { V.sampleEmotion = b.dataset.e; render(); });
    /* ボイスサンプル再生(いまの挨拶・感情・速さで) */
    ov.querySelectorAll(".vsVoicePrev").forEach(b => b.onclick = async () => {
      b.textContent = "…";
      try {
        const j = await gasFetch_("videoVoiceSample", { voice: b.dataset.v, rate: V.speaking_rate, greet: V.sampleGreet, emotion: V.sampleEmotion });
        if (!j || !j.audio) throw new Error(j && j.error ? j.error : "サンプル取得に失敗しました");
        if (V._audio) { try { V._audio.pause(); } catch (e) {} }
        V._audio = new Audio(j.audio);
        V._audio.play();
      } catch (e) { alert(e.message); }
      b.textContent = "▶";
    });
    /* BGM読み込み・試聴・選択 */
    const bl = ov.querySelector("#vsBgmLoad");
    if (bl) bl.onclick = async () => {
      bl.textContent = "読み込み中…"; bl.disabled = true;
      try {
        const j = await gasFetch_("videoBgmList", {});
        V.bgmList = (j && j.items) || [];
        if (j && j.error) alert(j.error);
      } catch (e) { alert(e.message); V.bgmList = []; }
      render();
    };
    ov.querySelectorAll(".vsBgmPrev").forEach(b => b.onclick = (ev) => {
      ev.stopPropagation();
      if (V._audio) { try { V._audio.pause(); } catch (e) {} }
      V._audio = new Audio(b.dataset.url);
      V._audio.play();
    });
    ov.querySelectorAll(".vsBgmRow").forEach(r => r.onclick = () => { V.bgm_key = r.dataset.key; render(); });
  }

  /* 字幕・実況の修正 → 再レンダリング(Gemini再呼び出しなし) */
  async function fixScript() {
    const captions = (V.captions || []).map((c, i) => {
      const el = ov.querySelector('.vsCapEdit[data-i="' + i + '"]');
      return { start: c.start, end: c.end, text: el ? el.value : c.text };
    });
    const lines = (V.lines || []).map((l, i) => {
      const el = ov.querySelector('.vsLineEdit[data-i="' + i + '"]');
      return { i: l.i, text: el ? el.value : l.text };
    });
    V.busy = true; V.result = null; V.progress = 0; V.statusText = "修正を反映中…";
    render();
    try {
      const j = await gasFetch_("videoUpdateScript", { job_id: V.jobId, captions, lines });
      if (!j || j.error) throw new Error(j && j.error ? j.error : "修正の反映に失敗しました");
      poll();
    } catch (e) { V.busy = false; V.statusText = "❌ " + e.message; render(); }
  }

  /* 話者の名前を保存→再レンダリング(STT・Geminiは再実行しない・字幕焼き直しのみ) */
  async function saveSpeakerNames() {
    const names = {};
    for (let i = 1; i <= V.speakerCountDetected; i++) {
      const el = ov.querySelector('.vsSpkNameEdit[data-i="' + i + '"]');
      if (el && el.value.trim()) names[i] = el.value.trim();
    }
    V.busy = true; V.result = null; V.progress = 0; V.statusText = "話者名を反映中…";
    render();
    try {
      const j = await gasFetch_("videoUpdateSpeakers", { job_id: V.jobId, names });
      if (!j || j.error) throw new Error(j && j.error ? j.error : "話者名の反映に失敗しました");
      V.speakerNames = names;
      poll();
    } catch (e) { V.busy = false; V.statusText = "❌ " + e.message; render(); }
  }

  /* 音声認識(STT)字幕の本文・行ごとのエフェクトを保存 → 再レンダリング。
     start/end/speakerTagは元のまま維持し、text/effectだけユーザーの入力で上書きする。
     STTは再実行しない(サーバー側のjob.script_json.stt_chunksへ丸ごと差し替えられる) */
  async function saveSttCaptions() {
    const chunks = (V.sttCaptions || []).map((c, i) => {
      const textEl = ov.querySelector('.vsSttCapEdit[data-i="' + i + '"]');

      };

  }

  /* アップロード: supabase-jsの署名付きアップロード(ブラウザ公式ルート)を最優先。
     ダメなら素のPUT(最小ヘッダー)にフォールバック */
  async function vsUpload(sign, file) {
    if (window.sb && sb.storage && sign.token && sign.object_key) {
      try {
        const { error } = await sb.storage.from("videos-in")
          .uploadToSignedUrl(sign.object_key, sign.token, file, { contentType: file.type || "video/mp4", upsert: true });
        if (!error) return "supabase-js";
        console.warn("uploadToSignedUrl失敗:", error.message);
      } catch (e) { console.warn("uploadToSignedUrl例外:", e.message); }
    }
    const up = await fetch(sign.upload_url, {
      method: "PUT",
      headers: { "Content-Type": file.type || "video/mp4" },
      body: file
    });
    if (!up.ok) throw new Error("アップロード失敗 HTTP " + up.status);
    return "fetch";
  }

  /* 動画をiPhoneに保存: 共有シート(写真に保存が出る)→ダメならBlobダウンロード */
  async function vsSaveVideo(btn) {
    const orig = btn.textContent;
    btn.disabled = true; btn.textContent = "準備中…";
    try {
      const res = await fetch(V.result);
      if (!res.ok) throw new Error("取得失敗 " + res.status);
      const blob = await res.blob();
      const file = new File([blob], "xplosion-" + Date.now() + ".mp4", { type: "video/mp4" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file] }); /* 共有シート→「ビデオを保存」 */
      } else {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = file.name;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 30000);
      }
    } catch (e) {
      if (e && e.name !== "AbortError") alert("保存に失敗しました: " + e.message);
    }
    btn.disabled = false; btn.textContent = orig;
  }

  async function run() {
    if (V.busy) return;
    if (!V.file) { alert("動画を選択してください"); return; }
    V.busy = true; V.result = null; V.clips = null; V.progress = 0;
    V.statusText = "アップロード準備中…";
    render();

    try {
      /* ① 署名付きURL取得(Service Keyはフロントに出さない) */
      const sign = await gasFetch_("videoSignedUrl", { screen_name: V.screen });
      if (!sign || !sign.upload_url) throw new Error(sign && sign.error ? sign.error : "署名URL取得失敗");

      /* ② Supabase Storageへ直接アップロード(GASを通さない=6分/50MB制限を回避) */
      V.statusText = "アップロード中…"; V.progress = 8; render();
      await vsUpload(sign, V.file);

      /* ②.5 サムネイル(任意)のアップロード。失敗しても本編は止めないが、
         失敗を黙って握りつぶさず必ずV.statusTextで一瞬見せてから続行する */
      let thumbPath = "";
      if (V.thumbFile) {
        V.statusText = "サムネイルをアップロード中…"; V.progress = 10; render();
        try {
          const ext = (V.thumbFile.name.split(".").pop() || (V.thumbKind === "image" ? "jpg" : "mp4")).toLowerCase();
          const tsign = await gasFetch_("videoSignedUrl", { screen_name: V.screen, kind: "thumb", ext });
          if (!tsign || !tsign.upload_url) {
            throw new Error((tsign && tsign.error) ? tsign.error : "署名URLにupload_urlが含まれていません(GASが古い可能性)");
          }
          await vsUpload(tsign, V.thumbFile);
          if (!tsign.input_path) throw new Error("署名URL応答にinput_pathがありません");
          thumbPath = tsign.input_path;
          console.log("[thumb] アップロード成功:", thumbPath);
        } catch (e) {
          console.warn("[thumb] アップロード失敗、サムネなしで続行:", e.message);
          V.statusText = "⚠️ サムネイルの添付に失敗(" + e.message + ")。本編の作成は続けます…";
          render();
          await new Promise((r) => setTimeout(r, 1800)); /* 失敗メッセージを一瞬見せてから続行 */
        }
      }

      /* ③ ジョブ作成 */
      V.statusText = "ジョブ作成中…"; V.progress = 12; render();
      const job = await gasFetch_("videoCreateJob", {
        screen_name: V.screen,
        input_path: sign.input_path,
        duration_sec: V.duration_sec,
        genre: V.genre,
        mode: V.mode,
        cut_strength: V.cut_strength,
        caption_style: V.caption_style,
        caption_font: V.caption_font,
        caption_fx: V.caption_fx,
        caption_size: V.caption_size,
        caption_pos: V.caption_pos,
        fit_mode: V.fit_mode,
        voice: V.voice,
        orig_audio: V.orig_audio,
        speaking_rate: V.speaking_rate,
        bgm_key: V.bgm_key,
        thumb_path: thumbPath,
        thumb_kind: V.thumbKind,
        thumb_duration: V.thumbDuration,

        outro_text: (ov.querySelector("#vsOutro") || {}).value || V.outro_text
      });
      if (!job || !job.job_id) throw new Error(job && job.error ? job.error : "ジョブ作成失敗");
      V.jobId = job.job_id;
      poll();
    } catch (e) {
      V.busy = false;
      V.statusText = "❌ " + e.message;
      V.diag = "作成に失敗しました。\n\n" + e.message + "\n\n『🔧 診断』を押すと、どこで切れているか分かります。";
      render();
    }
  }

  function poll() {
    clearInterval(V.timer);
    /* v226(電池対策): 永久ポーリング防止。10分(=200回×3秒)で自動停止し、
       画面を離れた/ジョブが固まった時に3秒ごとの通信が延々続くのを止める */
    V._pollStart = Date.now();
    V.timer = setInterval(async () => {
      /* 動画オーバーレイが閉じられていたら即停止(バックグラウンドで回り続けない) */
      if (!document.body.contains(ov)) { clearInterval(V.timer); return; }
      if (Date.now() - (V._pollStart || 0) > 10 * 60000) {
        clearInterval(V.timer); V.busy = false;
        V.statusText = "⏱ 進捗確認を停止しました(10分経過)。『🔧 診断』で状態を確認できます。";
        try { render(); } catch (e) {}
        return;
      }
      try {
        const s = await gasFetch_("videoGetJob", { job_id: V.jobId });
        V.progress = s.progress || 0;
        V.statusText = V_LABEL[s.status] || s.status;
        if (s.status === "completed") {
          clearInterval(V.timer);
          V.busy = false; V.result = s.output_url; V.clips = s.clips || null; V.summary = s.summary || "";
          V.captions = s.captions || null; V.lines = s.lines || null;
          V.renderNotes = s.render_notes || ""; V.usedSettings = s.used_settings || null;
          V.speakerCountDetected = s.speaker_count_detected || 0;
          V.sttCaptions = s.stt_captions || null;
          if (s.speaker_styles && s.speaker_styles.names) V.speakerNames = s.speaker_styles.names;
        } else if (s.status === "failed") {
          clearInterval(V.timer);
          V.busy = false; V.statusText = "❌ " + (s.error || "失敗");
        }
        render();
      } catch (e) { console.warn("poll", e); }
    }, 3000);
  }

  async function rerender() {
    const clips = [];
    ov.querySelectorAll(".vsClipS").forEach((el) => {
      const i = Number(el.dataset.i);
      const e = ov.querySelector('.vsClipE[data-i="' + i + '"]');
      clips.push({ start: Number(el.value), end: Number(e.value) });
    });
    V.busy = true; V.result = null; V.progress = 0; V.statusText = "作り直し中…";
    render();
    try {
      const j = await gasFetch_("videoUpdateClips", { job_id: V.jobId, clips });
      if (!j || j.error) throw new Error(j && j.error ? j.error : "再レンダリング失敗");
      poll();
    } catch (e) { V.busy = false; V.statusText = "❌ " + e.message; render(); }
  }

  render();
};

function recordFollow_(name) {
  var now = Date.now();
  try {
    var arr = JSON.parse(localStorage.getItem("xpl_follows") || "[]");
    arr.push(now);
    arr = arr.filter(function (t) { return t > now - 86400000; });
    localStorage.setItem("xpl_follows", JSON.stringify(arr));
  } catch (e) {}
  /* 誰をいつフォローしたか(非フォローバックの経過日数用・90日保持) */
  if (name) {
    try {
      var key = String(name).replace(/^@/, "");
      var log = JSON.parse(localStorage.getItem("xpl_follow_log") || "{}");
      if (!log[key]) log[key] = now;
      var cut = now - 90 * 86400000;
      Object.keys(log).forEach(function (k) { if (log[k] < cut) delete log[k]; });
      localStorage.setItem("xpl_follow_log", JSON.stringify(log));
    } catch (e) {}
  }
}

/* エラーメッセージ(error_msg)を人間語の「原因＋対処」に翻訳する。

function diagnoseErr(msg) {
  const m = String(msg || "");
  /* 今回ハマったやつ: X API公式の投稿クレジット切れ(402) */
  if (/402|CreditsDepleted|credits to fulfill|PaymentRequired/i.test(m))

  /* X連携トークンが失効 */
  if (/\b401\b|invalid or expired token|could not authenticate|unable to verify credentials/i.test(m))
    return { icon: "🔑", cause: "Xとの連携が切れてる(トークン失効)", fix: "設定からこのアカウントを再連携してください" };
  /* 重複投稿ガード(これは異常やない) */
  if (/重複|duplicate/i.test(m))
    return { icon: "♻️", cause: "同じ本文を最近投稿済み(重複ガードでスキップ)", fix: "本文を変えれば投稿できます。意図通りなら無視でOK" };
  /* 文字数オーバー */
  if (/\b403\b/.test(m) && /(280|文字|too long|length)/i.test(m))
    return { icon: "✂️", cause: "本文が長すぎる(280字オーバー)", fix: "本文を短くしてください" };
  /* 相手が返信制限中 or ブロックしてる(相手都合・異常やない) */
  if (/not permitted to perform|返信を制限してる投稿かブロック/i.test(m))
    return { icon: "🙅", cause: "相手が「返信できる人を制限」してる投稿(かブロックされてる)にリプしようとした", fix: "相手都合なのでスルーでOK。同じ相手で続くならその人はスキップしてください" };
  /* リプ先の投稿が消された(相手都合・異常やない) */
  if (/リプ先の投稿が削除済み|deleted or not visible|replied to a Tweet that is deleted/i.test(m))

  if (/一時ロック|locked|temporarily restricted/i.test(m))
    return { icon: "🔒", cause: "アカウントが一時ロックされている可能性", fix: "Xにログインしてロック解除の手続きをしてください" };
  /* 403 その他(規約/権限) */
  if (/\b403\b|forbidden/i.test(m))
    return { icon: "🚫", cause: "Xに投稿を拒否された(規約違反か権限不足の可能性)", fix: "本文の内容、またはアプリの読み書き権限を確認してください" };

    return { icon: "📡", cause: "通信エラー(一時的)", fix: "自動で再試行されます" };
  /* トークンが見つからない(未連携) */

/* AI利用料を機能別にSVG円グラフで描く。data=[{tag,cost,color}]。総額と円換算も出す。 */
function renderCostPie(box, data, title, modelData) {
  const total = data.reduce((s, d) => s + d.cost, 0);
  if (total <= 0) {
    box.innerHTML = '<div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px"><div style="font-weight:700;margin-bottom:4px">' + esc(title) + '</div><div style="font-size:12px;color:var(--muted)">まだAIの利用記録がありません。投稿生成・予想・先回りリプ等を動かすと、機能ごとの利用料がここに出ます。</div></div>';
    return;
  }
  /* === フラットなドーナツチャート(中央に合計) === */
  const cx = 85, cy = 85, r = 62, sw = 24;
  const C = 2 * Math.PI * r;
  const gap = data.length > 1 ? 2.5 : 0;      /* セグメント間の隙間 */
  let offset = 0, arcs = "";
  data.forEach((d) => {
    const frac = d.cost / total;
    const len = Math.max(0.01, frac * C - gap);
    arcs += '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="' + d.color + '" stroke-width="' + sw + '" stroke-dasharray="' + len.toFixed(2) + ' ' + (C - len).toFixed(2) + '" stroke-dashoffset="' + (-offset).toFixed(2) + '" transform="rotate(-90 ' + cx + ' ' + cy + ')"/>';

/* 直近7日間の日別AI利用料を棒グラフで描く。days=[{day,cost}](古い→新しい順) */
function renderCostBars(box, days, title) {
  const total7 = days.reduce((s, d) => s + d.cost, 0);
  const max = Math.max.apply(null, days.map((d) => d.cost).concat([0.000001]));
  const W = 300, H = 162, padL = 6, padR = 6, padT = 18, padB = 26;
  const chartH = H - padT - padB;
  const n = days.length, bw = (W - padL - padR) / n;
  const COL = { luna: "#14b8a6", haiku: "#00e5ff", sonnet: "#a855f7", gemini: "#4285f4", cloudrun: "#34a853", eleven: "#fbbf24", gtts: "#f97316", aivis: "#ec4899", stt: "#22c55e", other: "#94a3b8" };
  const LBL = { luna: "Luna", haiku: "Haiku", sonnet: "Sonnet", gemini: "Gemini", cloudrun: "Cloud Run", eleven: "ElevenLabs", gtts: "Google TTS", aivis: "Aivis", stt: "音声認識" };
  const baseY = padT + chartH;
  let bars = "";
  days.forEach((d, i) => {
    const x = padL + i * bw + bw * 0.18, w = bw * 0.64;
    let yCur = baseY;
    /* 下から haiku→sonnet→gemini→cloudrun→other で積み上げ */
    [["luna", d.luna || 0], ["haiku", d.haiku || 0], ["sonnet", d.sonnet || 0], ["gemini", d.gemini || 0], ["cloudrun", d.cloudrun || 0], ["eleven", d.eleven || 0], ["gtts", d.gtts || 0], ["aivis", d.aivis || 0], ["stt", d.stt || 0], ["other", d.other || 0]].forEach(function (kv) {
      const val = kv[1];
      if (val <= 0) return;
      const h = max > 0 ? (val / max) * chartH : 0;
      yCur -= h;
      bars += '<rect x="' + x.toFixed(1) + '" y="' + yCur.toFixed(1) + '" width="' + w.toFixed(1) + '" height="' + Math.max(0.5, h).toFixed(1) + '" fill="' + COL[kv[0]] + '"/>';
    });
    const totalH = max > 0 ? (d.cost / max) * chartH : 0;
    const topY = baseY - totalH;
    if (d.cost > 0) bars += '<text x="' + (x + w / 2).toFixed(1) + '" y="' + (topY - 4).toFixed(1) + '" font-size="9" fill="#eaf2fb" text-anchor="middle">¥' + Math.round(d.cost * 150) + '</text>';
    const mmdd = String(d.day).slice(5).replace("-", "/");
    bars += '<text x="' + (x + w / 2).toFixed(1) + '" y="' + (H - 9) + '" font-size="9.5" fill="var(--muted)" text-anchor="middle">' + mmdd + '</text>';
  });
  const baseline = '<line x1="' + padL + '" y1="' + baseY + '" x2="' + (W - padR) + '" y2="' + baseY + '" stroke="var(--border)" stroke-width="1"/>';
  /* 実際に使われたサービスだけ凡例に出す */
  const used = ["luna", "haiku", "sonnet", "gemini", "cloudrun", "eleven", "gtts", "aivis", "stt"].filter((k) => days.some((d) => (d[k] || 0) > 0));
  const legend = '<div style="display:flex;gap:12px;margin-top:8px;font-size:11px;color:var(--muted);flex-wrap:wrap">' +
    (used.length ? used : ["luna", "sonnet"]).map(function (k) {
      return '<span style="display:inline-flex;align-items:center;gap:5px"><span style="width:10px;height:10px;border-radius:2px;background:' + COL[k] + '"></span>' + LBL[k] + '</span>';
    }).join("") + '</div>';
  box.innerHTML = '<div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px">' +
    '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;gap:8px;flex-wrap:wrap">' +
    '<div style="font-weight:700">' + esc(title) + '</div>' +
    '<div style="font-size:13px;color:var(--accent);font-weight:700">7日計 $' + total7.toFixed(2) + ' <span style="color:var(--muted);font-weight:400">(約¥' + Math.round(total7 * 150) + ')</span></div></div>' +
    '<svg width="100%" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet" style="display:block">' + baseline + bars + '</svg>' +
    legend + '</div>';
}

/* リプ案を持ってXのリプ画面を開く(リプ文プリフィル)。iPhoneのXアプリでも開くようintentを使う。
   念のためクリップボードにもコピー(プリフィルが効かない端末では貼り付けでリプできる)。 */
function xReplyIntent(it, replyText, replyType) {
  var tweetId = (it && typeof it === "object") ? (it.tweet_id || "") : (it || "");
  /* tweet_idが空なら tweet_url(…/status/数字) からIDを抜く。これが無いと返信先が付かず独り言になる */
  if (!tweetId && it && typeof it === "object" && it.tweet_url) {
    var mm = String(it.tweet_url).match(/status\/(\d+)/);
    if (mm) tweetId = mm[1];
  }
  var url = tweetId
    ? "https://x.com/intent/tweet?in_reply_to=" + encodeURIComponent(tweetId) + "&text=" + encodeURIComponent(replyText || "")
    : "https://x.com/intent/tweet?text=" + encodeURIComponent(replyText || "");
  /* ジェスチャー内で最優先にXを開く(これより前に非同期処理を挟むとiOSがブロックするため) */
  var w = null;
  try { w = window.open(url, "_blank"); } catch (e) {}
  if (!w) { try { location.href = url; } catch (e) {} }   /* ポップアップがブロックされたら同じタブで開く */
  try { navigator.clipboard.writeText(replyText || ""); } catch (e) {}
  /* 接触ログを記録(フォロー転換の学習用)。Xを開いてページ離脱しても切れないようsendBeacon優先 */
  if (it && typeof it === "object") {
    try {
      var ageMin = it.posted_at ? Math.round((Date.now() - new Date(it.posted_at).getTime()) / 60000) : 0;
      var contact = {
        screen_name: it.screen_name || "",
        target: it.competitor || it.author_handle || it.target || "",
        competitor: it.competitor || "",
        reply_type: replyType || "",
        reply_text: replyText || "",
        tweet_id: tweetId,
        tweet_url: it.tweet_url || "",
        post_age_min: (ageMin > 0 && ageMin < 100000) ? ageMin : 0
      };
      try { gasReliable_("logContact", { contact: contact }); } catch (e) {}
    } catch (e) {}
  }
}

/* 投稿日時を「○分前/○時間前/○日前/M月D日」に整形 */
function timeAgo(createdAt) {
  if (!createdAt) return "";
  const d = new Date(createdAt);
  if (isNaN(d.getTime())) return "";
  const diffMs = Date.now() - d.getTime();
  const min = Math.floor(diffMs / 60000);
  if (min < 1) return "たった今";
  if (min < 60) return min + "分前";
  const hr = Math.floor(min / 60);
  if (hr < 24) return hr + "時間前";
  const day = Math.floor(hr / 24);
  if (day < 7) return day + "日前";
  return (d.getMonth() + 1) + "月" + d.getDate() + "日";
}

  return jp || en;
}

/* 現在のミックスDB(CFG.mixDBがあればそれ、無ければデフォルト) */
function shishaDB(){ return (CFG && CFG.mixDB) ? CFG.mixDB : SHISHA_DEFAULT_DB; }
function shAllItems(){const DB=shishaDB();const o=[];for(const b in DB)for(const n in DB[b])o.push({name:n,brand:b,v:DB[b][n]});return o;}
function shVget(name){const DB=shishaDB();for(const b in DB)if(DB[b][name])return DB[b][name];return[0,0,0,0,0,0];}
function shIsBanned(names){
  for(let i=0;i<names.length;i++)for(let j=i+1;j<names.length;j++){
    if(SHISHA_BANNED_SET.has([names[i],names[j]].sort().join("|"))) return true;
  }
  for(const s of SHISHA_DYN_CITRUS_BAN) if(names.includes(s)) for(const x of names) if(SHISHA_CITRUS.has(x)) return true;
  return false;
}
function shScoreCombo(combo){
  const names = combo.map(c=>c.name);
  if(new Set(names).size!==names.length) return {sc:-999};
  if(shIsBanned(names)) return {sc:-999};
  if(names.filter(n=>SHISHA_CITRUS.has(n)).length>=3) return {sc:-999};
  const acc = combo.filter(c=>SHISHA_ACCENT.has(c.name));
  if(acc.length>=2) return {sc:-999};
  if(combo.some(c=>SHISHA_ACCENT.has(c.name)&&c.ratio>=2)) return {sc:-999};
  const leadByRatio = combo.slice().sort((a,b)=>b.ratio-a.ratio)[0];
  if(shVget(leadByRatio.name)[5] < 7) return {sc:-999};
  let sc=70, ss=0, s=0, a=0;
  for(let i=0;i<names.length;i++)for(let j=i+1;j<names.length;j++){
    const r=shPairRank(names[i],names[j]);
    if(r==="SS"){sc+=9;ss++;} else if(r==="S"){sc+=6;s++;} else if(r==="A"){sc+=4;a++;}
  }
  if(ss>=2) sc=Math.max(sc,90);
  const vs=names.map(shVget);
  if(vs.filter(v=>v[0]>=8).length>=3) sc-=8;
  if(vs.filter(v=>v[3]>=7).length>=3) sc-=8;
  if(names.filter(n=>SHISHA_CITRUS.has(n)).length>=2) sc-=3;
  if(acc.length===1) sc+=3;
  sc=Math.min(sc,99);
  const rank = ss>=2?"SS":(ss+s>=1?"S":(a>=1?"A":""));
  return {sc, ss, s, a, rank, info:`SS${ss}/S${s}/A${a}`};
}
const shRatioFor = k => k===2?[6,4] : k===3?[6,3,1] : [5,2,2,1];
function shGenerate(audience, count){
  const items = shAllItems();
  const conf = SHISHA_AUD[audience]||SHISHA_AUD["おまかせ"];
  const banSet = conf.ban;
  let leads = items.filter(it=>it.v[5]>=7 && !SHISHA_ACCENT.has(it.name) && !SHISHA_CITRUS.has(it.name) && !banSet.has(it.name));
  if(conf.lead) leads = leads.filter(it=>conf.lead.includes(it.name)||conf.lead.includes(shNm(it.name)));
  if(leads.length===0) leads = items.filter(it=>it.v[5]>=7 && !SHISHA_ACCENT.has(it.name) && !SHISHA_CITRUS.has(it.name));
  const results=[], seen=new Set(); let tries=0;
  while(results.length<count && tries<4000){
    tries++;
    if(leads.length===0) break;
    const lead = leads[(Math.random()*leads.length)|0];
    const ln = lead.name;
    let mates = items.filter(it=>shPairRank(ln,it.name) && it.name!==ln && !banSet.has(it.name));
    if(mates.length===0) continue;
    const helper = mates[(Math.random()*mates.length)|0].name;
    let outlineCand = items.filter(it=>(shPairRank(ln,it.name)||SHISHA_CITRUS.has(it.name)) && ![ln,helper].includes(it.name) && !banSet.has(it.name));
    const useOutline = outlineCand.length>0 && Math.random()<0.85;
    const outline = useOutline ? outlineCand[(Math.random()*outlineCand.length)|0].name : null;
    const accChoices = ["ミント","ミント","ミント","アイス","アブソリュートゼロ"].filter(x=>!banSet.has(x));
    const acc = accChoices[(Math.random()*accChoices.length)|0];
    let parts=[ln,helper]; if(outline)parts.push(outline); parts.push(acc);
    parts=[...new Set(parts)];
    if(parts.length<2) continue;
    const ratios = shRatioFor(parts.length);
    const combo = parts.map((n,i)=>({name:n, ratio:ratios[i]||1}));
    const res = shScoreCombo(combo);
    if(res.sc>=80){
      const key=parts.slice().sort().join("|");
      if(seen.has(key)) continue;
      seen.add(key);
      results.push({combo, ...res});
    }
  }
  results.sort((a,b)=>b.sc-a.sc);
  return results;
}

function shAvg(combo, idx){
  let tot=0, w=0;
  combo.forEach(c=>{ const v=shVget(c.name); tot+=v[idx]*c.ratio; w+=c.ratio; });
  return w? tot/w : 0;
}

/* 予約投稿をDBに保存する共通関数。textが140字超なら自動でスレッド分割。
   既にthread指定がある場合(ミックス等)はそれを優先しつつ、1本目が長ければさらに分割。 */
async function saveScheduledPost(rec) {
  /* rec: { screen_name, text, scheduled_at, status, media_url?, thread? } */
  const existingThread = Array.isArray(rec.thread) ? rec.thread.slice() : [];
  const split = autoSplitThread(rec.text, 140);
  let finalText = split.text;
  let finalThread = [];
  if (split.thread) finalThread = finalThread.concat(split.thread);
  /* 既存のthread(2本目以降)も、それぞれ140字超なら分割して足す */
  existingThread.forEach((t) => {
    const s2 = autoSplitThread(t, 140);
    finalThread.push(s2.text);
    if (s2.thread) finalThread = finalThread.concat(s2.thread);
  });
  const payload = {
    screen_name: rec.screen_name,
    text: finalText,
    scheduled_at: rec.scheduled_at,
    status: rec.status || "draft",
    media_url: rec.media_url || null,
    thread: finalThread.length ? finalThread : null,
  };
  return await sb.from("scheduled_posts").insert(payload);
}

function shMixName(combo){ const s=combo.slice().sort((a,b)=>b.ratio-a.ratio); return (s[0]?s[0].name:"")+(s[1]?"×"+s[1].name:""); }

/* 長文を140字以内のツイート配列に自動分割する(スレッド用)。
   返り値 { text, thread } : text=1本目, thread=2本目以降(無ければnull)。
   段落(空行)→文(句点)→読点や区切り の順で、できるだけ文の意味が途切れない位置で割る。 */
function autoSplitThread(full, limit) {
  limit = limit || 140;
  const src = String(full || "").trim();
  if (src.length <= limit) return { text: src, thread: null };

  /* テキストを「これ以上分けたくない最小単位」に砕く。
     優先: 段落(空行) > 文末(。！？と改行) > 読点・中黒・スラッシュ > それでも長ければ単語境界 */
  function tokenize(text) {
    /* まず段落 */
    return text.split(/\n\s*\n/).map(s => s.trim()).filter(Boolean);
  }
  /* 1ピースが長すぎる時、自然な区切りでさらに砕く(文の途中で切らない) */
  function breakPiece(piece) {
    if (piece.length <= limit) return [piece];
    /* 文末(。！？)や改行で割る。区切り文字は前の文にくっつける */
    let parts = piece.split(/(?<=[。！？\n])/).map(s => s).filter(s => s.length);
    /* まだlimit超の塊があれば、読点・中黒・スラッシュ・空白で割る */
    const refined = [];
    parts.forEach(pt => {
      if (pt.length <= limit) { refined.push(pt); return; }
      let sub = pt.split(/(?<=[、，・/／\s])/).filter(s => s.length);
      let buf = "";
      sub.forEach(token => {
        if (token.length > limit) {
          /* 1トークンが長すぎる(URLや長い単語)→最終手段で機械的に割るが、できるだけ境界で */
          if (buf) { refined.push(buf); buf = ""; }
          for (let i = 0; i < token.length; i += limit) refined.push(token.slice(i, i + limit));
        } else if ((buf + token).length > limit) {
          if (buf) refined.push(buf);
          buf = token;
        } else {
          buf += token;
        }
      });
      if (buf) refined.push(buf);
    });
    return refined;
  }

  /* 段落を取り、各段落を必要なら砕いて、limit以内に詰め込む */
  const pieces = [];
  tokenize(src).forEach(block => { breakPiece(block).forEach(p => pieces.push(p)); });

  /* ピースを順に詰めてツイートを作る(境界をまたいで文を切らない) */
  const tweets = [];
  let cur = "";
  pieces.forEach(piece => {
    const sep = cur ? (cur.endsWith("\n") ? "" : "\n") : "";
    if ((cur + sep + piece).length > limit) {
      if (cur.trim()) tweets.push(cur.trim());
      cur = piece;
    } else {
      cur += sep + piece;
    }
  });
  if (cur.trim()) tweets.push(cur.trim());

  if (!tweets.length) return { text: src.slice(0, limit), thread: null };
  return { text: tweets[0], thread: tweets.length > 1 ? tweets.slice(1) : null };
}

/* カテゴリ→寄せたい客層(味の傾向のヒント) */
const SHISHA_SCENE_AUD = {
  "仕事":"重め","休日":"フルーツ系","深夜":"紅茶系","ご褒美":"スイーツ系","友達":"フルーツ系",
  "男性ウケ":"男性人気","女性ウケ":"女性人気","エモ":"紅茶系","旅行":"初心者","出張":"重め","金沢":"おまかせ","一人旅":"紅茶系",
};
/* ランダムにシーンを1つ選ぶ。dateStr(YYYY-MM-DD)を渡すと、その日に矛盾しない
   シチュエーションだけから選ぶ(給料日は25日前後だけ、等) */
function shPickScene(category, dateStr){
  /* 日付依存シーンの判定。dがその投稿日のDateで、trueなら使える */
  const d = dateStr ? new Date(dateStr+"T12:00:00") : new Date();
  const dom = d.getDate();         // 日(1-31)
  const dow = d.getDay();          // 0=日…6=土
  const lastDay = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
  /* 日付依存シーン → その日に合うかの判定 */
  const DATE_RULES = {
    "給料日":          () => dom>=24 && dom<=27,        // 25日前後
    "ボーナスが入った": () => (d.getMonth()===5||d.getMonth()===11) && dom>=8 && dom<=20, // 6月/12月中旬
    "有給の前日":      () => dow===4 || dow===5,        // 週後半に寄せる
    "給料日前なのに来てしまった": () => dom>=18 && dom<=24, // 給料日直前
    "出張最終日":      () => dow===4 || dow===5,        // 週後半
    "明日帰る":        () => dow===5 || dow===6 || dow===0, // 週末に寄せる
    "明日の仕事を忘れたい": () => dow===5 || dow===6,    // 金土の夜
    "金沢最後の夜":    () => dow===5 || dow===6 || dow===0,
    "記念日":          () => false, // 任意日には出さない(店が把握できないので自動からは除外)
    "誕生日":          () => false, // 同上
  };
  /* 候補シーンを集める(日付依存はルールに合う時だけ採用) */
  const cats = category ? [category] : Object.keys(SHISHA_SCENES);
  const pool = [];
  cats.forEach((cat) => {
    SHISHA_SCENES[cat].forEach((scene) => {
      const rule = DATE_RULES[scene];
      if (rule && !rule()) return; // 日付に合わないシーンは除外
      pool.push({ category: cat, scene, aud: SHISHA_SCENE_AUD[cat]||"おまかせ" });
    });
  });
  if (!pool.length) return null;
  return pool[Math.floor(Math.random()*pool.length)];
}

/* 投稿日(dateStr=YYYY-MM-DD)に当てはまるイベントを返す。なければnull */
function pickJpEvent(dateStr){
  const d = dateStr ? new Date(dateStr+"T12:00:00") : new Date();
  const m = d.getMonth()+1, day = d.getDate(), dow = d.getDay();
  const wk = Math.floor((day-1)/7)+1; /* 第何週か */
  const hits = JP_EVENTS.filter(e => { try { return e.match(m, day, dow, wk); } catch(_){ return false; } });
  if (!hits.length) return null;
  return hits[Math.floor(Math.random()*hits.length)];
}


/* おすすめミックスを投稿文にする(噂のシーシャBar用)
   scene指定があればそのシチュエーションに寄せる。Haikuで高速生成・性格はCFGから */
async function shMixPostText(audience, sceneObj, fixedMix){
  const aud = sceneObj ? sceneObj.aud : (audience||"おまかせ");
  let m;
  if (fixedMix) { m = fixedMix; }
  else { const picks = shGenerate(aud, 1); if (!picks.length) return null; m = picks[0]; }
  const haigou = m.combo.map(c=>c.name+"("+shBrandOf(c.name)+") "+c.ratio).join(" / ");
  const sweet=Math.round(shAvg(m.combo,0)), sour=Math.round(shAvg(m.combo,1)), cool=Math.round(shAvg(m.combo,2)), heavy=Math.round(shAvg(m.combo,3));
  /* v177: 画像メーター(5ドット・0許容)と星の数を完全一致させる。
     旧: 本文は6段階で最低★1保証→清涼感0でも★1が出て画像(0ドット)とズレていた。
     新: 本文も5段階・0許容で、画像の drawMeter(Math.round(v/2)) と同じ数値に揃える */
  const star5 = (v) => { const f=Math.max(0,Math.min(5,Math.round((v||0)/2))); return "★".repeat(f)+"☆".repeat(5-f); };
  const star = (v) => { const f=Math.max(1,Math.min(6,Math.round(v*6/10))); return "★".repeat(f)+"☆".repeat(6-f); };
  const osusume = m.sc>=90?6:(m.sc>=85?5:4);
  const gekioshi = m.ss>=3?6:(m.ss>=2?5:(m.ss>=1?4:3));
  /* 性格・文体をCFGから引っ張る */
  let persona = "";
  if (CFG.origProfile && CFG.origProfile.trim()) {
    persona = "\n【この店長の文体・性格(必ず再現)】\n" + CFG.origProfile + "\n";
  } else {
    const toneMap = { "カジュアル":"フランクでフレンドリー", "丁寧":"丁寧で落ち着いた", "ノリ重視":"テンション高めでノリのいい", "クール":"クールで大人っぽい" };
    persona = "\n口調: " + (toneMap[CFG.tone] || "自然体な") + "感じ。絵文字は" + (CFG.emoji||"少なめ") + "。\n";
  }
  /* 星評価ブロック(固定で付ける) */
  const starBlock =
    (sceneObj ? "マスターのオススメ度 "+star(8)+"\n" : "マスターのオススメ度 "+star(osusume*10/6)+"\n") +
    "激推し度 "+star(gekioshi*10/6)+"\n" +
    "甘さ "+star5(sweet)+" / 酸味 "+star5(sour)+"\n清涼感 "+star5(cool)+" / 吸いごたえ "+star5(heavy);
  const hoursClause = CFG.useHours
    ? `\n【営業時間】${CFG.openTime}〜${CFG.closeTime}。シーシャの来店はこの時間だけ。朝・昼など営業時間外に『今すぐ来て』『朝シーシャどうぞ』のような“今すぐ来店”を促す表現は絶対に書かない。来店に触れるなら営業時間(夜)を想定した自然な誘い方にする。基本はフレーバーの魅力を伝える内容でOK。\n`
    : "";
  const prompt =
    `金沢・片町のシーシャ店の店長として、おすすめミックスを紹介する短いX投稿の「本文だけ」を書く。\n` +
    persona + hoursClause +
    (sceneObj ? `\nこの投稿の切り口:「${sceneObj.scene}」という気分・状況の人に語りかける。この言葉を不自然に名詞化・言い換えせず、共感する一言から自然に始める。\n` : "") +
    `\nミックス: ${shMixName(m.combo)}\n配合: ${haigou}\n味: 甘さ${sweet}/酸味${sour}/清涼${cool}/吸いごたえ${heavy}(10段階)\n` +
    `\n書き方の注意(重要):\n` +
    `- AIっぽい・広告っぽい文章にしない。店長が実際にXでつぶやくようなリアルなノリでOK\n` +
    `- 「〜な夜に寄り添う」「登場」みたいなテンプレ広告表現は使わない\n` +
    `- 自然な日本語で書く。「〜した時間」「〜したい時」など、文法的に正しく自然な言い回しにする(不自然な体言止めや誤用をしない)\n` +
    `- フレーバー名は正式名称で正確に(略さない)。配合(銘柄と比率)は本文に1行入れる\n` +
    `- 「飲みごたえ」は誤り。シーシャなので「吸いごたえ」「煙」「キック」を使う\n` +
    `- 100〜130字程度。ハッシュタグは付けても1個\n` +
    `- 星評価は書かなくていい(こちらで後ろに付ける)\n` +
    `本文のみ出力・前置き禁止。`;
  /* Haikuで高速生成 */
  const text = await callAI(prompt, false, "luna"); /* ★v228: haiku→luna(GPT-5.6) */
  if (!text || !text.trim()) return null;
  const body = text.trim();
  /* 味の補足説明(2本目に入れる) */
  const flavorNote = "🌿味の詳細\n" + shMixName(m.combo) + "\n" + haigou;
  const second = flavorNote + "\n\n" + starBlock;
  /* 1本目+2本目を結合した時に140字以内なら1本、超えるならスレッド */
  const combined = body + "\n\n" + starBlock;
  if (combined.length <= 140) {
    return { thread: [combined] };
  }
  return { thread: [body, second] };
}

/* @やURLからユーザー名だけ取り出す(引用RTの対象指定用)。
   X/TwitterのURL(www./mobile./?s=..付き・status付き等)からも確実に抜く。認識できなければ空を返す(ゴミ登録を防ぐ) */
function quoteParseHandle_(s) {
  s = String(s || "").trim();
  if (!s) return "";
  s = s.split(/[?#\s]/)[0].trim(); /* クエリ/フラグメント/末尾スペースを除去 */
  const RES = /^(home|explore|notifications|messages|i|intent|search|hashtag|settings|compose|status|share|about|tos|privacy)$/i;
  const um = s.match(/(?:x|twitter)\.com\/@?([A-Za-z0-9_]{1,15})/i); /* X/TwitterのURL */
  if (um) return RES.test(um[1]) ? "" : um[1];
  if (/https?:\/\//i.test(s) || /\.[a-z]{2,}\//i.test(s)) return ""; /* X以外のURLっぽい→無効(ゴミ化させない) */
  const bm = s.replace(/^@/, "").match(/^([A-Za-z0-9_]{1,15})$/); /* 素の@handle / handle */
  return bm ? bm[1] : "";
}

/* ============ Supabase KV(設定保存) ============ */
async function kvGet(key, fallback) {
  const { data } = await sb.from("kv_store").select("value").eq("key", key).maybeSingle();
  return data && data.value !== null && data.value !== undefined ? data.value : fallback;
}
async function kvSet(key, value) {
  await sb.from("kv_store").upsert({ key, value, updated_at: new Date().toISOString() });
}

/* ============ AI呼び出し(GAS中継) ============ */
/* グローバル: GASにアクション+引数を送る(各タブから使える) */
async function gasFetch_(action, extra) {
  const { data } = await sb.auth.getSession();
  if (!data.session) throw new Error("ログインが切れた。リロードして。");
  _lastAuthToken = data.session.access_token;
  const res = await fetch(GAS_URL, {
    method: "POST", headers: { "Content-Type": "text/plain" },
    body: JSON.stringify(Object.assign({ auth: data.session.access_token, action }, extra || {})),
  });
  return await res.json();
}

/* ★v270 フロント→Supabase Edge直結(GASのfetch枠を一切使わない)。
   失敗時は呼び出し側でGAS経由に自動フォールバックする */
async function edgeFetch_(action, extra) {
  const { data } = await sb.auth.getSession();
  if (!data.session) throw new Error("ログインが切れた。リロードして。");
  const res = await fetch(SUPABASE_URL + "/functions/v1/worker", {
    method: "POST",
    headers: { "Content-Type": "application/json", "Authorization": "Bearer " + data.session.access_token, "apikey": SUPABASE_ANON },
    body: JSON.stringify(Object.assign({ action }, extra || {})),
  });
  const j = await res.json();
  if (j && j.error) throw new Error(j.error);
  return j;
}

async function callAI(prompt, useSearch, model, wantUrls) {
  const { data } = await sb.auth.getSession();
  if (!data.session) throw new Error("ログインが切れた。リロードして。");
  let lastUrls = [];
  const doFetch = async (p) => {
    /* ★v270 まずEdge直結(GAS枠ゼロ)。Edge未対応・障害時はGAS経由に自動フォールバック */
    try {
      const je = await edgeFetch_("ai", { prompt: p, useSearch: (typeof useSearch === "number") ? useSearch : !!useSearch, model: model || null });
      if (je && je.text) { lastUrls = je.urls || []; return je.text; }
    } catch (eEdge) { /* フォールバックへ */ }
    const res = await fetch(GAS_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify({ auth: data.session.access_token, prompt: p, useSearch: !!useSearch, model: model || null }),
    });
    const j = await res.json();
    if (j.error) throw new Error(j.error);
    lastUrls = j.urls || [];
    return j.text;
  };

  let text = await doFetch(prompt);

  /* 業種外題材の混入チェック。検索系(無料予想など)は対象外 */
  if (!useSearch && CFG.bizType && CFG.bizType.trim()) {
    const banned = bannedTopicsFor(CFG.bizType.trim());
    const hit = banned.find((w) => text.includes(w));
    if (hit) {
      /* 1回だけ、禁止題材を明示して作り直し */
      const retryPrompt = prompt +
        "\n\n【厳重注意・再生成】前回の生成は「" + hit + "」など『" + CFG.bizType.trim() +
        "』と無関係な題材を含んでいた。今回は絶対にそれらの題材・単語を一切使わず、『" +
        CFG.bizType.trim() + "』だけの内容で書き直せ。";
      const retry = await doFetch(retryPrompt);
      if (!banned.find((w) => retry.includes(w))) text = retry;
      else text = retry; // 2回目もダメなら諦めて返す(無限ループ防止)
    }
  }
  return wantUrls ? { text, urls: lastUrls } : text;
}

/* 業種ごとの「混ざってはいけない題材ワード」 */
/* 競合欄の入力(URL/@/素の名前が混在)を、1行1ユーザー名に整形する */
function normalizeCompetitors_(raw) {
  if (!raw) return "";
  /* 改行・カンマ・全角カンマ・スペースで区切る */
  const parts = String(raw).split(/[\n,、\s]+/).map(s=>s.trim()).filter(Boolean);
  const reserved = new Set(["home","explore","search","notifications","messages","settings","compose","intent","share","i","hashtag","tos","privacy","login","signup"]);
  const out = [];
  const seen = {};
  parts.forEach(p => {
    let name = "";
    /* @username or 素のusername */
    const direct = p.replace(/^@/, "");
    if (/^[A-Za-z0-9_]{1,15}$/.test(direct)) {
      name = direct;
    } else {
      /* URLとして解釈してみる(先頭@を剥がしたdirectを使う。@https://… でも壊れないように) */
      let s = direct;
      if (!/^https?:\/\//i.test(s)) s = "https://" + s;
      try {
        const u = new URL(s);
        const host = u.hostname.toLowerCase().replace(/^www\./,"").replace(/^mobile\./,"");
        if (host === "x.com" || host === "twitter.com") {
          const seg = u.pathname.split("/").filter(Boolean);
          if (seg.length) {
            const cand = seg[0].replace(/^@/, "");
            if (/^[A-Za-z0-9_]{1,15}$/.test(cand) && !reserved.has(cand.toLowerCase())) name = cand;
          }
        }
      } catch(e) { /* URLとして無効なら捨てる */ }
    }
    if (name && !reserved.has(name.toLowerCase())) {
      const low = name.toLowerCase();
      if (!seen[low]) { seen[low] = true; out.push(name); }
    }
  });
  return out.join("\n");
}

function bannedTopicsFor(bizType) {
  const b = bizType;
  const isBoat = /競艇|ボート|レース|公営競技|舟券/.test(b);
  const isShisha = /シーシャ|シーシャ|水たばこ|水タバコ|フーカー|hookah|shisha/i.test(b);
  const LISTS = {
    boat: ["万舟","舟券","競艇","ボートレース","回収率","本命","穴狙い","3連単","レース","出走","選手","モーター","予想"],
    shisha: ["シーシャ","水たばこ","水タバコ","フレーバー","フーカー","ミックス","チャコール","ボウル","煙"],
  };
  let banned = [];
  /* 競艇系アカウントでなければ競艇ワードを禁止 */
  if (!isBoat) banned = banned.concat(LISTS.boat);
  /* シーシャ系アカウントでなければシーシャワードを禁止 */
  if (!isShisha) banned = banned.concat(LISTS.shisha);
  return banned;
}

/* 成長プランの[機能名]タップでその機能の場所へ直ジャンプ(投稿タブに切替→該当ボタンをクリック&スクロール) */
function xplGoFeature(label) {
  try {
    const parts = String(label || "").replace(/[\[\]]/g, "").split("/").map(t => t.trim()).filter(Boolean);
    parts.sort((a, b) => {
      const ra = (a.indexOf("競合フォロワー") >= 0 || a.indexOf("業種をRT") >= 0) ? 1 : 0;
      const rb = (b.indexOf("競合フォロワー") >= 0 || b.indexOf("業種をRT") >= 0) ? 1 : 0;
      return rb - ra;
    });
    showTab("calendar");
    if (typeof renderNav === "function") renderNav();
    const saved = localStorage.getItem("xpl_home_acct") || "";
    let tries = 0;
    const attempt = () => {
      tries++;
      if (window.XPL_CAL && window.XPL_CAL.hasAccounts()) {
        window.XPL_CAL.setAccount(saved); /* ホームで選んだクライアントを紐付け */
        setTimeout(() => {
          let done = null;
          for (const pt of parts) { done = window.XPL_CAL.openFeature(pt); if (done !== null) break; }
          if (done === null) {
            /* 未対応の機能名は従来のボタン探しにフォールバック */
            const norm = (t) => String(t || "").replace(/\s+/g, "");
            const btns = Array.from(document.querySelectorAll("button"));
            for (const pt of parts) {
              const hit = btns.find(b => b.textContent && norm(b.textContent).indexOf(norm(pt)) >= 0);
              if (hit) { hit.scrollIntoView({ behavior: "smooth", block: "center" }); setTimeout(() => hit.click(), 250); break; }
            }
          }
        }, 200);
      } else if (tries < 25) {
        setTimeout(attempt, 200); /* アカウント一覧の読み込み待ち(最大5秒) */
      }
    };
    attempt();
  } catch (e) {}
}

let _toastTimer = null;
function toast(text, type) {

function head(el, title, desc, steps) {

function fld(el, label) {
  const l = document.createElement("label"); l.className = "fld"; l.textContent = "▸ " + label; el.appendChild(l);
}
function ta(el, rows, ph) {
  const t = document.createElement("textarea"); t.rows = rows; t.placeholder = ph || ""; el.appendChild(t); return t;
}
function inp(el, ph, type) {
  const t = document.createElement("input"); t.type = type || "text"; t.placeholder = ph || ""; el.appendChild(t); return t;
}
function chipsSingle(el, options, initial, cyan, onChange) {
  const w = document.createElement("div"); w.className = "chips"; el.appendChild(w);
  const state = { value: initial };
  function draw() {
    w.innerHTML = "";
    options.forEach((o) => {
      const c = document.createElement("button");
      c.className = "chip" + (state.value === o ? (cyan ? " on cyan" : " on") : "");
      c.textContent = o;
      c.onclick = () => { state.value = o; draw(); if (onChange) onChange(o); };
      w.appendChild(c);
    });
  }
  draw(); return state;
}
function chipsMulti(el, options, initial) {
  const w = document.createElement("div"); w.className = "chips"; el.appendChild(w);
  const state = { values: initial.slice() };
  function draw() {
    w.innerHTML = "";
    options.forEach((o) => {
      const c = document.createElement("button");
      c.className = "chip" + (state.values.includes(o) ? " on cyan" : "");
      c.textContent = o;
      c.onclick = () => {
        state.values = state.values.includes(o) ? state.values.filter((x) => x !== o) : [...state.values, o];
        draw();
      };
      w.appendChild(c);
    });
  }
  draw(); return state;
}
function runBtn(el, label) {
  const b = document.createElement("button"); b.className = "btn"; b.textContent = label; el.appendChild(b); return b;
}
function outArea(el) {
  const e = document.createElement("div"); el.appendChild(e);
  return {
    box: e,
    err(m) { e.innerHTML = m ? '<div class="err">⚠ ' + esc(m) + "</div>" : ""; },
    show(text) {
      e.innerHTML = '<div class="out"><button class="copybtn">コピー</button><pre></pre></div>';
      e.querySelector("pre").textContent = text;
      const cb = e.querySelector(".copybtn");
      cb.onclick = () => { navigator.clipboard.writeText(text); cb.textContent = "コピー済"; setTimeout(()=>cb.textContent="コピー",1500); };
    },
    clear() { e.innerHTML = ""; },
  };
}
async function runAI(btn, out, promptFn, useSearch) {
  out.clear(); out.err("");
  btn.disabled = true; const orig = btn.textContent; btn.textContent = "処理中…";
  try { out.show(await callAI(promptFn(), useSearch)); }
  catch (e) { out.err(e.message); }
  btn.disabled = false; btn.textContent = orig;
}

function aiTab(el, cfg) {
  head(el, cfg.title, cfg.desc, cfg.steps);

  /* 対象アカウント選択(そのアカウントの設定で生成) */
  let acctVal = S.activeAccount;
  const actives = S.clients.filter((c)=>c.status==="active");
  if (actives.length) {
    fld(el, "対象アカウント");
    const asel = document.createElement("select");
    const od = document.createElement("option"); od.value = "_default_"; od.textContent = "共通設定(既定)"; asel.appendChild(od);
    actives.forEach((c)=>{ const o=document.createElement("option"); o.value=c.screen_name; o.textContent="@"+c.screen_name; asel.appendChild(o); });
    asel.value = S.activeAccount;
    asel.onchange = () => { acctVal = asel.value; };
    el.appendChild(asel);
    const note = document.createElement("p"); note.className = "desc"; note.style.margin = "6px 0 0";
    note.textContent = "選んだアカウントの業種・性格・文体に合わせて分析・生成する。";
    el.appendChild(note);
  }

  const refs = {};
  cfg.fields.forEach((f) => {
    fld(el, f.label);
    if (f.type === "ta") refs[f.key] = ta(el, f.rows, f.ph);
    else if (f.type === "in") {
      refs[f.key] = inp(el, f.ph);
      if (f.normalizeUser) {
        const _i = refs[f.key];
        _i.addEventListener("change", () => {
          const raw = (_i.value || "").trim();
          if (!raw) return;
          const nv = normalizeCompetitors_(raw);
          const first = Array.isArray(nv) ? nv[0] : String(nv).split(/[\n,、\s]+/).filter(Boolean)[0];
          if (first) _i.value = "@" + first;
        });
      }
    }
    else if (f.type === "chips") refs[f.key] = chipsSingle(el, f.options, f.options[0]);
    else if (f.type === "multi") refs[f.key] = chipsMulti(el, f.options, f.initial || []);
  });
  const btn = runBtn(el, cfg.btn);
  const out = outArea(el);
  btn.onclick = async () => {
    const v = {};
    for (const k in refs) v[k] = refs[k].value !== undefined ? refs[k].value : (refs[k].values || refs[k].value);
    cfg.fields.forEach((f) => { if (f.type === "ta" || f.type === "in") v[f.key] = refs[f.key].value; });
    if (!cfg.validate(v)) { out.err("入力が足りん。"); return; }
    await loadCfgFor(acctVal || "_default_"); // 選んだアカウントの設定を適用
    runAI(btn, out, () => cfg.prompt(v), cfg.useSearch);
  };
}

        html += '<div style="font-size:12px;color:var(--accent);margin-top:3px;line-height:1.55">→ ' + esc(causeLine) + '</div>';
        html += '<div style="font-size:10px;color:var(--muted);margin-top:4px">' + esc(accts) + ' / 一番古いの ' + oldest + '</div>';
        html += '</div>';
        stuckBox.innerHTML = html; stuckBox.style.display = "block";
      }
    } catch (e) {}
    /* 投稿(scheduled_posts)の失敗を診断して出す。同じ原因はまとめて件数表示。 */
    try {
      const since = new Date(Date.now() - 48 * 3600000).toISOString();
      const { data: sp } = await sb.from("scheduled_posts").select("error_msg,screen_name,scheduled_at").eq("status", "error").gte("scheduled_at", since).order("scheduled_at", { ascending: false }).limit(50);
      const spErrs = (sp || []).filter((e) => {
        if (!e.error_msg) return false;
        const d = diagnoseErr(e.error_msg);
        if (d.cause.indexOf("重複") >= 0) return false;            /* 重複スキップは正常動作なので隠す */
        const lp = lastOK[e.screen_name];
        return !lp || e.scheduled_at > lp;                          /* 最後の成功より後のエラーだけ＝未解決 */
      });
      if (spErrs.length) {
        const groups = {};
        spErrs.forEach((e) => {
          const d = diagnoseErr(e.error_msg);
          if (!groups[d.cause]) groups[d.cause] = { d: d, count: 0, sample: e.error_msg, accts: new Set(), last: e.scheduled_at };
          groups[d.cause].count++;
          if (e.screen_name) groups[d.cause].accts.add(e.screen_name);
        });
        let html = '<div style="background:rgba(255,123,123,.13);border:1px solid var(--bad);border-radius:10px;padding:12px">';
        html += '<div style="font-weight:700;color:var(--bad);margin-bottom:4px">🛑 オート投稿でエラーが出てる(未解決)</div>';
        html += '<div style="font-size:11px;color:var(--muted);margin-bottom:2px">原因を直して1回でも投稿が成功したら、この表示は自動で消える。</div>';
        Object.keys(groups).forEach((k) => {
          const g = groups[k];
          const accts = Array.from(g.accts).map((a) => "@" + a).join(" ");
          const tm = String(g.last || "").slice(5, 16).replace("T", " ");
          html += '<div style="margin-top:9px;padding-top:9px;border-top:1px solid var(--border)">';
          html += '<div style="font-size:13px;font-weight:700">' + g.d.icon + " " + esc(g.d.cause) + ' <span style="color:var(--muted);font-weight:400">×' + g.count + "件</span></div>";
          html += '<div style="font-size:12px;color:var(--accent);margin-top:3px;line-height:1.5">→ ' + esc(g.d.fix) + "</div>";
          html += '<div style="font-size:10px;color:var(--muted);margin-top:3px">' + esc(accts) + (tm ? " / 最後の失敗 " + tm : "") + "</div>";
          html += '<details style="margin-top:4px"><summary style="font-size:10px;color:var(--muted);cursor:pointer">元のエラー文を見る</summary><div style="font-size:10px;color:var(--bad);word-break:break-all;margin-top:3px">' + esc(g.sample) + "</div></details>";
          html += "</div>";
        });
        html += "</div>";
        postErrBox.innerHTML = html; postErrBox.style.display = "block";
      }
    } catch (e) {}
    try {
      const todayJST2 = new Date(Date.now() + 9 * 3600000).toISOString().slice(0, 10);
      const { data: aq } = await sb.from("auto_queue").select("kind,status,error_msg,screen_name,scheduled_at").eq("run_date", todayJST2).eq("status", "error");
      /* 「(対象レースなし)」等のカッコ始まりは正常スキップなので除外。
         さらに「最後に投稿成功した時刻」より前の生成エラーは解決済みとみなして隠す(04:39の古いやつ対策)。 */
      const errs = (aq || []).filter((e) => !String(e.error_msg || "").startsWith("(対象レース") && (!lastOK[e.screen_name] || String(e.scheduled_at || "") > lastOK[e.screen_name]));
      if (errs.length) {
        const kindJP = { trend: "トレンド", enjou: "炎上ニュース", normal: "通常投稿", flavor: "フレーバー", yosou: "予想(人気順)", yosou_score: "予想(スコア)", yokoku: "レース予告" };
        let html = '<div style="background:rgba(255,123,123,.12);border:1px solid var(--bad);border-radius:10px;padding:11px">';
        html += '<div style="font-weight:700;color:var(--bad);margin-bottom:4px">⚠️ オート投稿でエラー ' + errs.length + '件</div>';
        html += '<div style="font-size:11px;color:var(--muted);margin-bottom:6px">下の原因を直すか、生成設定をご確認ください。直れば次回から自動で復帰します。</div>';
        errs.forEach((er) => {
          const tm = String(er.scheduled_at || "").slice(11, 16);
          html += '<div style="font-size:12px;line-height:1.55;margin-top:7px;padding-top:7px;border-top:1px solid var(--border)">・<b>' + esc(kindJP[er.kind] || er.kind || "") + '</b> <span style="color:var(--muted)">@' + esc(er.screen_name || "") + (tm ? " " + tm : "") + '</span><br><span style="color:var(--bad)">' + esc(er.error_msg || "原因不明") + '</span></div>';
        });
        html += '</div>';
        autoErrBox.innerHTML = html; autoErrBox.style.display = "block";
      }
    } catch (e) {}
    if (acctName) {
      try {
        const recs = await kvGet("followers:" + acctName, []);
        const fs = (recs || []).filter((r) => r.platform === "X:フォロワー").sort((a, b) => a.date.localeCompare(b.date));
        if (fs.length) {
          const now = fs[fs.length - 1].count;
          cFoll.val.textContent = now.toLocaleString();
          if (fs.length > 1) {
            const diff = now - fs[fs.length - 2].count;
            const arrow = diff > 0 ? "▲" : (diff < 0 ? "▼" : "→");
            const col = diff > 0 ? "var(--ok)" : (diff < 0 ? "var(--bad)" : "var(--muted)");
            cFoll.sub.innerHTML = '<span style="color:var(--muted)">@' + acctName + '</span>　<b style="color:' + col + '">前日比 ' + arrow + (diff > 0 ? "+" : "") + diff.toLocaleString() + '</b>';
          } else {
            cFoll.sub.textContent = "@" + acctName + "  前日比は記録2日分で表示";
          }
        } else { cFoll.val.textContent = "—"; cFoll.sub.textContent = "推移記録で取得"; }
      } catch (e) { cFoll.val.textContent = "—"; }
    } else { cFoll.val.textContent = "—"; }
    /* token_usageは1日数百行貯まるため、Supabaseの1回1000行上限だと新しい日が切り捨てられる。1000行ずつ全件取得する */
    async function fetchAllUsage(sel, sinceVal) {
      let all = [], from = 0; const page = 1000;
      for (let guard = 0; guard < 50; guard++) {
        const { data, error } = await sb.from("token_usage").select(sel).gte("day", sinceVal).order("id", { ascending: true }).range(from, from + page - 1);
        if (error || !data || !data.length) break;
        all = all.concat(data);
        if (data.length < page) break;
        from += page;
      }
      return all;
    }
    /* AI利用料を機能タグ別に集計して円グラフ表示(今月分) */
    try {
      const monthStart = new Date(Date.now() + 9 * 3600000).toISOString().slice(0, 8) + "01";
      const tu = await fetchAllUsage("tag,cost_usd,model", monthStart);
      const byTag = {};
      const byModel = { Luna: 0, Haiku: 0, Sonnet: 0, Gemini: 0, "Cloud Run": 0, ElevenLabs: 0, "Google TTS": 0, Aivis: 0, "音声認識": 0, "その他": 0 };
      (tu || []).forEach((r) => {
        const t = r.tag || "その他"; byTag[t] = (byTag[t] || 0) + (Number(r.cost_usd) || 0);
        const mk = MODEL_KIND_(r.model);
        byModel[mk] += (Number(r.cost_usd) || 0);
      });
      const colors = ["#10b981", "#00e5ff", "#a855f7", "#f59e0b", "#ef4444", "#3b82f6", "#ec4899", "#84cc16"];
      const arr = Object.keys(byTag).map((t) => ({ tag: t, cost: byTag[t] })).sort((a, b) => b.cost - a.cost).map((d, i) => ({ tag: d.tag, cost: d.cost, color: colors[i % colors.length] }));
      const modelData = [
        { name: "Luna", cost: byModel.Luna, color: "#14b8a6" },
        { name: "Haiku", cost: byModel.Haiku, color: "#00e5ff" },
        { name: "Sonnet", cost: byModel.Sonnet, color: "#a855f7" },
        { name: "Gemini", cost: byModel.Gemini, color: "#4285f4" },
        { name: "Cloud Run", cost: byModel["Cloud Run"], color: "#34a853" },
        { name: "ElevenLabs", cost: byModel.ElevenLabs, color: "#fbbf24" },
        { name: "Google TTS", cost: byModel["Google TTS"], color: "#f97316" },
        { name: "Aivis", cost: byModel.Aivis, color: "#ec4899" },
        { name: "音声認識", cost: byModel["音声認識"], color: "#22c55e" },
        { name: "その他", cost: byModel["その他"], color: "#94a3b8" },
      ];
      renderCostPie(costPieBox, arr, "💰 今月のAI利用料(機能別)", modelData);
    } catch (e) { renderCostPie(costPieBox, [], "💰 今月のAI利用料(機能別)"); }
    /* 直近7日間の日別利用料(棒グラフ) */
    try {
      const since7 = new Date(Date.now() + 9 * 3600000 - 6 * 86400000).toISOString().slice(0, 10);
      const tu7 = await fetchAllUsage("cost_usd,day,model", since7);
      const byDayModel = {};
      const ZERO_ = () => ({ luna: 0, haiku: 0, sonnet: 0, gemini: 0, cloudrun: 0, eleven: 0, gtts: 0, aivis: 0, stt: 0, other: 0 });
      (tu7 || []).forEach((r) => {
        const k = String(r.day).slice(0, 10);
        if (!byDayModel[k]) byDayModel[k] = ZERO_();
        const mk = MODEL_KEY_(r.model);
        byDayModel[k][mk] += (Number(r.cost_usd) || 0);
      });
      const days7 = [];
      for (let i = 6; i >= 0; i--) {
        const dd = new Date(Date.now() + 9 * 3600000 - i * 86400000).toISOString().slice(0, 10);
        const m = byDayModel[dd] || ZERO_();
        days7.push({
          day: dd, luna: m.luna, haiku: m.haiku, sonnet: m.sonnet, gemini: m.gemini, cloudrun: m.cloudrun, eleven: m.eleven, gtts: m.gtts, aivis: m.aivis, stt: m.stt, other: m.other,
          cost: m.luna + m.haiku + m.sonnet + m.gemini + m.cloudrun + m.eleven + m.gtts + m.aivis + m.stt + m.other,
        });
      }
      renderCostBars(costBarBox, days7, "📊 直近7日間(サービス別)");
    } catch (e) {}
  })();
};

/* フレーバーから自然の風景とタイトルをルールで振り分け(追加課金なし) */
const SCENE_MAP = [

function shScene_(combo){
  const sorted=combo.slice().sort((a,b)=>b.ratio-a.ratio);
  const names=sorted.map(c=>c.name).join("");
  const lead=sorted[0]?sorted[0].name:"";
  /* 風景はキーワードで決める(フォールバックは属性) */
  let scene="明るく爽やかな自然の庭";
  for(const m of SCENE_MAP){ if(m.kw.some(k=>names.includes(k))){ scene=m.scene; break; } }
  if(scene==="明るく爽やかな自然の庭"){
    const cool=shAvg(combo,2), sweet=shAvg(combo,0), sour=shAvg(combo,1);
    if(cool>=6) scene="爽やかな水辺の高原"; else if(sour>=6) scene="陽光あふれる柑橘畑"; else if(sweet>=6) scene="やさしい光の花畑と果樹園";
  }
  /* タイトル: リードフレーバー名 + 雰囲気語。配合内容から確定的に選ぶので毎回違いつつ同じ配合は同じになる */
  const MOODWORDS=["の午後","薫る午前","のひととき","日和","の余韻","ブレンド","の小休止","薫る一服","のしらべ","の物語","に誘われて","の風景","咲くテラス","の彩り","の息吹","に揺れて","の隠れ家","のごほうび","とまどろみ","の贈りもの"];
  /* 配合(名前+比率)からハッシュ→雰囲気語インデックス(同じ配合は毎回同じ、違えば必ず変わる) */
  let hash=0; const seed=sorted.map(c=>c.name+c.ratio).join("|");
  for(let i=0;i<seed.length;i++){ hash=((hash<<5)-hash+seed.charCodeAt(i))|0; }
  const word=MOODWORDS[Math.abs(hash)%MOODWORDS.length];
  const title=lead+word;
  return { scene, title };
}
/* 今の時刻から時間帯の空気感を決める */

/* 透明ガラス風の立体的な星を描く */
function drawGlassStar_(ctx, cx, cy, r) {
  ctx.save();
  ctx.beginPath();
  for (let i=0;i<5;i++){
    const oa=(Math.PI*2/5)*i - Math.PI/2, ia=oa+Math.PI/5;
    const ox=cx+Math.cos(oa)*r, oy=cy+Math.sin(oa)*r;
    const ix=cx+Math.cos(ia)*r*0.42, iy=cy+Math.sin(ia)*r*0.42;
    if(i===0) ctx.moveTo(ox,oy); else ctx.lineTo(ox,oy);
    ctx.lineTo(ix,iy);
  }
  ctx.closePath();
  const g=ctx.createRadialGradient(cx-r*0.25,cy-r*0.3,r*0.05,cx,cy,r*1.1);
  g.addColorStop(0,"rgba(255,255,255,0.97)"); g.addColorStop(0.45,"rgba(255,250,235,0.62)"); g.addColorStop(1,"rgba(255,236,195,0.42)");
  ctx.fillStyle=g; ctx.shadowColor="rgba(255,240,205,0.9)"; ctx.shadowBlur=16; ctx.fill();
  ctx.shadowBlur=0; ctx.lineWidth=1.5; ctx.strokeStyle="rgba(255,255,255,0.92)"; ctx.stroke();
  ctx.beginPath(); ctx.arc(cx-r*0.28,cy-r*0.32,r*0.14,0,Math.PI*2); ctx.fillStyle="rgba(255,255,255,0.96)"; ctx.fill();
  ctx.restore();
}
/* 自動補充: 在庫(未来のpending)を常に2本キープ。0になる前に補充するので切れてエラーになりにくい。1時間に1回まで(課金暴発を防ぐ) */
async function checkAndRefillStock(wrapEl){
  try {
    const screen = (typeof S!=="undefined" && S.activeAccount) ? S.activeAccount : (CFG.account||"");
    if (!screen) return;
    const last = parseInt(localStorage.getItem("xpl_refill_ts_"+screen)||"0",10);
    if (Date.now() - last < 3600*1000) return; /* 直近1時間に補充済みならスキップ */
    const nowIso = new Date().toISOString();
    const { data } = await sb.from("scheduled_posts").select("id").eq("screen_name", screen).eq("status","pending").gte("scheduled_at", nowIso);
    const stock = (data||[]).length;
    const TARGET = 2; /* 常に2本の在庫をキープ(切れる前に補充するのでエラーになりにくい) */
    if (stock < TARGET) {
      localStorage.setItem("xpl_refill_ts_"+screen, String(Date.now()));
      await prepareFlavorPosts(Math.min(2, TARGET - stock), wrapEl, true); /* 第3引数=静かに(自動補充では赤エラーを出さない) */
    }
  } catch(e) {}
}
/* 画像つきシーシャ投稿を数本まとめて作って予約(作り置き)。背景生成→文字合成→scheduled_postsに予約 */
async function prepareFlavorPosts(count, wrapEl, silent){
  const out = wrapEl ? wrapEl.querySelector("#stockOut") : null;
  const setMsg = (m,err)=>{ if(out && !(silent && err)) out.innerHTML = '<div style="color:'+(err?"#ff6b6b":"#10b981")+'">'+esc(m)+'</div>'; };
  const screen = (typeof S!=="undefined" && S.activeAccount) ? S.activeAccount : (CFG.account||"");
  if (!screen) { setMsg("アカウントが選べてない",1); return; }
  let made=0;
  let cursor = Date.now() + 2*3600*1000;
  for (let i=0;i<count;i++){
    setMsg("生成中… "+(i+1)+"/"+count+"本目（画像に時間かかります）");
    try {
      const picks = shGenerate("おまかせ", 1);
      if (!picks.length) continue;
      const p = picks[0];
      const res = await shMixPostText("おまかせ", null, p);
      if (!res || !res.thread || !res.thread.length) continue;
      let media = null;
      const ir = await gasFetch_("shishaImage", { prompt: naturePrompt_(p.combo) });
      const bg = (ir && ir.b64) ? ir.b64 : ((ir && ir.url) ? ir.url : null);
      if (bg) {
        const sc = shScene_(p.combo);
        const flist = p.combo.slice().sort((a,b)=>b.ratio-a.ratio).map(c=>c.name+"("+shBrandOf(c.name)+") "+c.ratio);
        const osusume = p.sc>=90?6:(p.sc>=85?5:4);
        media = await composeShishaImage_(bg, { mood:"今日の気分", title:sc.title, flavors:flist, shop:"噂のシーシャBar", stars:osusume, season:(new Date().getMonth()+1)+"月の推し", meters:{ 甘さ:Math.round(shAvg(p.combo,0)), 酸味:Math.round(shAvg(p.combo,1)), 清涼感:Math.round(shAvg(p.combo,2)) } });
      }
      cursor += (22 + Math.random()*5) * 3600 * 1000; /* 約1日おき(22〜27h)に予約=1日1本ペース。時刻は自然にばらす */

function composeShishaImage_(bg, opts) {

        let g=ctx.createLinearGradient(0,0,580,0); g.addColorStop(0,"rgba(252,250,248,0.6)"); g.addColorStop(0.5,"rgba(252,250,248,0.35)"); g.addColorStop(0.8,"rgba(252,250,248,0.12)"); g.addColorStop(1,"rgba(252,250,248,0)");
        ctx.fillStyle=g; ctx.fillRect(0,0,580,H);

          ctx.font=font; ctx.lineJoin="round";
