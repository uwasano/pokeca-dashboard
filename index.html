    yosouOut.appendChild(tabRow);
    yosouOut.appendChild(statBox);

    const _psCache = {}; /* v159: 成績キャッシュ(新しい的中が入るまで内容は不変のため、タブ切替を即表示にする) */
    /* ★v230: 「選択アカ1個だけ」でなく、予想を出してる全アカウントをアカ別に並べて表示する。
       選択中アカの本日/昨日パネルだけは従来通り先頭に出す(今日勝ってる？がすぐ分かるように) */
    async function renderStats(days) {
      const acc = acct.value || null;
      const psKey = "ALL|" + days;
      if (_psCache[psKey]) { paintAll(_psCache[psKey], days, acc); } /* キャッシュ即表示→裏で最新を取得して上書き */
      else statBox.innerHTML = '<div class="muted" style="padding:10px">集計中…</div>';
      try {
        /* ★v270 Edge直結(GAS枠ゼロ・枠切れ中でも動く)→ダメならGAS経由 */
        let j;
        try { j = await edgeFetch_("stats", { days }); }
        catch (eEdge) { j = await gasFetch_("predStatsAll", { days }); }
        const dayGet = async (off) => {
          try { return await edgeFetch_("statsDay", { screen_name: acc || undefined, dayOffset: off }); }
          catch (e2) { return await gasFetch_("predStatsDay", { screen_name: acc || undefined, dayOffset: off }); }
        };
        try {
          const [td, yd] = await Promise.all([dayGet(0), dayGet(1)]);
          j._today = td; j._yday = yd; j._selAcc = acc;
        } catch (e) {}
        _psCache[psKey] = j;
        paintAll(j, days, acc);
      } catch (e) { if (!_psCache[psKey]) statBox.innerHTML = '<div class="err">' + esc(e.message) + '</div>'; }
    }
    function paintAll(j, days, acc) {
      try {
        const NAME = { popular:"人気順シンプル", score:"直前スコア厳選" };
        const periodLabel = days===7 ? "週間(7日)" : "月間(30日)";
        const fmt = (iso) => { if(!iso) return "—"; const d=new Date(iso); return (d.getMonth()+1)+"/"+d.getDate()+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); };
        const accounts = (j && j.accounts) ? j.accounts : [];
        /* 📅 選択中アカの本日＋昨日パネル(先頭に表示) */
        const dayPanel = (d, label) => {
          if (!d) return "";
          if (d.races > 0) {
            const roiColor = d.roi >= 100 ? "#33cc88" : "#ff8866";
            const profColor = d.profit >= 0 ? "#3DFFA8" : "#ff8866";
            const prof100 = Math.round(d.profit);
            return '<div class="card" style="padding:12px;margin-top:8px;border:1px solid '+(label==="本日"?"var(--accent2)":"var(--border)")+'"><div style="font-weight:800;margin-bottom:6px">📅 '+label+'の成績 <span class="muted" style="font-size:11px;font-weight:400">('+label+'公開した無料全レース)</span></div>'
              + '<div style="display:flex;gap:14px;flex-wrap:wrap;font-size:14px"><div>的中率 <b>'+d.hitRate+'%</b></div>'
              + '<div>回収率 <b style="color:'+roiColor+'">'+d.roi+'%</b></div>'
              + '<div class="muted" style="font-size:13px">('+d.hits+'/'+d.races+'レース)</div></div>'
              + '<div style="font-size:12px;margin-top:6px;line-height:1.8" class="muted">100円ずつ買った場合の収支: <b style="color:'+profColor+'">'+(prof100>=0?"+":"")+'¥'+prof100.toLocaleString()+'</b>'
              + (d.pending?'<br>結果待ち '+d.pending+'件':'')+'</div></div>';
          } else if (d.pending > 0) {
            return '<div class="card" style="padding:11px;margin-top:8px;border:1px solid var(--border)"><div style="font-weight:700;font-size:13px">📅 '+label+'の成績</div><div class="muted" style="font-size:12px;margin-top:3px">'+label+'の予想は結果待ち '+d.pending+'件（レース終了後に自動集計）</div></div>';
          }
          return "";
        };
        let h = dayPanel(j._today, "本日");
        if (!(j._today && j._today.races > 0)) h += dayPanel(j._yday, "昨日");
        else if (j._yday && j._yday.races > 0) h += dayPanel(j._yday, "昨日");

        /* ★v269 取得失敗(fetch枠切れ等)は「データなし」と区別して表示する */
        if (j && (j.fetchError || j.error || !Array.isArray(j.accounts))) {
          statBox.innerHTML = h + '<div class="card" style="padding:12px;font-size:12.5px;line-height:1.7;margin-top:8px;border:1px solid #ff8866">⚠ 成績データの取得に失敗した(データが無いわけではない)。<br>'
            + '<span class="muted" style="font-size:11.5px">原因: '+esc(String(j.fetchError||j.error||"応答形式エラー").slice(0,150))+'</span><br><br>'
            + 'GASのfetch枠切れ中はこうなる。時間をおいてもう一度「📊 ロジック的中率を比較する」を押して。</div>';
          return;
        }
        if (!accounts.length) {
          statBox.innerHTML = h + '<div class="card" style="padding:12px;font-size:12.5px;line-height:1.7;margin-top:8px">'+periodLabel+'はまだ確定した予想結果がない。<br>'
            + '🔍 結果確認の最終実行: <b>'+fmt(j.lastCheck)+'</b><br><br>'
            + '予想を投稿してレース結果が出た後、結果確認(Supabase Cronで15分ごと+GASで1日6回)が自動で的中をチェックする。</div>';
          return;
        }

        /* 📊 アカウントごとの成績 */
        h += '<div style="font-weight:800;margin:14px 2px 2px;font-size:13px">📊 '+periodLabel+'のアカウント別 的中成績</div>';
        accounts.forEach(A => {
          h += '<div class="card" style="padding:12px;margin-top:8px"><div style="font-weight:800;color:var(--accent2);font-size:13px">@'+esc(A.screen_name)+'</div>';
          if (!(A.combined && A.combined.races)) {
            h += '<div class="muted" style="font-size:12px;margin-top:4px">'+(A.pending?('結果待ち '+A.pending+'件（レース終了後に自動集計）'):'確定した予想結果なし')+'</div></div>';
            return;
          }
          (A.stats||[]).forEach(s => {
            h += '<div style="border-top:1px solid var(--border);padding:7px 0"><div style="font-weight:700">'+(NAME[s.logic]||s.logic)+'</div>'
              + '<div style="font-size:13px;margin-top:2px">的中率 <b>'+s.hitRate+'%</b>　回収率 <b style="color:'+(s.roi>=100?"#33cc88":"#ff8866")+'">'+s.roi+'%</b>　<span class="muted">('+s.hits+'/'+s.races+'レース)</span></div>'
              + (s.profit != null ? '<div style="font-size:12px;margin-top:2px">収支(100円ずつ) <b style="color:'+(s.profit>=0?"#3DFFA8":"#ff8866")+'">'+(s.profit>=0?"+":"")+'¥'+s.profit.toLocaleString()+'</b></div>' : '')
              + '</div>';
          });
          const cb = A.combined;
          const pc = (cb.profit != null && cb.profit >= 0) ? "#3DFFA8" : "#ff8866";
          h += '<div style="border-top:2px solid var(--accent2);margin-top:2px;padding:8px 0 2px"><div style="font-weight:800;color:var(--ink)">🔀 2ロジック合算</div>'
            + '<div style="font-size:13px;margin-top:2px">的中率 <b>'+cb.hitRate+'%</b>　回収率 <b style="color:'+(cb.roi>=100?"#33cc88":"#ff8866")+'">'+cb.roi+'%</b>　<span class="muted">('+cb.hits+'/'+cb.races+'レース)</span></div>'
            + (cb.profit != null ? '<div style="font-size:12px;margin-top:2px">収支(100円ずつ) <b style="color:'+pc+'">'+(cb.profit>=0?"+":"")+'¥'+cb.profit.toLocaleString()+'</b></div>' : '')
            + (A.pending?'<div class="muted" style="font-size:11.5px;margin-top:4px">結果待ち '+A.pending+'件</div>':'')
            + '</div></div>';
        });

        h += '<div class="card" style="padding:9px 12px;margin-top:8px;font-size:11.5px;line-height:1.7" ><span class="muted">🔍 結果確認の最終実行: <b style="color:var(--ink)">'+fmt(j.lastCheck)+'</b><br>※結果は1日6回(13〜0時)自動で確認・監視。回収率100%超えが勝ち。レース数が増えるほど信頼できる。</span></div>';
        h += '<button id="hitCopyBtn" style="width:100%;margin-top:10px;background:linear-gradient(135deg,#3DFFA8,#00e5ff);color:#001;font-weight:800;border:none;padding:11px;border-radius:9px;font-size:13px">🎯 当たったレースを全部コピー（@'+esc(acc||"")+'）</button>';
        h += '<div id="hitCopyOut"></div>';
        h += '<div id="hitCardSec"></div>'; /* ★v261: 🖼的中カード画像の置き場 */
        statBox.innerHTML = h;
        const hitBtn = document.getElementById("hitCopyBtn");
        if (hitBtn) hitBtn.onclick = async () => {
          hitBtn.disabled = true; const ob = hitBtn.textContent; hitBtn.textContent = "取得中…";
          /* v230: 出力先は毎回取り直す(裏で再描画されても迷子にならない)。押した瞬間に取得中を出して反応を分かりやすく */
          const showOut = (html) => { const el = document.getElementById("hitCopyOut"); if (el) { el.innerHTML = html; el.scrollIntoView({behavior:"smooth", block:"nearest"}); } return el; };
          showOut('<div class="muted" style="font-size:12px;margin-top:6px">取得中…（少しお待ちください）</div>');
          try {
            const hj = await gasFetch_("hitList", { screen_name: acc || undefined, days: 0 });
            const rows = (hj && hj.rows) ? hj.rows : [];
            if (!rows.length) { showOut('<div class="muted" style="font-size:12px;margin-top:6px">まだ的中レースがありません。</div>'); hitBtn.disabled=false; hitBtn.textContent=ob; return; }
            const lines = rows.map(r => {
              const d = String(r.race_date||""); const md = d.length===8 ? (parseInt(d.slice(4,6),10)+"/"+parseInt(d.slice(6,8),10)) : d;
              const yen = r.payout ? Number(r.payout) : 0;
              const pay = yen ? " ¥"+yen.toLocaleString() : "";
              const odds = yen ? "（"+(yen/100).toFixed(1)+"倍）" : "";
              return md+" "+(r.venue||"")+r.rno+"R "+(r.result_combo||"")+pay+odds;
            });
            const totalPay = Number(hj.totalPayout) || 0; /* 100円賭けの合計 */
            const text = "【無料予想の的中実績】\n" + lines.join("\n")
              + "\n\n的中" + hj.count + "レース"
              + "\n━━━━━━━━━\n回収金合計\n"
              + "・100円ずつ買った場合: ¥" + totalPay.toLocaleString() + "\n"
              + "・1,000円ずつ買った場合: ¥" + (totalPay * 10).toLocaleString() + "\n"
              + "・10,000円ずつ買った場合: ¥" + (totalPay * 100).toLocaleString();
            let copied = false;
            try { await navigator.clipboard.writeText(text); copied = true; } catch(err) {}
            hitBtn.textContent = copied ? "✓ コピーした！" : ob;
            showOut('<textarea readonly style="width:100%;height:170px;background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--ink);font-size:12px;padding:8px;margin-top:8px;-webkit-user-select:all">'+esc(text)+'</textarea>'
              + '<div class="muted" style="font-size:11px;margin-top:4px">回収金合計 <b style="color:#3DFFA8">¥'+Number(hj.totalPayout).toLocaleString()+'</b> / 的中'+hj.count+'レース'+(copied?'（コピー済み）':'（上を長押しでコピー）')+'</div>');
            setTimeout(()=>{ hitBtn.disabled=false; hitBtn.textContent=ob; }, 2500);
          } catch(e) { showOut('<div class="err" style="margin-top:6px">'+esc(e.message)+'</div>'); hitBtn.disabled=false; hitBtn.textContent=ob; }
        };
        buildHitCardSec_(acc); /* ★v261: 🖼的中カード画像コーナー */
      } catch(e){ statBox.innerHTML = '<div class="err">'+esc(e.message)+'</div>'; }
    }

    /* ★v261: 🖼 的中カード画像(実績の見える化)。当たった瞬間の自動報告に画像を付けるON/OFFと、
       手動でカードを生成→編集→画像付き即投稿。GAS v50の hitCardMake/hitCardRecent を使用 */
    function buildHitCardSec_(acc) {
      const sec = document.getElementById("hitCardSec"); if (!sec) return;
      const tgl = (on) => "min-width:64px;padding:8px 14px;border-radius:20px;border:none;font-weight:800;font-size:13px;cursor:pointer;" + (on ? "background:linear-gradient(135deg,#38d4f0,#3DFFA8);color:#002" : "background:rgba(255,255,255,.1);color:#94a3b8");
      const card = document.createElement("div");
      card.className = "card"; card.style.cssText = "padding:12px;margin-top:10px;border:1px solid var(--border)";
      const head = document.createElement("div"); head.style.cssText = "font-weight:800;font-size:13px";
      head.innerHTML = '🖼 的中カード画像 <span class="muted" style="font-size:11px;font-weight:400">実績を画像で見せてインプレ＆フォロー獲得</span>';
      card.appendChild(head);
      if (!acc) {
        const m = document.createElement("div"); m.className = "muted"; m.style.cssText = "font-size:12px;margin-top:6px";
        m.textContent = "上でアカウントを選択すると使えます。";
        card.appendChild(m); sec.innerHTML = ""; sec.appendChild(card); return;
      }
      /* 自動添付トグル(gen_config.hitCard・既定ON) */
      const tr = document.createElement("div"); tr.style.cssText = "display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px";
      const tlbl = document.createElement("div"); tlbl.style.cssText = "font-size:12.5px;line-height:1.4";
      tlbl.innerHTML = '的中報告に画像カードを自動添付<br><span class="muted" style="font-size:11px">当たった瞬間の自動報告に「🎯的中！」のカード画像が付きます</span>';
      const sw = document.createElement("button"); let swOn = true;
      const pSw = () => { sw.textContent = swOn ? "ON" : "OFF"; sw.style.cssText = tgl(swOn); };
      pSw();

  function hpAgeMin(it) {
    const base = it.posted_at || it.created_at;
    if (!base) return 99999;
    return Math.max(0, Math.round((Date.now() - new Date(base).getTime()) / 60000));
  }
  function hpClassify(it) {
    const st = it.status || "new";
    if (st === "replied" || st === "skip") return "done";
    const m = hpAgeMin(it);
    if (m <= 60) return "now";
    if (m <= 1440) return "later";
    return "expired";
  }

      sw.textContent = "🃏 スワイプで一気に捌く (" + swipeable.length + "件)";
      sw.onclick = () => openSwipeMode(swipeable);
      trOut.appendChild(sw);
    }
    list.forEach(it => trOut.appendChild(hpCard(it)));
  }

  function hpCard(it) {
    const mode = _hp.mode;
    const m = hpAgeMin(it);
    const card = document.createElement("div");
    card.style.cssText = "background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:13px;margin-top:10px";
    const score = it.chance_score || 0;
    const scoreColor = score >= 70 ? "#3DFFA8" : (score >= 50 ? "#eab308" : "#7E8BA8");
    const scoreLabel = mode === "proactive" ? "先回りチャンス" : "伸び";
    let head = '<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap">';
    head += '<span style="font-weight:800;font-size:15px;color:' + scoreColor + '">' + scoreLabel + ' ' + score + '%</span>';
    if (it.category) head += '<span style="font-size:11px;background:rgba(0,229,255,.12);color:var(--accent2);padding:2px 8px;border-radius:10px">' + esc(it.category) + '</span>';
    head += '<span style="font-size:11px;color:var(--muted);margin-left:auto">投稿後' + (m < 99999 ? m + "分" : "—") + '</span></div>';
    let stat = '<div style="font-size:11.5px;color:var(--accent2);margin-bottom:6px">@' + esc(it.competitor || "") + ' · ❤' + (it.likes || 0) + ' · 💬' + (it.replies || 0);
    if (mode === "competitor" && it.velocity) stat += ' · 🔥' + it.velocity + '/h';
    stat += '</div>';
    const body = '<div style="font-size:13px;line-height:1.55;margin-bottom:6px;white-space:pre-wrap">' + esc((it.tweet_text || "").length > 200 ? (it.tweet_text.slice(0, 200) + "…") : (it.tweet_text || "")) + '</div>';
    const reason = it.reason ? '<div style="font-size:11.5px;color:var(--muted);background:var(--bg);border-radius:8px;padding:6px 8px;margin-bottom:8px">💡 ' + esc(it.reason) + '</div>' : '';
    card.innerHTML = head + stat + body + reason;

    let ideas = it.reply_ideas;
    if (typeof ideas === "string") { try { ideas = JSON.parse(ideas); } catch (e) { ideas = []; } }
    if (!Array.isArray(ideas)) ideas = [];
    const labels = ["いちばん自然", "少し踏み込む", "会話続く"];
    if (ideas.length) {
      ideas.slice(0, 3).forEach((rep, i) => {
        const w = document.createElement("div"); w.style.cssText = "background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px;margin-top:6px";
        w.innerHTML = '<div style="font-size:10.5px;color:var(--accent2);margin-bottom:3px">' + (labels[i] || ("案" + (i + 1))) + '</div><div style="font-size:13px;line-height:1.5;white-space:pre-wrap">' + esc(rep) + '</div>';
        const cp = document.createElement("button"); cp.className = "mini"; cp.textContent = "📋 コピー"; cp.style.marginTop = "6px";
        cp.onclick = () => { navigator.clipboard.writeText(rep); cp.textContent = "✓ コピーした"; setTimeout(() => cp.textContent = "📋 コピー", 1200); };
        const go1 = document.createElement("button"); go1.className = "mini cyan"; go1.textContent = "↗ この案でXリプ"; go1.style.cssText = "margin-top:6px;margin-left:6px;font-weight:700";
        go1.onclick = async () => { xReplyIntent(it, rep, labels[i]); await hpMark(it, "replied"); setTimeout(() => renderHunterPro(), 900); };
        w.appendChild(cp); w.appendChild(go1); card.appendChild(w);
      });
    } else {
      const repBox = document.createElement("div"); card.appendChild(repBox);
      makeHunterReplies(repBox, { text: it.tweet_text || "", url: it.tweet_url || "", _author: it.competitor || "", _qid: it.id });
    }

    const st = it.status || "new";
    if (st !== "replied" && st !== "skip") {
      const acts = document.createElement("div"); acts.style.cssText = "display:flex;gap:8px;margin-top:10px";
      const go = document.createElement("a"); go.className = "mini cyan"; go.textContent = "↗ Xで返信"; go.href = it.tweet_url || ("https://x.com/" + (it.competitor || "")); go.target = "_blank";
      go.style.cssText = "flex:1;text-align:center;text-decoration:none;padding:9px;border-radius:9px;font-weight:700";
      go.onclick = async () => { await hpMark(it, "replied"); setTimeout(() => renderHunterPro(), 500); };
      const skip = document.createElement("button"); skip.className = "mini"; skip.textContent = "見送り"; skip.style.cssText = "padding:9px 14px;border-radius:9px";
      skip.onclick = async () => { await hpMark(it, "skip"); renderHunterPro(); };
      acts.appendChild(go); acts.appendChild(skip); card.appendChild(acts);
    } else {
      const done = document.createElement("div"); done.style.cssText = "font-size:11px;color:var(--muted);margin-top:8px";
      done.textContent = st === "replied" ? "✅ Xで返信済み" : "➖ 見送り済み";
      card.appendChild(done);
    }
    return card;
  }

  /* === スワイプモード: 右=リプ(薄ピンク) / 左=スルー(水色)、戻る付き === */
  function openSwipeMode(items) {
    if (!items || !items.length) return;
    let idx = 0, busy = false;   /* busy: flyアニメ中の多重スワイプを防ぐ */
    const overlay = document.createElement("div");
    overlay.style.cssText = "position:fixed;inset:0;background:rgba(5,8,18,.97);z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px";
    const closeBtn = document.createElement("button"); closeBtn.className = "mini"; closeBtn.textContent = "✕ 閉じる";
    closeBtn.style.cssText = "position:fixed;top:16px;right:16px;z-index:100000";
    closeBtn.onclick = () => { overlay.remove(); renderHunterPro(); };
    const backBtn = document.createElement("button"); backBtn.className = "mini"; backBtn.textContent = "↩ 戻る";
    backBtn.style.cssText = "position:fixed;top:16px;left:16px;z-index:100000;display:none";
    backBtn.onclick = () => { if (idx <= 0) return; idx--; hpMark(items[idx], "new"); renderCard(); };
    const counter = document.createElement("div"); counter.style.cssText = "color:var(--muted);font-size:13px;margin-bottom:12px";
    const stack = document.createElement("div"); stack.style.cssText = "position:relative;width:100%;max-width:440px;height:62vh";
    const hint = document.createElement("div"); hint.style.cssText = "color:var(--muted);font-size:12px;margin-top:16px;text-align:center;line-height:1.7";
    hint.innerHTML = "← 左スワイプで<b style='color:#7fd4ff'>スルー</b> ／ 右スワイプで<b style='color:#ff9ec4'>リプ</b> →<br>または下のリプ案を直接タップ";
    overlay.appendChild(closeBtn); overlay.appendChild(backBtn); overlay.appendChild(counter); overlay.appendChild(stack); overlay.appendChild(hint);
    document.body.appendChild(overlay);

    function parseIdeas(it) { let v = it.reply_ideas; if (typeof v === "string") { try { v = JSON.parse(v); } catch (e) { v = []; } } return Array.isArray(v) ? v : []; }

    function fly(card, dir) {
      busy = true;
      card.style.transition = "transform .3s, opacity .3s";
      card.style.transform = "translateX(" + (dir > 0 ? "120%" : "-120%") + ") rotate(" + (dir * 8) + "deg)";
      card.style.opacity = "0";
      setTimeout(function () { idx++; renderCard(); }, 280);
    }

    function attachSwipe(card, it, ideas, tint, label) {
      let startX = 0, curX = 0, dragging = false;
      const start = function (x) { if (busy) return; startX = x; dragging = true; card.style.transition = "none"; };
      const move = function (x) {
        if (!dragging) return;
        curX = x - startX;
        card.style.transform = "translateX(" + curX + "px) rotate(" + (curX * 0.04) + "deg)";
        const t = Math.min(Math.abs(curX) / 150, 0.85);
        if (curX > 8) { tint.style.background = "rgba(255,158,196,.45)"; tint.style.opacity = String(t * 0.6); label.textContent = "リプ ↗"; label.style.color = "#ff9ec4"; label.style.opacity = String(t); }
        else if (curX < -8) { tint.style.background = "rgba(127,212,255,.45)"; tint.style.opacity = String(t * 0.6); label.textContent = "スルー"; label.style.color = "#7fd4ff"; label.style.opacity = String(t); }
        else { tint.style.opacity = "0"; label.style.opacity = "0"; }
      };
      const end = function () {
        if (!dragging) return; dragging = false;
        if (busy) { card.style.transition = "transform .2s"; card.style.transform = ""; curX = 0; return; }
        tint.style.opacity = "0"; label.style.opacity = "0";
        if (curX > 110) { xReplyIntent(it, ideas[0] || "", "いちばん自然"); hpMark(it, "replied"); fly(card, 1); }
        else if (curX < -110) { hpMark(it, "skip"); fly(card, -1); }
        else { card.style.transition = "transform .2s, opacity .2s"; card.style.transform = ""; card.style.opacity = "1"; }
        curX = 0;
      };
      card.addEventListener("touchstart", function (e) { start(e.touches[0].clientX); }, { passive: true });
      card.addEventListener("touchmove", function (e) { move(e.touches[0].clientX); }, { passive: true });
      card.addEventListener("touchend", end);
      card.addEventListener("mousedown", function (e) { start(e.clientX); });
      card.addEventListener("mousemove", function (e) { move(e.clientX); });
      card.addEventListener("mouseup", end);
    }

    function renderCard() {
      busy = false;
      stack.innerHTML = "";
      backBtn.style.display = idx > 0 ? "block" : "none";
      if (idx >= items.length) {
        counter.textContent = ""; hint.style.display = "none";
        stack.innerHTML = '<div style="text-align:center;color:var(--muted);padding-top:60px;font-size:16px;line-height:1.9">🎉 全部捌きました！<br>お疲れさまでした。</div>';
        return;
      }
      counter.textContent = (idx + 1) + " / " + items.length;
      const it = items[idx];
      const ideas = parseIdeas(it);
      const card = document.createElement("div");
      card.style.cssText = "position:absolute;inset:0;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:18px;overflow-y:auto;touch-action:pan-y;box-shadow:0 12px 36px rgba(0,0,0,.55)";
      let html = '<div style="font-weight:800;font-size:17px;color:#3DFFA8;margin-bottom:5px">チャンス ' + (it.chance_score || 0) + '%</div>';
      html += '<div style="font-size:12px;color:var(--accent2);margin-bottom:10px">@' + esc(it.competitor || "") + ' · ❤' + (it.likes || 0) + ' · 💬' + (it.replies || 0) + '</div>';
      html += '<div style="font-size:14px;line-height:1.6;white-space:pre-wrap;margin-bottom:12px">' + esc((it.tweet_text || "").slice(0, 260)) + '</div>';
      if (it.reason) html += '<div style="font-size:11.5px;color:var(--muted);background:var(--bg);border-radius:8px;padding:6px 8px;margin-bottom:10px">💡 ' + esc(it.reason) + '</div>';
      card.innerHTML = html;
      const labels = ["いちばん自然", "少し踏み込む", "会話続く"];
      ideas.slice(0, 3).forEach(function (rep, i) {
        const b = document.createElement("button"); b.className = "mini cyan";
        b.style.cssText = "display:block;width:100%;text-align:left;white-space:normal;line-height:1.5;margin-top:8px;padding:11px;font-size:13px;position:relative;z-index:2";
        b.innerHTML = '<span style="opacity:.6;font-size:10px">' + (labels[i] || "案") + '</span><br>↗ ' + esc(rep);
        b.onclick = function () { xReplyIntent(it, rep, labels[i]); hpMark(it, "replied"); fly(card, 1); };
        card.appendChild(b);
      });
      if (!ideas.length) {
        const note = document.createElement("div");
        note.style.cssText = "margin-top:10px;font-size:12px;color:var(--muted);line-height:1.6";
        note.textContent = "💡 AIは「自然なリプが作りにくい」と判断(見送り推奨)。それでも絡むなら自分で書いてリプ。";
        card.appendChild(note);
        const mb = document.createElement("button"); mb.className = "mini";
        mb.style.cssText = "display:block;width:100%;margin-top:8px;padding:11px;font-size:13px;position:relative;z-index:2";
        mb.textContent = "✍ 自分で書いてXでリプ";
        mb.onclick = function () { xReplyIntent(it, "", "手動"); hpMark(it, "replied"); fly(card, 1); };
        card.appendChild(mb);
      }
      /* スワイプ方向の色フィードバック */
      const tint = document.createElement("div");
      tint.style.cssText = "position:absolute;inset:0;border-radius:18px;pointer-events:none;opacity:0;transition:opacity .12s;z-index:3";
      const label = document.createElement("div");
      label.style.cssText = "position:absolute;top:18px;left:50%;transform:translateX(-50%);font-size:28px;font-weight:900;opacity:0;pointer-events:none;text-shadow:0 2px 10px rgba(0,0,0,.6);z-index:4";
      card.appendChild(tint); card.appendChild(label);
      stack.appendChild(card);
      attachSwipe(card, it, ideas, tint, label);
    }

    renderCard();
  }

  async function openFollowStats() {
    const overlay = document.createElement("div");
    overlay.style.cssText = "position:fixed;inset:0;background:rgba(5,8,18,.98);z-index:99999;overflow-y:auto;padding:54px 16px 40px";
    const close = document.createElement("button"); close.className = "mini"; close.textContent = "✕ 閉じる";
    close.style.cssText = "position:fixed;top:16px;right:16px;z-index:100000";
    close.onclick = () => overlay.remove();
    overlay.appendChild(close);
    const box = document.createElement("div"); box.style.cssText = "max-width:560px;margin:0 auto";
    box.innerHTML = '<div class="muted" style="text-align:center;padding:40px">集計中…</div>';
    overlay.appendChild(box); document.body.appendChild(overlay);

    function statCard(label, val, color) {
      return '<div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px">' +
        '<div class="muted" style="font-size:11px">' + label + '</div>' +
        '<div style="font-size:21px;font-weight:800;color:' + (color || "var(--fg)") + ';margin-top:2px">' + val + '</div></div>';
    }
    function barSection(title, arr, hint) {
      if (!arr || !arr.length) return "";
      let html = '<h3 style="font-size:14px;margin:18px 0 4px">' + title + '</h3>';
      if (hint) html += '<p class="muted" style="font-size:11px;margin:0 0 8px">' + hint + '</p>';
      arr.forEach(function (o) {
        const w = Math.max(2, o.rate);
        html += '<div style="margin-bottom:11px">' +
          '<div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:3px">' +
          '<span>' + esc(o.key) + '</span>' +
          '<span style="font-weight:700">' + o.rate + '% <span class="muted" style="font-weight:400">(' + o.f + '/' + o.n + ')</span></span></div>' +
          '<div style="height:9px;background:var(--bg);border-radius:6px;overflow:hidden">' +
          '<div style="height:100%;width:' + w + '%;background:linear-gradient(90deg,#00e5ff,#3DFFA8);border-radius:6px"></div></div>' +
          (o.avgHrs != null ? '<div class="muted" style="font-size:10.5px;margin-top:2px">平均 ' + o.avgHrs + '時間でフォロー</div>' : '') +
          '</div>';
      });
      return html;
    }
    function followerChart(arr) {
      const pts = (arr || []).filter(function (x) { return x && /フォロワー/.test(x.platform || ""); })
        .sort(function (a, b) { return String(a.date).localeCompare(String(b.date)); }).slice(-14);
      if (pts.length < 2) return '<p class="muted" style="font-size:12px;padding:8px 0 14px">推移はまだデータ待ち(毎朝5時に記録。2日分から表示)。</p>';
      const counts = pts.map(function (p) { return Number(p.count) || 0; });
      const min = Math.min.apply(null, counts), max = Math.max.apply(null, counts), range = (max - min) || 1;
      const W = 520, H = 120, pad = 10, n = pts.length;
      const co = pts.map(function (p, i) {
        return [pad + i * (W - pad * 2) / (n - 1), pad + (1 - ((Number(p.count) || 0) - min) / range) * (H - pad * 2)];
      });
      const line = co.map(function (c, i) { return (i ? "L" : "M") + c[0].toFixed(1) + " " + c[1].toFixed(1); }).join(" ");
      const area = "M" + co[0][0].toFixed(1) + " " + (H - pad) + " " + line.replace(/^M/, "L") + " L" + co[n - 1][0].toFixed(1) + " " + (H - pad) + " Z";
      const dots = co.map(function (c) { return '<circle cx="' + c[0].toFixed(1) + '" cy="' + c[1].toFixed(1) + '" r="2.5" fill="#3DFFA8"/>'; }).join("");
      const first = counts[0], last = counts[n - 1], diff = last - first;
      const head = '<div style="display:flex;align-items:baseline;gap:10px;margin-bottom:6px">' +
        '<span style="font-size:26px;font-weight:800">' + last + '</span><span class="muted" style="font-size:12px">フォロワー</span>' +
        '<span style="font-size:13px;font-weight:700;color:' + (diff >= 0 ? "#3DFFA8" : "#ff6b6b") + '">' + (diff >= 0 ? "+" : "") + diff + ' (' + n + '日間)</span></div>';
      const svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto;display:block">' +
        '<defs><linearGradient id="fgrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3DFFA8" stop-opacity="0.35"/><stop offset="1" stop-color="#3DFFA8" stop-opacity="0"/></linearGradient></defs>' +
        '<path d="' + area + '" fill="url(#fgrad)"/><path d="' + line + '" fill="none" stroke="#3DFFA8" stroke-width="2"/>' + dots + '</svg>';
      const lbl = '<div style="display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);margin-top:2px"><span>' + pts[0].date.slice(5) + '</span><span>' + pts[n - 1].date.slice(5) + '</span></div>';
      return head + svg + lbl;
    }

    const screen = (acct.value || "").replace(/^@/, "");
    let s, fhist = [];
    try { s = await gasFetch_("contactStats", acct.value ? { screenName: acct.value } : {}); }
    catch (e) { box.innerHTML = '<div class="err">' + e.message + '</div>'; return; }
    try { fhist = await kvGet("followers:" + screen, []); } catch (e) { fhist = []; }
    if (s && s.error) { box.innerHTML = '<div class="err">' + esc(s.error) + '</div>'; return; }

    let h = '<h2 style="font-size:19px;margin:0 0 12px">🚀 フォロー獲得の成果</h2>';
    if (screen) { h += '<h3 style="font-size:14px;margin:0 0 6px">📈 フォロワー推移</h3>' + followerChart(fhist); }
    h += '<p class="muted" style="font-size:12px;margin:16px 0 14px">リプした相手が実際にフォローしてくださった率です。毎朝6時に自動で照合しています。</p>';
    if (!s || !s.total) {
      h += '<div class="muted" style="padding:14px 0;line-height:1.9;font-size:13px">リプのフォロー率はまだデータ待ち。<br>リプ案を「↗Xリプ」やスワイプで送ると記録され、翌朝の照合で「リプ種別別フォロー率」「競合別フォロー率」が表示されます。</div>';
      box.innerHTML = h; return;
    }
    h += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px">';
    h += statCard("接触した人", s.total + "人");
    h += statCard("フォローされた", s.followed + "人", "#3DFFA8");
    h += statCard("フォロー率", s.followRate + "%", "#00e5ff");
    h += statCard("平均フォローまで", s.avgHours != null ? s.avgHours + "h" : "—");
    h += '</div>';
    h += '<div class="muted" style="font-size:11.5px;margin:0 0 6px">追跡中(まだ判定前): ' + s.pending + '人</div>';

    /* 経路別サマリ(リプハンター=競合のファン / 先回りリプ=バズ投稿乗っかり) */
    const hunter = s.hunter || { total: 0, followed: 0, rate: 0 };
    const proa = s.proactive || { total: 0, followed: 0, rate: 0 };
    h += '<h3 style="font-size:14px;margin:18px 0 6px">📍 経路ごとの成績</h3>';
    h += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px">';
    h += '<div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px"><div style="font-size:12px;font-weight:700;margin-bottom:3px">🎯 リプハンター<br><span style="font-size:10px;color:var(--muted);font-weight:400">競合のファンに絡む</span></div><div style="font-size:13px;margin-top:5px">' + hunter.followed + '/' + hunter.total + '人 <b style="color:#3DFFA8">' + hunter.rate + '%</b></div></div>';
    h += '<div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px"><div style="font-size:12px;font-weight:700;margin-bottom:3px">⚡ 先回りリプ<br><span style="font-size:10px;color:var(--muted);font-weight:400">バズ投稿に乗っかる</span></div><div style="font-size:13px;margin-top:5px">' + proa.followed + '/' + proa.total + '人 <b style="color:#00e5ff">' + proa.rate + '%</b></div></div>';
    h += '</div>';
    h += '<p class="muted" style="font-size:10.5px;margin:0 0 4px">どっちの絡み方がフォローに繋がりやすいかの比較。数が増えるほど信頼できる。</p>';

    h += barSection("リプの種類ごとのフォロー率", s.byType, "どの言い方が一番フォローに繋がるか");
    h += barSection("競合ごとのフォロー率（リプハンター経由のみ）", s.byComp, "どの競合のファンが付きやすいか。先回りリプの相手は含めない");
    box.innerHTML = h;
  }

  function fgOverlay_() {
    const overlay = document.createElement("div");
    overlay.style.cssText = "position:fixed;inset:0;background:rgba(5,8,18,.98);z-index:99999;overflow-y:auto;padding:54px 16px 40px";
    const close = document.createElement("button"); close.className = "mini"; close.textContent = "✕ 閉じる";
    close.style.cssText = "position:fixed;top:16px;right:16px;z-index:100000";

      + `↑固有の点(三ヶ根山/慰霊碑に参拝)を具体的に拾い、対等な共感で、テンプレ褒めでなく相手の行動に触れてる。この具体性と温度を真似る。\n`
      + (shuffle ? `- 前回と違う角度で\n` : "")

  /* 炎上コメントボタン: 記事本文を取得 → その内容を踏まえてコメント3案 */
  function makeEnjouBtn(card, title, url) {
    const btn = document.createElement("button"); btn.className = "mini cyan"; btn.textContent = "この炎上にコメント(3案)";
    const out = document.createElement("div");
    const run = async (shuffle) => {
      btn.disabled = true; btn.textContent = shuffle ? "作り直し中…" : "記事を読んで生成中…"; out.innerHTML = "";
      try {
        /* まず記事本文を取得(中身を読んでから書く=事実誤認を防ぐ) */
        let bodyText = "";
        try { const br = await fetchYahooArg("articleBody", { url }); bodyText = (br && br.body) ? br.body : ""; } catch(e) {}
        const prompt = buzzPromptForEnjou(title, url, bodyText, shuffle);
        const r = await callAI(prompt, false, "sonnet", false);
        const text = (typeof r === "string") ? r : r.text;
        let cands = text.split(/\n?===+\n?/).map(s=>s.trim())
          .map(s=> s.replace(/^(以下|こちら|では|それでは).*?[:：]\s*/,"").trim())
          .filter(s=>s.length>5 && !/^(承知|了解|分かりました)/i.test(s));
        if (!cands.length) { out.innerHTML = '<div class="muted" style="padding:6px">うまく作成できませんでした。もう一度お試しください。</div>'; }
        else {
          out.innerHTML = "";
          const shufRow = document.createElement("div"); shufRow.style.cssText="margin:6px 0";
          const shuf = document.createElement("button"); shuf.className="mini"; shuf.textContent="🔀 3案ぜんぶ作り直す";
          shuf.onclick = () => run(true); shufRow.appendChild(shuf); out.appendChild(shufRow);
          cands.slice(0,3).forEach((c,i)=> renderTrendCard(out, c, "案"+(i+1)));
        }
      } catch(e) { out.innerHTML = '<div class="err">'+e.message+'</div>'; }
      btn.disabled = false; btn.textContent = "この炎上にコメント(3案)";
    };
    btn.onclick = () => run(false);
    card.appendChild(btn); card.appendChild(out);
  }

  /* GAS呼び出し(引数付き) */
  async function fetchYahooArg(action, extra) {
    const { data: sess } = await sb.auth.getSession();
    if (!sess.session) throw new Error("ログインが切れた。リロードして。");
    const res = await fetch(GAS_URL, {
      method: "POST", headers: { "Content-Type": "text/plain" },
      body: JSON.stringify(Object.assign({ auth: sess.session.access_token, action }, extra || {})),
    });
    return await res.json();
  }

  /* 炎上ニュース個別 → コメント投稿3案プロンプト(記事本文を踏まえる) */
  function buzzPromptForEnjou(title, url, bodyText, shuffle) {
    return `次の炎上系ニュースについて、X投稿を3案作る。\n`

      + `- あらすじ・概要の説明から入らない。説明口調・要約は禁止\n`

  /* 設定済みの文体・性格を文章化(プロンプトに差し込む) */

    return "\n口調: " + (toneMap[CFG.tone] || "自然体な") + "感じ。絵文字は" + (CFG.emoji||"少なめ") + "。\n";
  }

  /* トレンドワード → まず検索で内容を確認し、その話題に対する"自分の感想・意見"を投稿3案。
     ニュース説明・読み上げは禁止。前置きも書かせない。 */
  function buzzPromptForTrend(tw, shuffle) {
    return `「${tw}」は今まさにXでトレンドになっているワード。\n`
      + `【最初に必ずやること】Web検索して、「${tw}」が"今日・直近"何の話題でトレンドになっているのか、正確な事実を確認する。複数の検索結果で内容を裏取りする。\n`
      + `古い情報や別の同名トピックと混同しないこと。あくまで"今トレンドになっている理由"を掴む。\n`
      + `そのうえで、その話題に【自分の感想・意見・気持ち】を乗せたX投稿を3案作る。\n`
      + personaClause()
      + `\n【本文に必ず入れる3要素】\n`
      + `1. トレンドワード「${tw}」(固有名詞そのもの)\n`
      + `2. 今回実際に起きたこと(検索で確認した"直近の事実"だけ。推測・想像・古い話は禁止)\n`
      + `3. 自分の感想・本音・ツッコミ(メイン)\n`
      + `この3つを説明口調にならないよう1つの自然なつぶやきに溶け込ませる。\n`
      + `\n【お手本の形】「○○(固有名詞)が△△(出来事)って時点でめっちゃ熱い🔥 □□(感想)」\n`
      + `\n【絶対NG】\n`
      + `- 検索で確認できていない内容を書く(例: 番組名・金額・人物などを推測で書く)。確信が持てない事実は書かない\n`
      + `- 事実報告だけで感想が無い / 「正直この人見てると〜」のように何の話か分からない\n`
      + `- 「9割の人が〜」「実は〜なの」みたいな空っぽの煽り / 知ったかぶり / 誹謗中傷・決めつけ\n`
      + `\n【話題に応じたトーン】\n`
      + `・事件/事故/訃報/社会問題 → 茶化し・煽りNG。誠実で人に「たしかに」と思わせる本音や視点\n`
      + `・芸能/スポーツ/エンタメ → 共感・ツッコミ・素直な気持ちでOK\n`

      + `【絵文字・誤字】話題に合う絵文字だけ使う。話題と無関係な事業固有の絵文字(競艇の🚤など)を付けない。意味不明な文字・誤字(例「やっぽ」)を混ぜない。日本語として自然な文だけ出力。\n`
      + `【字数】各案140字以内。\n`
      + `【URL】本文にURLは書かない(URLはシステムが検索結果から自動で付ける)。本文は感想だけにする。\n`
      + (shuffle ? `前回とは全く違う角度・感情で新鮮な3案にする。\n` : "")
      + `\n出力形式(厳守): 前置き・説明は一切なし。3案を「===」だけの行で区切って本文のみ出力。`;

  /* 人気ポスト → その型を真似た文体そのままのバズ投稿3案プロンプト */

      + `- 「ここ大事」「ブックマークしとくといいよ」「テストに出る」「実は〇〇が大事」「9割の人が」「要注目」のような空っぽの煽り・もったいぶり・薄い誘導は禁止\n`
      + `- 中身のない締めの一文(「詳しくは〜」「チェックしてね」だけ)で字数を埋めない。本文そのものに中身を持たせる\n`

  /* バズ投稿3案を出すボタン(シャッフル付き)。promptFn(shuffle)がプロンプトを返す。
     useSearch=true でWeb検索して内容確認(トレンド用)。 */
  function buzzTransformBtn(card, label, promptFn, useSearch, trendWord, initialHistory) {
    const btn = document.createElement("button"); btn.className = "mini cyan"; btn.textContent = label;
    const out = document.createElement("div");
    let history = (initialHistory && initialHistory.length) ? initialHistory.slice(-60) : [];
    const run = async (shuffle) => {
      btn.disabled = true; btn.textContent = shuffle ? "作り直し中…" : (useSearch ? "ニュースと照合中…" : "生成中…"); out.innerHTML = "";
      try {
        if (!(useSearch && trendWord)) {
          /* トレンド以外(型まね等)は従来通り。過去候補を渡して被らせない */
          const r0 = await callAI(promptFn(shuffle, history), false, "luna", false); /* ★v228: haiku→luna */
          const text0 = (typeof r0 === "string") ? r0 : r0.text;
          let cands0 = text0.split(/\n?===+\n?/).map(s=>s.trim())
            .map(s=> s.replace(/^(以下|こちら|では|それでは).*?[:：]\s*/,"").trim())
            .filter(s=>s.length>5 && !/^(承知|了解|分かりました)/i.test(s));
          history = history.concat(cands0).slice(-12); /* 直近12件を記憶 */
          renderCands(cands0, true);
          btn.disabled=false; btn.textContent=label; return;
        }
        /* トレンド: Yahoo!ニュースを取得して関連ニュースを探す */
        let newsList = [];
        try { const nr = await fetchYahoo("news"); newsList = (nr && nr.news) ? nr.news : []; } catch(e) {}
        if (!newsList.length) {
          out.innerHTML = '<div class="muted" style="padding:8px;font-size:12.5px">⚠️ 現在ニュースを取得できませんでした。少し待ってもう一度お試しください。</div>';
          btn.disabled=false; btn.textContent=label; return;
        }
        /* ワードに関連するニュースを絞る */
        const wordKey = trendWord.replace(/\s+/g,"");
        let related = newsList.filter(n => n.title.replace(/\s+/g,"").includes(wordKey));
        if (!related.length && trendWord.length >= 2) {
          related = newsList.filter(n => [...trendWord].filter(ch => /[一-龠ァ-ヶ]/.test(ch) && n.title.includes(ch)).length >= Math.min(2, trendWord.length));
        }
        /* 関連ニュースが無ければ、想像で書かず正直に「該当なし」を出す */
        if (!related.length) {
          out.innerHTML = '<div class="muted" style="padding:8px;font-size:12.5px">⚠️「'+esc(trendWord)+'」に関するニュースが現在のYahoo!ニュースに見つかりませんでした。<br>世間でニュースになっていない話題かもしれません。別のワード(ニュース性のあるもの)でお試しいただくのがおすすめです。</div>';
          btn.disabled=false; btn.textContent=label; return;
        }
        const useList = related.slice(0, 12);
        const newsText = useList.map((n,i)=>`${i+1}. ${n.title}\n   ${n.url}`).join("\n");
        const r = await callAI(buzzPromptForTrendWithNews(trendWord, newsText, shuffle), false, "sonnet", false);
        const text = (typeof r === "string") ? r : r.text;
        /* AIが「該当なし」と判断したら正直に伝える */
        if (/^\s*該当なし/.test(text.trim())) {
          out.innerHTML = '<div class="muted" style="padding:8px;font-size:12.5px">⚠️「'+esc(trendWord)+'」に合うニュースが無かった。世間で話題になってない可能性が高い。別のワードで試して。</div>';
          btn.disabled=false; btn.textContent=label; return;
        }
        let body = text.replace(/^.*?(します|作ります|を作成|3案[:：]|案です)[。:：]?\s*\n/m, "");
        let cands = body.split(/\n?===+\n?/).map(s=>s.trim())
          .map(s=> s.replace(/^(以下|こちら|では|それでは).*?[:：]\s*/,"").trim())
          .filter(s=>s.length>5 && !/^(承知|了解|分かりました|該当)/i.test(s));
        renderCands(cands);
      } catch(e) { out.innerHTML = '<div class="err">'+e.message+'</div>'; }
      btn.disabled = false; btn.textContent = label;
    };
    /* 候補を描画する共通処理 */
    function renderCands(cands, stripUrls) {
      if (!cands || !cands.length) { out.innerHTML = '<div class="muted" style="padding:6px">うまく作成できませんでした。もう一度お試しください。</div>'; return; }
      /* 本文先頭の「【案N】」見出し除去。stripUrls=true(バズミラー等)ならURL/リンク誘導文も除去 */
      cands = cands.map(c => {
        let t = c.replace(/^【?案\s*\d+】?[:：]?\s*\n?/,"").trim();
        if (stripUrls) {
          /* URLは残す。「情報ソース貼っときました」等の薄い誘導文だけ消す */
          t = t.split("\n").filter(line => {
            const l = line.trim();
            if (/情報ソース.*(貼|はり)/.test(l)) return false;
            if (/^[👇👉⬇️🔗]*\s*詳しくは(こちら|リンク|下)[👇👉⬇️🔗\s]*$/.test(l)) return false;
            if (/^[👇👉⬇️🔗]*\s*詳細は(リンク|こちら).*(チェック|みて|見て)[👇👉⬇️🔗\s]*$/.test(l)) return false;
            if (/^(ソース|出典)は?(こちら|下|リンク)[👇👉⬇️🔗\s]*$/.test(l)) return false;
            return true;
          }).join("\n").replace(/\n{3,}/g,"\n\n").trim();
        }
        return t;
      }).filter(Boolean);
      out.innerHTML = "";
      const shufRow = document.createElement("div"); shufRow.style.cssText="margin:6px 0";
      const shuf = document.createElement("button"); shuf.className="mini"; shuf.textContent="🔀 3案ぜんぶ作り直す";
      shuf.onclick = () => run(true);
      shufRow.appendChild(shuf); out.appendChild(shufRow);
      cands.slice(0,3).forEach((c,i)=> renderTrendCard(out, c, "案"+(i+1)));
    }
    btn.onclick = () => run(false);
    card.appendChild(btn); card.appendChild(out);
    return btn;
  }

  /* Yahoo!ニュース照合版プロンプト: 実在ニュースの見出し+URLから選んで投稿 */
  function buzzPromptForTrendWithNews(tw, newsText, shuffle) {
    return `今Xでトレンドの「${tw}」について、X投稿を3案作る。\n`
      + `\n下は今のYahoo!ニュースの見出しとURLの一覧:\n${newsText}\n`
      + `\n【手順】\n`
      + `1. 上の一覧から「${tw}」に直接関連する"直近の"ニュースを1つ選ぶ\n`
      + `2. そのニュースに対する自分のリアルな感想・本音だけを書く\n`
      + `3. 各案の本文の最後に、選んだニュースのURLを改行して載せる(一覧の正確なURLをコピー。創作しない)\n`
      + `※「${tw}」に直接関連するニュースが一覧に無ければ、最初の行に「該当なし」とだけ書く(無理に関連付けない)\n`
      + personaClause()
      + `\n【最重要・AIっぽさを消す】\n`
      + `- 「〜になってるのは〜だからっしょ」のような"トレンド理由の説明"から入らない。理由説明は不要\n`
      + `- 作品やニュースのあらすじ・概要を説明しない(例「○○が△△をやっつける王道展開」みたいなWiki的説明は禁止)\n`
      + `- 友達にLINEで送るみたいな、リアルで具体的な一言の感想にする。例:「これ見ると毎年冬きたなって感じるわ」「結局これ何回見ても面白い」みたいな体温のある言葉\n`
      + `- きれいにまとめようとしない。ちょっと言い切ったり、素の感情を出す\n`
      + `\n【その他のNG】\n`
      + `- 推測・知ったかぶり(一覧のニュースに無いことを書かない)\n`
      + `- 「9割の人が〜」「実は〜なの」みたいな空っぽの煽り/誹謗中傷/決めつけ\n`
      + `- 事件・事故・訃報は茶化さず誠実に。芸能・スポーツ・エンタメは共感・ツッコミOK\n`
      + `\n【絵文字・誤字の注意・重要】\n`
      + `- 絵文字は話題に合うものだけ使う。今の話題「${tw}」と関係ない事業固有の絵文字(例: 競艇の🚤、釣りの🎣など)を、話題と無関係に付けない。サッカーの話題なら⚽など話題に合うものか、無理なら絵文字なしでよい\n`
      + `- 意味の通らない文字・誤字・謎の単語(例「やっぽ」)を絶対に混ぜない。日本語として自然に読める文だけ出力する\n`
      + `- <cite>などのHTML/XMLタグや「index="9-1"」のような引用参照を絶対に本文に書かない。投稿はそのままXに載る普通の文章にする\n`

      + (shuffle ? `前回と全く違う角度・感情で新鮮に。\n` : "")
      + `\n出力形式(厳守): 前置きなし。3案を「===」だけの行で区切り、各案は「本文(改行)URL」の形。`;
  }

  function transformBtn(card, label, genFn) {
    const btn = document.createElement("button"); btn.className = "mini cyan"; btn.textContent = label;
    const out = document.createElement("div");
    btn.onclick = async () => {
      btn.disabled = true; btn.textContent = "生成中…"; out.innerHTML = "";
      try {
        const text = await genFn();
        const cands = text.split(/\n?===+\n?/).map(s=>s.trim()).filter(s=>s.length>5);
        if (!cands.length) { out.innerHTML = '<div class="muted" style="padding:6px">うまく作成できませんでした。もう一度お試しください。</div>'; }
        else cands.slice(0,3).forEach((c,i)=> renderTrendCard(out, c, "案"+(i+1)));
      } catch(e) { out.innerHTML = '<div class="err">'+e.message+'</div>'; }
      btn.disabled = false; btn.textContent = label;
    };

    catch (e) { const cut = t.lastIndexOf("}"); if (cut > 0) return JSON.parse(t.slice(0, cut + 1) + "]"); throw e; }
  }

        (CFG.closedDays && CFG.closedDays.length ? `\n\n【定休日】${CFG.closedDays.join("・")}曜は定休日。その曜日には来店を促す営業告知を入れず、休業のお知らせや「明日から営業」等の定休日に合った内容にする。` : "") +
        `\n\n話題は事業内容(業種・店舗情報)に沿って自然に散らす。告知・豆知識・体験談・共感ネタなどをバランス良く配分し、店舗系の告知は週末に厚く。\n\n入れたいネタ・予定:\n${events.value||"特になし(業種に合うおまかせで)"}\n\nバズ狙いと告知をバランス良く。投稿時間は${timeRule}。` +

        (span.value === "週間"

          for (const ix of idxs) {
            /* この投稿の日付を渡してシーンを噛み合わせる */
            const pd = planDate(filtered[ix]);
            const ds = pd.getFullYear()+"-"+String(pd.getMonth()+1).padStart(2,"0")+"-"+String(pd.getDate()).padStart(2,"0");
            const sc2 = shPickScene(null, ds);
            const r = await shMixPostText(null, sc2);
            if (r && r.thread) {
              filtered[ix]._text = r.thread[0];
              filtered[ix]._thread = r.thread; /* スレッド全体を保持 */
              filtered[ix].t = "ミックス("+(sc2?sc2.scene:"おすすめ")+")"+(r.thread.length>1?" 🧵":""); filtered[ix].y = "ミックス"; filtered[ix].g = "シーシャミックス";
              if (!filtered[ix].h || !/^\d{1,2}:\d{2}$/.test(filtered[ix].h)) filtered[ix].h = "21:00";
            }
          }
        }
      }
      renderPlan(filtered);

      /* 週間以外(15日・月間)は枠だけ来てるので、続けて全日分の本文を自動生成 */
      if (span.value !== "週間") {
        /* 噂のシーシャBar: 頻度ぶんの日を先に「ミックス日」として確定 */
        let mixDays = new Set();
        if (isUwasaShisha(acct.value, CFG.bizName) && CFG.mixOn && (CFG.mixFreq||0) > 0) {
          const want = Math.round(filtered.length * (CFG.mixFreq/100));
          const idxs = filtered.map((_,i)=>i).sort(()=>Math.random()-0.5).slice(0, want);
          mixDays = new Set(idxs);
        }
        gen.textContent = "本文を生成中… 0/" + filtered.length;
        for (let i = 0; i < filtered.length; i++) {
          await genOne(filtered[i], false, mixDays.has(i));
          gen.textContent = "本文を生成中… " + (i+1) + "/" + filtered.length;
          renderPlan(filtered);
        }
      }
    } catch (e) { out.err("生成に失敗。もう一度押して。(" + e.message.slice(0, 80) + ")"); }
    gen.disabled = false; gen.textContent = "カレンダーを生成する";
  };

  function planDate(p) {
    const [m, d] = p.d.split("/").map(Number);
    const [hh, mm] = (p.h || "21:00").split(":").map(Number);
    const now = new Date();
    let y = now.getFullYear();
    if (m < now.getMonth() + 1 - 1) y += 1; // 年またぎ対策
    return new Date(y, m - 1, d, hh, mm || 0);
  }

  /* 通常の1投稿生成(shuffle=trueで毎回違う角度に。forceMix=trueでミックス確定) */
  async function genOne(p, shuffle, forceMix) {
    try {
      /* 噂のシーシャBar: forceMix指定時、または(指定なしで)頻度に当たればミックス紹介に */
      const shishaOn = isUwasaShisha(acct.value, CFG.bizName) && CFG.mixOn;
      const doMix = shishaOn && (forceMix === true || (forceMix === undefined && Math.random()*100 < (CFG.mixFreq||0)));
      if (doMix) {
        const pd = planDate(p);
        const ds = pd.getFullYear()+"-"+String(pd.getMonth()+1).padStart(2,"0")+"-"+String(pd.getDate()).padStart(2,"0");
        const sc2 = shPickScene(null, ds);
        const r = await shMixPostText(null, sc2);
        if (r && r.thread) {
          p._text = r.thread[0]; p._thread = r.thread;
          p.t = "ミックス("+(sc2?sc2.scene:"おすすめ")+")"+(r.thread.length>1?" 🧵":""); p.y = "ミックス"; p.g = "シーシャミックス";
          if (!p._lockTime && (!p.h || !/^\d{1,2}:\d{2}$/.test(p.h))) p.h = "21:00";
          return;
        }
      }
      const variant = shuffle ? "\n※前回と違う切り口・フック・語り口で、新鮮な別パターンにすること。" : "";
      /* 噂のシーシャBarの時、AIが勝手にフレーバー配合・おすすめミックス紹介を書くのを禁止
         (ミックス紹介は専用エンジンが星評価付きで担当するため) */
      const noMix = shishaOn
        ? "\n【禁止】具体的なフレーバーの配合比やおすすめミックスの紹介は書かない(別機能が担当)。代わりに店の雰囲気・豆知識・季節・営業案内・共感ネタなどで書く。"
        : "";
      /* 日本のイベントが近い日は、一部の投稿(約45%)にだけイベント要素を混ぜる(毎日同じネタにならないよう確率的) */
      let evHint = "";
      const pd2 = planDate(p);
      const ds2 = pd2.getFullYear()+"-"+String(pd2.getMonth()+1).padStart(2,"0")+"-"+String(pd2.getDate()).padStart(2,"0");
      const ev = pickJpEvent(ds2);
      if (ev && Math.random() < 0.45) {
        evHint = "\n【時季のヒント】今は「"+ev.name+"」の時季。"+ev.hint+"。ただし必ずこのアカウントの業種・事業の範囲内で絡めること(業種外の話題は持ち込まない)。自然に絡められそうなら投稿に織り込む(無理なら無視してよい。露骨な宣伝にしない)。";
      }
      const text = await callAI(`${S.sns}投稿を1本書け。\n日付: ${p.d}(${p.w}) ${p.h||""}投稿予定 / ジャンル: ${p.g||""} / テーマ: ${p.t} / 型: ${p.y}\n${S.sns==="X"?"140字以内。":"キャプション形式・ハッシュタグ5個。"}投稿文のみ出力。前置き禁止。${variant}${noMix}${evHint}${sc()}`);
      p._text = text.trim();
    } catch (e) { out.err(e.message); }
  }

  /* 無料予想生成: GASで実レース取得→Claudeで予想本文化 */
  async function genYosou(p, whenLabel) {
    const label = whenLabel || "本日";
    const dateWord = label === "明日" ? "明日" : "本日";
    try {
      const { data: sess } = await sb.auth.getSession();
      if (!sess.session) throw new Error("ログインが切れた。リロードして。");
      const yyyymmdd = (() => {
        const base = new Date();
        if (label === "明日") base.setDate(base.getDate() + 1);
        return "" + base.getFullYear() + String(base.getMonth()+1).padStart(2,"0") + String(base.getDate()).padStart(2,"0");
      })();

      /* 設定中のロジック(compareなら表示はscore)。CFGは呼び出し前にloadCfgForで読まれている */
      const acctCfg = JSON.parse(JSON.stringify(CFG || {}));

      const callGen = async () => {
        const ctrl = new AbortController();
        /* ★v228: boatrace.jpが激遅(実測1フェッチ約17秒)で、人気順は最大8本オッズ採点+詳細3本=
           約11フェッチ→混雑時は選定だけで190秒、Claude生成込みで最悪210秒に達する。
           旧90秒だと選定完了前にアボート→「取得失敗」になっていた。
           採点本数(8)は的中率のため据え置き、タイムアウトだけ300秒に拡大して確実に完走させる。
           (通常の空いてる時間帯は候補が少なく1.5〜2分で返る。300秒はあくまで混雑時の上限) */
        const timer = setTimeout(() => ctrl.abort(), 300000);
        try {
          const r = await fetch(GAS_URL, {
            method: "POST", headers: { "Content-Type": "text/plain" }, signal: ctrl.signal,
            body: JSON.stringify({
              auth: sess.session.access_token, action: "yosouGen",
              hd: yyyymmdd,
              minMinutes: label === "明日" ? -100000 : 15,
              maxMinutes: label === "明日" ? 100000 : 600,
              exclude: (window._recentRaces || []),
              acctCfg: acctCfg,
              logic: p._logicReq || "popular",
            }),
          });
          return await r.json();
        } finally { clearTimeout(timer); }
      };
      let race;
      try { race = await callGen(); }
      catch (e1) {
        await new Promise(r => setTimeout(r, 1500));
        try { race = await callGen(); }
        catch (e2) { p._text=""; p._deadline=""; p._deadlineUnknown=true; p._raceErr="通信失敗(Load failed)。電波を確認してもう一度押して。"; p.t=label+"の無料予想(通信失敗)"; return; }
      }
      if (race.error) {
        p._text = ""; p._deadline = ""; p._deadlineUnknown = true;
        p._raceErr = "レース取得失敗: " + race.error + (race.detail?" / "+race.detail:"");
        p.t = label + "の無料予想(取得失敗)";
        return;
      }
      /* 使ったレースを記録(次回除外) */
      window._recentRaces = window._recentRaces || [];
      window._recentRaces.push(race.jcd + "-" + race.rno);
      if (window._recentRaces.length > 5) window._recentRaces.shift();

      let text = (race.text || "").trim();
      /* 1行目を「本日/明日の無料予想を1レース公開」に正規化 */
      text = text.replace(/^.*無料予想.*公開.*$/m, dateWord + "の無料予想を1レース公開");
      p._text = text;
      p._venue = race.venue + race.rno + "R";
      p._logic = race.logic || "";
      p._deadline = race.deadline || "";
      p._deadlineUnknown = !(race.deadline && /^\d{1,2}:\d{2}$/.test(race.deadline));
      p._raceErr = "";

      if (label === "明日") { p.h = "21:00"; p._postToday = true; }
      else if (!p._deadlineUnknown) {
        const [hh, mm] = race.deadline.split(":").map(Number);
        let total = hh * 60 + mm - 15; if (total < 0) total = hh * 60 + mm;
        p.h = String(Math.floor(total/60)).padStart(2,"0") + ":" + String(total%60).padStart(2,"0");
      }
      p.t = label + "の無料予想" + (p._deadline ? "(締切" + p._deadline + ")" : "");
    } catch (e) { p._raceErr = String(e.message||e); out.err(e.message); }
  }

  function drawText(body, p, text) {
    p._text = text;
    const box = document.createElement("textarea");
    box.rows = 6;
    box.style.cssText = "width:100%;font-size:13.5px;line-height:1.7";
    box.value = text; body.appendChild(box);
    /* 編集したらp._textに反映(送信・コピーに使う) */
    box.oninput = () => { p._text = box.value; };
    /* スレッド2本目以降(あれば編集欄を出す) */
    const threadAreas = [];
    if (p._thread && p._thread.length > 1) {
      p._thread.slice(1).forEach((t2, i) => {
        const lbl = document.createElement("p"); lbl.className="desc"; lbl.style.margin="6px 0 2px"; lbl.textContent = "🧵 "+(i+2)+"本目(リプ)";
        body.appendChild(lbl);
        const ta2 = document.createElement("textarea"); ta2.rows = 5; ta2.value = t2;
        ta2.style.cssText = "width:100%;font-size:13px;line-height:1.6";
        body.appendChild(ta2); threadAreas.push(ta2);
      });
    }
    const acts = document.createElement("div"); acts.className = "acts"; body.appendChild(acts);
    const cp = document.createElement("button"); cp.className = "mini"; cp.textContent = "コピー";
    cp.onclick = () => { navigator.clipboard.writeText(p._text); cp.textContent = "コピー済"; setTimeout(()=>cp.textContent="コピー",1500); };
    acts.appendChild(cp);
    if (S.sns === "X") {
      const sd = document.createElement("button"); sd.className = "mini primary"; sd.textContent = "予約管理に送る";
      sd.onclick = async () => {
        if (!acct.value) { out.err("クライアント未登録。先に認証リンクから登録して。"); return; }
        sd.disabled = true;
        const threadVals = threadAreas.map(t=>t.value.trim()).filter(Boolean);
        const { error } = await saveScheduledPost({
          screen_name: acct.value, text: p._text, scheduled_at: planDate(p).toISOString(), status: "draft",
          thread: threadVals.length ? threadVals : null,
        });
        if (error) { out.err("送信エラー: " + error.message); sd.disabled = false; return; }
        sd.textContent = threadVals.length ? "送った✓(🧵"+(threadVals.length+1)+")" : "送った✓";
      };
      acts.appendChild(sd);
      const a = document.createElement("a"); a.className = "mini"; a.textContent = "Xで投稿→";
      a.href = "https://twitter.com/intent/tweet?text=" + encodeURIComponent(p._text); a.target = "_blank";
      a.onclick = () => { a.href = "https://twitter.com/intent/tweet?text=" + encodeURIComponent(p._text); };
      acts.appendChild(a);
    }
  }
};

  function fSeries() { return records.filter((r) => r.platform === key("フォロワー")).sort((a, b) => a.date.localeCompare(b.date)); }
  function drawAll() { drawStats(); drawGoal(); drawChart(); drawAI(); drawHist(); }

  function calcStats() {
    const fs = fSeries(); if (!fs.length) return null;
    const last = fs[fs.length - 1];
    const prev = fs.length > 1 ? fs[fs.length - 2] : null;
    const since = (days) => {
      const cutoff = new Date(Date.now() - days * 86400000).toISOString().slice(0, 10);
      const base = fs.filter((r) => r.date <= cutoff).pop() || fs[0];
      if (base.date === last.date) return null;
      const dd = Math.max(1, Math.round((new Date(last.date) - new Date(base.date)) / 86400000));
      return { diff: last.count - base.count, perDay: (last.count - base.count) / dd };
    };
    return { last, prevDiff: prev ? last.count - prev.count : null, w: since(7), m: since(30) };
  }
  const sign = (n) => (n >= 0 ? "+" : "") + Math.round(n).toLocaleString();
  const dc = (n) => n >= 0 ? "var(--ok)" : "var(--bad)";

  function drawStats() {
    const st = calcStats(); statsEl.innerHTML = "";
    if (!st) return;
    const w = document.createElement("div"); w.style.cssText = "display:flex;gap:8px;margin-top:18px"; statsEl.appendChild(w);
    [["NOW", st.last.count.toLocaleString(), st.prevDiff !== null ? "前回 " + sign(st.prevDiff) : "", st.prevDiff !== null ? dc(st.prevDiff) : ""],
     ["7 DAYS", st.w ? sign(st.w.diff) : "—", st.w ? (st.w.perDay >= 0 ? "+" : "") + st.w.perDay.toFixed(1) + "/日" : "記録待ち", st.w ? dc(st.w.diff) : ""],
     ["30 DAYS", st.m ? sign(st.m.diff) : "—", st.m ? (st.m.perDay >= 0 ? "+" : "") + st.m.perDay.toFixed(1) + "/日" : "記録待ち", st.m ? dc(st.m.diff) : ""]
    ].forEach(([l, v, s, c]) => {
      const d = document.createElement("div"); d.className = "stat";
      d.innerHTML = '<div class="l">' + l + '</div><div class="v">' + esc(v) + '</div>' + (s ? '<div class="s" style="color:' + (c || "var(--muted)") + '">' + esc(s) + "</div>" : "");
      w.appendChild(d);
    });
  }

  function drawGoal() {
    goalEl.innerHTML = "";
    fld(goalEl, "目標フォロワー数");

    const st = calcStats();
    if (goal) {
      let fc = null;
      if (st && st.w && st.w.perDay > 0) {
        const remain = goal - st.last.count;
        if (remain <= 0) fc = { done: true };
        else { const days = Math.ceil(remain / st.w.perDay); const d = new Date(Date.now() + days * 86400000); fc = { days, date: (d.getMonth() + 1) + "/" + d.getDate(), remain }; }
      }

      d.innerHTML = '<b style="color:var(--ok);font-family:var(--mono)">' + goal.toLocaleString() + "</b> " +

        ' <button class="mini" style="float:right;flex:none;padding:4px 8px;font-size:11px">変更</button>';

      const gb = document.createElement("button"); gb.className = "mini cyan"; gb.style.flex = "0 0 80px"; gb.textContent = "設定"; w.appendChild(gb);
      gb.onclick = async () => { const n = parseInt(gi.value); if (!n) return; goals[S.sns] = n; await kvSet(goalKey(), goals); drawGoal(); drawChart(); };

  function drawChart() {
    chartEl.innerHTML = "";
    const pts = fSeries(); if (pts.length < 2) return;
    const W = 340, H = 190, PL = 46, PR = 12, PT = 14, PB = 26;
    const goal = goals[S.sns];
    const mn = Math.min(...pts.map((r) => r.count)), mx = Math.max(...pts.map((r) => r.count));
    const pad = Math.max(1, Math.round((mx - mn) * .1));
    const lo = mn - pad, hi = mx + pad, sp = hi - lo || 1;
    const x = (i) => PL + (i / (pts.length - 1)) * (W - PL - PR);
    const y = (c) => PT + (1 - (c - lo) / sp) * (H - PT - PB);
    const fmtV = (v) => v >= 10000 ? (v / 10000).toFixed(1) + "万" : v.toLocaleString();
    let svg = '<div class="fld" style="font-size:10px;font-weight:800;letter-spacing:.2em;color:var(--accent2);font-family:var(--mono);margin:16px 0 8px">FOLLOWER GRAPH</div>' +
      '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;background:var(--surface2);border-radius:12px;border:1px solid var(--border)">';
    [lo, lo + sp / 2, hi].map(Math.round).forEach((v) => {
      svg += '<line x1="' + PL + '" x2="' + (W - PR) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="#1D2A47" stroke-dasharray="3 4"/>' +
        '<text x="' + (PL - 6) + '" y="' + (y(v) + 3.5) + '" text-anchor="end" font-size="9.5" fill="#7E8BA8" font-family="Menlo">' + fmtV(v) + "</text>";
    });
    if (goal && goal >= lo && goal <= hi) {
      svg += '<line x1="' + PL + '" x2="' + (W - PR) + '" y1="' + y(goal) + '" y2="' + y(goal) + '" stroke="#3DFFA8" stroke-width="1.5" stroke-dasharray="5 4"/>' +
        '<text x="' + (W - PR) + '" y="' + (y(goal) - 4) + '" text-anchor="end" font-size="9.5" fill="#3DFFA8" font-weight="700">目標 ' + goal.toLocaleString() + "</text>";
    }
    const line = pts.map((r, i) => (i ? "L" : "M") + x(i) + "," + y(r.count)).join(" ");
    svg += '<path d="' + line + ' L' + x(pts.length - 1) + ',' + (H - PB) + ' L' + PL + ',' + (H - PB) + ' Z" fill="rgba(255,46,126,.1)"/>' +
      '<path d="' + line + '" fill="none" stroke="#FF2E7E" stroke-width="2.5" stroke-linejoin="round"/>';
    const step = Math.max(1, Math.ceil(pts.length / 5));
    pts.forEach((r, i) => {
      svg += '<circle cx="' + x(i) + '" cy="' + y(r.count) + '" r="3.5" fill="#04060C" stroke="#FF2E7E" stroke-width="2"/>';
      if (i % step === 0 || i === pts.length - 1)
        svg += '<text x="' + x(i) + '" y="' + (H - 8) + '" text-anchor="middle" font-size="9.5" fill="#7E8BA8" font-family="Menlo">' + fmtJP(r.date) + "</text>";
    });
    chartEl.innerHTML = svg + "</svg>";
  }

  function drawAI() {

  function diff7(recs) {
    const fs = (recs || []).filter((r) => r.platform === key("フォロワー")).sort((a, b) => a.date.localeCompare(b.date));
    if (!fs.length) return null;
    const last = fs[fs.length - 1];
    const cutoff = new Date(Date.now() - 7 * 86400000).toISOString().slice(0, 10);
    const base = fs.filter((r) => r.date <= cutoff).pop() || fs[0];
    return { now: last.count, diff: base.date === last.date ? null : last.count - base.count };
  }

      const { data: pub } = sb.storage.from("post-media").getPublicUrl(path);
      mediaIn.value = pub.publicUrl;

    } catch (e) {

  const save = runBtn(el, "予約する");
  const cancel = document.createElement("button"); cancel.className = "btn btn-ghost hidden"; cancel.textContent = "編集をやめる"; el.appendChild(cancel);

    { key: "draft", label: "📋 予約待ち" },
    { key: "pending", label: "⏰ 予約確定" },
    { key: "done", label: "✅ 履歴" },
  ];
  let activeSub = "draft";
  const tabBtns = {};
  tabDefs.forEach((t) => {
    const b = document.createElement("button");
    b.textContent = t.label;
    b.style.cssText = "flex:1;padding:10px 4px;font-size:13px;font-weight:700;background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);cursor:pointer;transition:.15s";
    b.onclick = () => { activeSub = t.key; updateTabs(); };
    tabBar.appendChild(b); tabBtns[t.key] = b;
  });
  el.appendChild(tabBar);

  const draftEl = document.createElement("div"); el.appendChild(draftEl);
  const pendingEl = document.createElement("div"); el.appendChild(pendingEl);
  const histEl = document.createElement("div"); el.appendChild(histEl);

  function updateTabs() {
    tabDefs.forEach((t) => {
      const on = activeSub === t.key;
      tabBtns[t.key].style.color = on ? "var(--accent)" : "var(--muted)";
      tabBtns[t.key].style.borderBottomColor = on ? "var(--accent)" : "transparent";
    });
    draftEl.style.display = activeSub === "draft" ? "block" : "none";
    pendingEl.style.display = activeSub === "pending" ? "block" : "none";
    histEl.style.display = activeSub === "done" ? "block" : "none";
  }

  let editingId = null;

  function resetForm() { editingId = null; text.value = ""; when.value = ""; mediaIn.value = ""; cnt.textContent = "0字"; save.textContent = "予約する"; cancel.classList.add("hidden"); preview.style.display = "none"; upStatus.textContent = ""; }
  cancel.onclick = resetForm;

  save.onclick = async () => {
    out.err("");
    if (!acct.value || !when.value || !text.value.trim()) { out.err("全部入れて。"); return; }
    save.disabled = true;
    const rec = { screen_name: acct.value, scheduled_at: new Date(when.value).toISOString(), text: text.value.trim(), media_url: mediaIn.value.trim() || null };
    const { error } = editingId
      ? await sb.from("scheduled_posts").update(rec).eq("id", editingId)
      : await saveScheduledPost({ ...rec, status: "draft" });
    save.disabled = false;
    if (error) { out.err("保存エラー: " + error.message); return; }
    resetForm(); load();
  };

  function hhmm(iso) { const d = new Date(iso); return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }
  function fmtD(iso) { const d = new Date(iso); return (d.getMonth()+1)+"/"+d.getDate()+" "+hhmm(iso); }

  function postRow(p, actions) {
    const d = document.createElement("div"); d.className = "row";
    const threadCount = (p.thread && p.thread.length) ? p.thread.length : 0;
    const isPast = p.status === "draft" && new Date(p.scheduled_at).getTime() <= Date.now();
    d.innerHTML = '<div class="meta"><span class="pill time">'+hhmm(p.scheduled_at)+'</span><span class="pill acct">@'+esc(p.screen_name)+"</span>" +
      (isPast?'<span class="pill" style="background:rgba(239,68,68,.18);color:#f87171;border:1px solid rgba(239,68,68,.4)">⏰ 時間切れ</span>':"") +
      (p.media_url?'<span class="pill genre">🖼 画像</span>':"") +
      (threadCount?'<span class="pill genre">🧵 '+(threadCount+1)+'連投</span>':"") + "</div>" +
      "<pre style='white-space:pre-wrap;margin:0;font-family:inherit'></pre>" +
      (threadCount ? '<div style="font-size:12px;color:var(--muted);border-left:2px solid var(--border);padding-left:8px;margin-top:6px"></div>' : "") +
      '<div class="acts">' + actions.map((a,i)=>'<button class="mini '+(a.primary?'primary':'')+'" data-i="'+i+'">'+a.label+'</button>').join("") + '</div>';
    d.querySelector("pre").textContent = p.text;
    if (threadCount) {
      d.querySelector("pre + div").textContent = "🧵 " + p.thread.map((t,i)=>"("+(i+2)+") "+t).join("\n\n");
    }
    actions.forEach((a,i)=>{ d.querySelector('[data-i="'+i+'"]').onclick = a.fn; });
    return d;
  }

  function editPost(p) {
    editingId = p.id; acct.value = p.screen_name; text.value = p.text; mediaIn.value = p.media_url || ""; showPreview(p.media_url || "");
    const dt = new Date(p.scheduled_at); dt.setMinutes(dt.getMinutes()-dt.getTimezoneOffset());
    when.value = dt.toISOString().slice(0,16); cnt.textContent = p.text.length+"字";
    save.textContent = "更新する"; cancel.classList.remove("hidden"); window.scrollTo({top:0,behavior:"smooth"});
  }

  async function load() {
    const { data, error } = await sb.from("scheduled_posts").select("*").order("scheduled_at");
    if (error) { out.err(error.message); return; }
    const byTime = (a,b) => a.scheduled_at.localeCompare(b.scheduled_at);
    const drafts = data.filter((p)=>p.status==="draft").sort(byTime);
    const pending = data.filter((p)=>p.status==="pending").sort(byTime);
    const done = data.filter((p)=>p.status!=="pending"&&p.status!=="draft").sort((a,b)=>(b.posted_at||b.scheduled_at).localeCompare(a.posted_at||a.scheduled_at)).slice(0,20);

    /* タブのラベルに件数を反映 */
    tabBtns["draft"].textContent = "📋 予約待ち" + (drafts.length?" ("+drafts.length+")":"");
    tabBtns["pending"].textContent = "⏰ 予約確定" + (pending.length?" ("+pending.length+")":"");
    tabBtns["done"].textContent = "✅ 履歴" + (done.length?" ("+done.length+")":"");

    /* 日付区切りヘッダーを挟みながらリスト描画 */
    const WD = ["日","月","火","水","木","金","土"];
    function dayLabel(iso) {
      const d = new Date(iso);
      return (d.getMonth()+1) + "/" + d.getDate() + "(" + WD[d.getDay()] + ")";
    }
    function renderList(host, items, makeActions) {
      let lastDay = "";
      items.forEach((p) => {
        const dl = dayLabel(p.scheduled_at);
        if (dl !== lastDay) {
          lastDay = dl;
          const hd = document.createElement("div");
          hd.style.cssText = "font-family:var(--mono);font-weight:800;font-size:12px;color:var(--accent);letter-spacing:.1em;margin:14px 0 4px;padding-bottom:4px;border-bottom:1px solid var(--border)";
          hd.textContent = "📅 " + dl;
          host.appendChild(hd);
        }
        host.appendChild(postRow(p, makeActions(p)));
      });
    }

    /* === 予約待ちタブ === */
    draftEl.innerHTML = "";
    if (!drafts.length) draftEl.innerHTML = '<div class="muted" style="text-align:center;margin-top:20px">承認待ちなし。カレンダーや書き漏れから投稿を送るとここに入る。</div>';
    else {
      const bulkRow = document.createElement("div"); bulkRow.className = "acts";
      const goAll = document.createElement("button"); goAll.className = "mini primary"; goAll.textContent = "全部GO(" + drafts.length + "件を一括確定)";
      goAll.onclick = async () => {
        const now = Date.now();
        const past = drafts.filter((p) => new Date(p.scheduled_at).getTime() <= now);
        const future = drafts.filter((p) => new Date(p.scheduled_at).getTime() > now);
        if (past.length && !future.length) {
          showMiniModal("投稿時間を超えています", past.length + "件すべて投稿予定時刻を過ぎています。時刻を編集してからGOしてください。", [{ label: "OK", primary: true }], "⏰");
          return;
        }
        if (past.length) {
          showMiniModal("一部が時間切れです", "時刻を過ぎた" + past.length + "件は確定できません。先に進む" + future.length + "件だけ確定しますか?", [
            { label: "やめる" },
            { label: future.length + "件を確定", primary: true, fn: async () => {
              for (const p of future) await sb.from("scheduled_posts").update({ status: "pending" }).eq("id", p.id);
              activeSub = "pending"; load();
            } },
          ], "⏰");
          return;
        }
        await sb.from("scheduled_posts").update({ status: "pending" }).eq("status", "draft");
        activeSub = "pending"; load();
      };
      const delAll = document.createElement("button"); delAll.className = "mini"; delAll.textContent = "全部キャンセル";
      delAll.onclick = async () => {
        if (!confirm("承認待ち" + drafts.length + "件を全部キャンセルする?")) return;
        await sb.from("scheduled_posts").delete().eq("status", "draft");
        load();
      };
      bulkRow.appendChild(goAll); bulkRow.appendChild(delAll);
      draftEl.appendChild(bulkRow);
      renderList(draftEl, drafts, (p) => [
        { label: "GO", primary: true, fn: async () => {
          if (new Date(p.scheduled_at).getTime() <= Date.now()) {
            showMiniModal("投稿時間を超えています", "この投稿は予定時刻を過ぎています。「編集」で投稿時刻をやり直してください。", [
              { label: "閉じる" },
              { label: "時刻を編集", primary: true, fn: () => editPost(p) },
            ], "⏰");
            return;
          }
          await sb.from("scheduled_posts").update({ status: "pending" }).eq("id", p.id); load();
        } },
        { label: "編集", fn: () => editPost(p) },
        { label: "キャンセル", fn: async () => { await sb.from("scheduled_posts").delete().eq("id", p.id); load(); } },
      ]);
    }

    /* === 予約確定タブ === */
    pendingEl.innerHTML = "";
    if (!pending.length) pendingEl.innerHTML = '<div class="muted" style="text-align:center;margin-top:20px">予約確定なし。予約待ちでGOを出すとここに入る。</div>';
    else renderList(pendingEl, pending, (p) => [
      { label: "編集", fn: () => editPost(p) },
      { label: "予約キャンセル", fn: async () => { if (!confirm("この予約をキャンセルする?")) return; await sb.from("scheduled_posts").delete().eq("id", p.id); load(); } },
    ]);

    /* === 履歴タブ === */
    histEl.innerHTML = "";
    if (!done.length) histEl.innerHTML = '<div class="muted" style="text-align:center;margin-top:20px">履歴なし。</div>';
    done.forEach((p) => {
      const d = document.createElement("div"); d.className = "row";
      const threadCount = (p.thread && p.thread.length) ? p.thread.length : 0;
      d.innerHTML = '<div class="meta"><span class="pill time">'+fmtD(p.scheduled_at)+'</span><span class="pill acct">@'+esc(p.screen_name)+'</span><span class="pill st-'+p.status+'">'+(p.status==="posted"?"投稿済":"エラー")+"</span>"+(threadCount?'<span class="pill genre">🧵'+(threadCount+1)+'</span>':"")+"</div><pre style='white-space:pre-wrap;margin:0;font-family:inherit'></pre>"+(p.error_msg?'<div class="err">'+esc(p.error_msg)+"</div>":"");
      d.querySelector("pre").textContent = p.text;
      histEl.appendChild(d);
    });

    updateTabs();
  }
  load();
};

    listEl.innerHTML = "";

      }
      listEl.appendChild(d);
    });

  draw();
  todayBtn.onclick = draw; refreshBtn.onclick = draw;
};

          try {
            const r = await gasFetch_("lineToggle", { screen_name: sn, on: !_lnOn });
            if (r && r.ok) { toast(r.on ? "LINE配信を再開しました" : "LINE配信を一時停止しました(トークンは保持)", "ok"); await refresh(); }
          } catch (e) { toast("切替に失敗: " + e.message, "err"); }
          tg.disabled = false;
        };
        sv.onclick = async () => {
          sv.disabled = true; sv.textContent = "…";
          try {
            const r = await gasFetch_("lineTokenSave", { screen_name: sn, token: tok.value.trim() });
            if (r && r.ok) { toast(tok.value.trim() ? "LINE配信をONにしました" : "LINE配信をOFFにしました", "ok"); tok.value = ""; await refresh(); }
            else toast("保存に失敗: " + ((r && r.error) || ""), "err");
          } catch (e) { toast("保存に失敗: " + e.message, "err"); }
          sv.disabled = false; sv.textContent = "保存";
        };
        ts.onclick = async () => {
          ts.disabled = true; ts.textContent = "送信中…";
          try {
            const r = await gasFetch_("lineTestSend", { screen_name: sn });
            if (r && r.ok) toast("テスト配信を送りました。LINEを確認してください", "ok");
            else if (r && r.skipped) toast("トークンが未設定です", "err");
            else toast("配信失敗: HTTP" + (r && r.code) + " " + ((r && (r.body || r.error)) || ""), "err");
          } catch (e) { toast("配信失敗: " + e.message, "err"); }
          ts.disabled = false; ts.textContent = "📨 テスト配信を送る";
        };
        refresh();
      })(c.screen_name);
      /* 競艇業種のみ: 予想 */
      if (/競艇|ボートレース|ボート/.test(biz)) {
        d.appendChild(autoFeatureRow(c.screen_name, "yosou", "🚤 オート無料予想(人気順)", "毎日、締切が近いレースを人気順ロジックで自動予想して締切15分前に投稿", "linear-gradient(135deg,#00e5ff,#a855f7)"));
        d.appendChild(autoFeatureRow(c.screen_name, "yosou_score", "🎯 オート無料予想(直前スコア)", "締切直前の展示・ST・気象でスコアリングして本命6点を厳選し締切15分前に投稿。人気順と両方ONにすれば成績比較できる", "linear-gradient(135deg,#00e5ff,#22c55e)"));
        d.appendChild(autoFeatureRow(c.screen_name, "yokoku", "📣 オート明日の予告", "明日の開催情報を取得して『明日◯◯でレース!注目選手!』の集客予告を21時台に投稿(数字予想は出さない)", "linear-gradient(135deg,#00e5ff,#22c55e)", true));
        d.appendChild(autoFeatureRow(c.screen_name, "bigrace", "🚤 オート ビッグレース告知", "SG・PG1(グランドチャンピオン等)の大会期間中だけ、その日の見どころ告知を自動投稿(選手名は出さない・boatrace.jp公式から自動検出)。大会が無い日は投稿なし", "linear-gradient(135deg,#00e5ff,#ff2d95)"));
      }
      /* シーシャ業種のみ: フレーバー(店名が「噂のシーシャBar」系の時だけ。ミックスDBが専用のため) */
      if (/(噂|ウワサ|うわさ|uwasa).{0,4}(シーシャ|sisha|shisha)/i.test(biz)) {
        d.appendChild(autoFeatureRow(c.screen_name, "flavor", "💨 オートおすすめフレーバー", "毎日、おすすめミックスをバラバラの時間に自動投稿", "linear-gradient(135deg,#22c55e,#06b6d4)"));
      }
      frag.appendChild(d);
    });
    /* 自分より後に開始されたdrawがあれば、この結果は捨てる(多重実行で重複しないように) */
    if (myGen !== drawGen) return;
    listEl.innerHTML = "";
    listEl.appendChild(frag);
  }
  draw();
  const cp = document.createElement("button"); cp.className = "btn btn-ghost"; cp.textContent = "認証リンクをコピー(新規クライアント用)"; el.appendChild(cp);
  const ok = document.createElement("div"); ok.className = "okmsg"; el.appendChild(ok);
  cp.onclick = () => { navigator.clipboard.writeText(GAS_URL); ok.textContent = "コピーした。LINE等で送って。"; setTimeout(()=>ok.textContent="",2500); };
  const rf = document.createElement("button"); rf.className = "btn btn-ghost"; rf.textContent = "一覧を更新"; el.appendChild(rf);
  rf.onclick = draw;
};
</script>
</body>
</html>
