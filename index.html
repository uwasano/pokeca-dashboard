          ctx.shadowColor="rgba(0,0,0,0.25)"; ctx.shadowBlur=3; ctx.fillStyle=fill; ctx.fillText(t,x,y); ctx.shadowBlur=0;
        };
        /* 最上部: 「◯月の推し」季節バッジ(上品な飾り線つき) */
        if (opts.season) {
          ctx.font = "500 27px 'Hiragino Mincho ProN','YuMincho',serif"; ctx.textAlign = "left";
          const sw = ctx.measureText(opts.season).width;
          ctx.strokeStyle = "rgba(150,120,70,0.85)"; ctx.lineWidth = 1.6;
          ctx.beginPath(); ctx.moveTo(LX, 56); ctx.lineTo(LX+34, 56); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(LX+34+sw+24, 56); ctx.lineTo(LX+34+sw+58, 56); ctx.stroke();
          drawTxt(opts.season, LX+46, 66, "500 27px 'Hiragino Mincho ProN','YuMincho',serif", "rgba(140,105,55,1)", 2.5);
        }
        /* 上: 今日の気分(小・やわらか) */
        drawTxt(opts.mood||"今日の気分", LX, 122, "400 italic 34px 'Hiragino Mincho ProN','YuMincho',serif", "rgba(40,32,28,1)", 3);
        /* タイトル(大・上品でやわらか・太すぎない) */
        drawTxt(opts.title||"ナチュラルブレンド", LX, 198, "400 62px 'Hiragino Mincho ProN','YuMincho',serif", "rgba(30,24,20,1)", 3.5);
        /* オススメ度🌟 + 透明ガラス星 */
        if (opts.stars) {
          drawTxt("オススメ度🌟", LX, 260, "400 26px 'Hiragino Mincho ProN',serif", "rgba(40,32,28,1)", 2.5);
          const n=Math.max(1,Math.min(6,opts.stars));
          for (let i=0;i<n;i++) drawGlassStar_(ctx, LX+22+i*46, 300, 20);
        }
        /* 特徴メーター(甘さ/爽やか/清涼感): サンプルポスター風の5ドット表示 */
        if (opts.meters) {
          let my = 380;
          Object.keys(opts.meters).forEach((k) => {
            const v = Math.max(0, Math.min(5, Math.round((opts.meters[k]||0)/2)));

              ctx.beginPath(); ctx.arc(cx, cy, 10, 0, Math.PI*2);
              if (i < v) {
                const gg = ctx.createRadialGradient(cx-3, cy-3, 2, cx, cy, 11);
                gg.addColorStop(0, "rgba(220,180,110,0.98)"); gg.addColorStop(1, "rgba(165,120,55,0.95)");
                ctx.fillStyle = gg; ctx.shadowColor = "rgba(200,160,90,0.6)"; ctx.shadowBlur = 6; ctx.fill(); ctx.shadowBlur = 0;
              } else {
                ctx.lineWidth = 1.6; ctx.strokeStyle = "rgba(150,120,70,0.55)"; ctx.stroke();
              }
            }
            my += 46;
          });
        }
        /* 使用フレーバー名を縦に並べる(左下) */
        if (opts.flavors && opts.flavors.length) {
          drawTxt("使用フレーバー", LX, H-262, "500 23px 'Hiragino Kaku Gothic ProN',sans-serif", "rgba(40,32,28,1)", 2.5);
          opts.flavors.slice(0,5).forEach((f,i)=>{
            drawTxt("・"+f, LX, H-214+i*42, "400 28px 'Hiragino Mincho ProN','YuMincho',serif", "rgba(30,24,20,1)", 2.5);
          });
        }
        /* 店名(最下部) */
        drawTxt(opts.shop||"噂のシーシャBar", LX, H-30, "500 28px 'Hiragino Kaku Gothic ProN','YuGothic',sans-serif", "rgba(30,24,20,1)", 2.5);
        resolve(cv.toDataURL("image/jpeg",0.92).split(",")[1]);
      } catch(e){ reject(e); }
    };
    img.onerror = () => reject(new Error("画像読み込み失敗"));
    img.src = (typeof bg==="string" && bg.indexOf("http")===0) ? bg : ("data:image/png;base64,"+bg);
  });
}

          const bg = (ir && ir.b64) ? ir.b64 : ((ir && ir.url) ? ir.url : null);
          if (bg) {
            const osusume = p.sc>=90?6:(p.sc>=85?5:4);
            const sc = shScene_(p.combo);
            const flist = p.combo.slice().sort((a,b)=>b.ratio-a.ratio).map(c=>c.name+"("+shBrandOf(c.name)+") "+c.ratio);
            mediaB64 = await composeShishaImage_(bg, { mood:"今日の気分", title:sc.title, flavors:flist, shop:"噂のシーシャBar", stars:osusume, season:(new Date().getMonth()+1)+"月の推し", meters:{ 甘さ:Math.round(shAvg(p.combo,0)), 酸味:Math.round(shAvg(p.combo,1)), 清涼感:Math.round(shAvg(p.combo,2)) } });
          }

        const r = await gasFetch_("postMixImage", { screen_name: S.activeAccount, text: res.thread[0], thread: res.thread.length>1?res.thread:null, media_b64: mediaB64 });

function chipsSingleInto(host, options, initial, onChange) {
  const w = document.createElement("div"); w.className = "chips"; host.appendChild(w);
  let cur = initial;
  function draw() {
    w.innerHTML = "";
    options.forEach((o) => {
      const c = document.createElement("button");
      c.className = "chip" + (cur === o ? " on" : "");
      c.textContent = o;
      c.onclick = () => { cur = o; onChange(o); draw(); };
      w.appendChild(c);
    });
  }
  draw();
}

  let excludeSel = {};  /* 除外ON/OFF */
  RADAR_EXCLUDES.forEach((x,i)=> excludeSel[x] = (i<5)); /* 上位5個は初期ON */
  let strength = "normal", limit = 30, period = "24h";
  let lastQueries = [];
  let mode = "search"; /* "search"=第1弾検索方式 / "competitor"=第2弾競合エンゲージ方式 */
  let rivalOn = {};    /* 競合モードの競合ごとON/OFF(キー=小文字handle, false=除外。未定義はON) */

  /* モード切替(🔍検索で探す / 👥競合に絡む客) */
  function renderModeToggle() {
    const lab = document.createElement("div"); lab.className = "desc"; lab.style.cssText = "margin:2px 0 5px;font-size:12px";
    lab.textContent = "📡 探し方を選ぶ";
    body.appendChild(lab);
    const seg = document.createElement("div");
    seg.style.cssText = "display:flex;gap:5px;margin:0 0 14px;padding:5px;border-radius:13px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09)";
    [["🔍 検索で探す","search"],["👥 競合に絡む客","competitor"]].forEach(([txt,val])=>{
      const on = (mode===val);
      const b = document.createElement("button");
      b.textContent = txt;
      b.style.cssText = "flex:1;text-align:center;padding:12px 8px;border:none;border-radius:9px;font-size:14px;font-weight:800;cursor:pointer;transition:all .15s;"
        + (on
            ? "background:linear-gradient(135deg,rgba(34,224,255,.22),rgba(168,85,247,.22));color:#22e0ff;box-shadow:0 0 14px rgba(34,224,255,.4),inset 0 0 0 1px rgba(34,224,255,.4)"
            : "background:transparent;color:var(--muted)");
      b.onclick = ()=>{ if(mode===val) return; mode=val; out.innerHTML=""; renderBody(); };
      seg.appendChild(b);
    });
    body.appendChild(seg);
  }

  function renderBody() {
    body.innerHTML = "";
    renderModeToggle();
    if (mode === "competitor") { renderCompetitorBody(); return; }
    const biz = (CFG.bizType || "").trim();
    const area = (CFG.bizArea || "").trim();

    /* 業種・地域の表示(生成設定から) */
    const info = document.createElement("div"); info.className = "card"; info.style.cssText = "padding:10px;margin-bottom:10px;font-size:13px";
    info.innerHTML = "🏷️ 業種: <b>" + (biz?esc(biz):'<span style="color:#f88">未設定</span>') + "</b>　📍 地域: <b>" + (area?esc(area):'<span style="color:#f88">未設定</span>') + "</b>"
      + '<div class="desc" style="margin-top:4px">業種・地域は「⚙生成設定」で変更できる。地域を入れると地域名入りの検索も作る。</div>';
    body.appendChild(info);

    /* 欲望ON/OFF */
    fld(body, "狙う客の感情・欲望(ONにしたものでAIが検索ワードを作る)");
    const preset = radarDesirePresetFor(biz);
    if (Object.keys(desireSel).length === 0) preset.forEach((d,i)=> desireSel[d] = (i<3));
    const dWrap = document.createElement("div"); dWrap.className = "chips"; body.appendChild(dWrap);
    preset.forEach(d => {
      if (!(d in desireSel)) desireSel[d] = false;
      const b = document.createElement("button"); b.className = "chip" + (desireSel[d]?" on":""); b.textContent = d;
      b.onclick = ()=>{ desireSel[d]=!desireSel[d]; b.className = "chip"+(desireSel[d]?" on":""); };
      dWrap.appendChild(b);
    });
    /* 自由入力で欲望追加 */
    const addRow = document.createElement("div"); addRow.style.cssText = "display:flex;gap:6px;margin-top:6px";
    const addIn = document.createElement("input"); addIn.placeholder = "他の欲望を追加(例: 一人で静かに飲みたい)"; addIn.style.cssText = "flex:1;padding:8px;border-radius:8px;font-size:13px";
    const addBtn = document.createElement("button"); addBtn.className = "mini"; addBtn.textContent = "＋追加";
    addBtn.onclick = ()=>{ const v = addIn.value.trim(); if(!v) return; desireSel[v]=true; addIn.value=""; renderBody(); };
    addRow.appendChild(addIn); addRow.appendChild(addBtn); body.appendChild(addRow);

    /* 除外フィルター */
    fld(body, "🚫 除外したい相手(AIがプロフィール・投稿から判定して弾く)");
    const eWrap = document.createElement("div"); eWrap.className = "chips"; body.appendChild(eWrap);
    RADAR_EXCLUDES.forEach(x => {
      const b = document.createElement("button"); b.className = "chip" + (excludeSel[x]?" on":""); b.textContent = x;
      b.onclick = ()=>{ excludeSel[x]=!excludeSel[x]; b.className = "chip"+(excludeSel[x]?" on":""); };
      eWrap.appendChild(b);
    });

    /* 検索強度・件数・期間 */
    fld(body, "検索の細かさ");
    const optRow = document.createElement("div"); optRow.style.cssText = "display:flex;flex-direction:column;gap:8px"; body.appendChild(optRow);
    optRow.appendChild(radarChoice("検索強度", [["弱","weak"],["普通","normal"],["強","strong"]], strength, v=>strength=v));
    optRow.appendChild(radarChoice("表示件数", [["10",10],["30",30],["50",50]], limit, v=>limit=v));
    optRow.appendChild(radarChoice("投稿期間", [["1時間","1h"],["24時間","24h"],["3日","3d"],["7日","7d"]], period, v=>period=v));
    const note2 = document.createElement("p"); note2.className="desc"; note2.style.cssText="margin:8px 0 0;font-size:11.5px";
    note2.textContent = "※まずは件数を少なめ(10〜30)でテストするのがおすすめ。検索数・取得件数・AI判定数で費用と時間が変わる。業者っぽい投稿は先に自動で除外し、見込み度の高い上位だけAI判定する。";
    body.appendChild(note2);

    /* 実行ボタン */
    const runRow = document.createElement("div"); runRow.style.cssText = "margin-top:14px;display:flex;flex-direction:column;gap:8px"; body.appendChild(runRow);
    const runBtn = document.createElement("button"); runBtn.className = "btn"; runBtn.textContent = "📡 見込み客をさがす";
    runBtn.onclick = ()=> runRadar();
    runRow.appendChild(runBtn);
    const listBtn = document.createElement("button"); listBtn.className = "mini"; listBtn.textContent = "⭐ 保存した見込み客リストを見る";
    listBtn.onclick = ()=> showSavedList();
    runRow.appendChild(listBtn);
  }

  /* ===== 第2弾: 競合に絡む客から探す ===== */
  function renderCompetitorBody() {
    const biz = (CFG.bizType || "").trim();
    const area = (CFG.bizArea || "").trim();
    const competitors = parseCompetitors_(CFG.competitors);
    let scanBtn; /* 実行ボタン参照(タグ側からラベル更新するため) */
    /* v225: 1競合選択制。初期選択は⭐デフォルト競合(無ければ1番目) */
    if (competitors.length && !competitors.some(c => rivalOn[c.toLowerCase()] === true)) {
      const mainC = String(CFG.mainCompetitor || "").toLowerCase();
      const defC = competitors.some(c => c.toLowerCase() === mainC) ? mainC : competitors[0].toLowerCase();
      competitors.forEach(c => { rivalOn[c.toLowerCase()] = (c.toLowerCase() === defC); });
    }
    const selectedComp = () => { const s = competitors.filter(c => rivalOn[c.toLowerCase()] === true); return s.length ? s[0] : null; };
    const updateScanLabel = () => { if (scanBtn) { const s = selectedComp(); scanBtn.textContent = s ? "📡 @" + s + " に絡む客をさがす" : "📡 競合に絡む客をさがす（競合を選択）"; } };

    /* 業種・地域 */
    const info = document.createElement("div"); info.className = "card"; info.style.cssText = "padding:10px;margin-bottom:10px;font-size:13px";
    info.innerHTML = "🏷️ 業種: <b>" + (biz?esc(biz):'<span style="color:#f88">未設定</span>') + "</b>　📍 地域: <b>" + (area?esc(area):'<span style="color:#f88">未設定</span>') + "</b>";
    body.appendChild(info);

    /* 仕組み説明 */
    const how = document.createElement("p"); how.className="desc"; how.style.cssText="margin:2px 0 10px;font-size:12px;line-height:1.7";
    how.innerHTML = "⚙生成設定で登録した<b>競合アカウント</b>に、実際にリプ・メンションして<b>絡んでる客</b>を集めて、絡んだ回数の多い順に見込み度を判定する。同じ業界に前のめりな濃い客が取れる。";
    body.appendChild(how);

    /* 登録済み競合の表示(v225: 1つだけ選ぶ選択制) */
    fld(body, "調査する競合を1つ選ぶ(⚙生成設定で追加削除・⭐がデフォルト)");
    const cWrap = document.createElement("div"); cWrap.className = "chips"; body.appendChild(cWrap);
    if (competitors.length) {
      const looks = [];
      competitors.forEach(c => {
        const key = c.toLowerCase();
        const b = document.createElement("button");
        const setLook = () => {
          const on = rivalOn[key] === true;
          b.className = "chip" + (on ? " on" : "");
          if (on) { b.style.cssText = "opacity:1"; b.textContent = "✓ @" + c; }
          else { b.style.cssText = "opacity:.5"; b.textContent = "@" + c; }
        };
        setLook(); looks.push(setLook);
        /* ラジオ動作: 1つ選ぶと他は全部OFF */
        b.onclick = () => { competitors.forEach(cc => { rivalOn[cc.toLowerCase()] = false; }); rivalOn[key] = true; looks.forEach(f => f()); updateScanLabel(); };
        cWrap.appendChild(b);
      });
      const tip = document.createElement("p"); tip.className = "desc"; tip.style.cssText = "margin:6px 0 0;font-size:11.5px";
      tip.textContent = "タップで対象を1つ選ぶ(API節約のため1回の調査は1競合だけ)。最初は⚙生成設定の⭐デフォルト競合が選ばれてる。";
      body.appendChild(tip);
    } else {
      const warn = document.createElement("div"); warn.style.cssText = "color:#ff9;font-size:12.5px;padding:4px 0;line-height:1.6";
      warn.innerHTML = '競合がまだ登録されていません。<b>⚙生成設定</b>の「競合アカウント」欄にライバルのXアカウントを入れてください(URL貼り付け可・自動で@名だけ抽出します)。';
      cWrap.appendChild(warn);
    }

    /* 件数 */
    fld(body, "表示件数");
    const optRow = document.createElement("div"); optRow.style.cssText = "display:flex;flex-direction:column;gap:8px"; body.appendChild(optRow);
    optRow.appendChild(radarChoice("表示件数", [["10",10],["30",30],["50",50]], limit, v=>limit=v));
    const note2 = document.createElement("p"); note2.className="desc"; note2.style.cssText="margin:8px 0 0;font-size:11.5px";
    note2.textContent = "※絡みの多い競合ほど客が取れる。リプの少ないアカウントは0件になることがある。絡み回数の多い上位だけAI判定するんで費用は抑えめ。";
    body.appendChild(note2);

    /* 実行 */
    const runRow = document.createElement("div"); runRow.style.cssText = "margin-top:14px;display:flex;flex-direction:column;gap:8px"; body.appendChild(runRow);
    scanBtn = document.createElement("button"); scanBtn.className = "btn";
    scanBtn.onclick = ()=> runCompetitorRadar();
    updateScanLabel();
    runRow.appendChild(scanBtn);
    const listBtn = document.createElement("button"); listBtn.className = "mini"; listBtn.textContent = "⭐ 保存した見込み客リストを見る";
    listBtn.onclick = ()=> showSavedList();
    runRow.appendChild(listBtn);
  }

  /* CFG.competitors → ユーザー名配列。URL/＠/素の名前/?param付きどれでも@名に正規化(normalizeCompetitors_流用) */
  function parseCompetitors_(raw) {
    return normalizeCompetitors_(raw).split(/\n+/).map(s=>s.trim()).filter(Boolean);
  }

  async function runCompetitorRadar() {
    if (!acct.value) { alert("対象アカウントを選んでください"); return; }
    await loadCfgFor(acct.value);
    const biz = (CFG.bizType||"").trim();
    if (!biz) { alert("先に⚙生成設定で業種を入れてください(例: 競艇予想 / 金沢のシーシャバー)"); return; }
    const area = (CFG.bizArea||"").trim();
    const competitors = parseCompetitors_(CFG.competitors);
    /* 競合欄がURLや?param付きのままなら@名に正規化して保存(次回から綺麗に・自己修復) */
    const cleaned = competitors.join("\n");
    if (competitors.length && cleaned !== String(CFG.competitors||"").trim()) {
      CFG.competitors = cleaned; try { await saveCfg(); } catch(_){}
    }
    if (!competitors.length) {
      out.innerHTML = '<div class="card" style="padding:14px;font-size:13px;line-height:1.8">'
        + '👥 競合がまだ登録されていません。<br><br>'
        + '<b>⚙生成設定</b>の「競合アカウント」欄に、ライバルのXアカウントを入れてください。<br>'
        + 'URLを貼り付けてもOK(入力欄の外をタップで自動整形され、@名だけ残る)。<br><br>'
        + 'ここに登録した競合に<b>実際に絡んでる客</b>を、絡んだ回数の多い順に拾って見込み度を判定するで。'
        + '</div>';
      return;
    }
    /* v225: 1競合選択制。選択が無ければ⭐デフォルト(無ければ1番目)にフォールバック */
    let selected = competitors.filter(c => rivalOn[c.toLowerCase()] === true);
    if (!selected.length) {
      const mainC = String(CFG.mainCompetitor || "").toLowerCase();
      selected = [competitors.find(c => c.toLowerCase() === mainC) || competitors[0]];
    }
    selected = selected.slice(0, 1);
    const excludes = RADAR_EXCLUDES.filter(x=>excludeSel[x]);
    out.innerHTML = '<div class="muted" style="padding:10px;line-height:1.7">👥 競合に絡んでる客を集めてAI判定中…(30秒〜1分)<br>対象競合: ' + selected.map(c=>"@"+esc(c)).join(" / ") + '</div>';
    try {
      const sr = await gasFetch_("radarCompetitorScan", { competitors: selected, industry: biz, area, service: biz, excludes, limit, minScore: 30, screen_name: acct.value });
      const items = (sr && sr.items) ? sr.items : [];
      if (!items.length) {
        const dbg = (sr && sr.debug) ? sr.debug : {};
        const perComp = (sr && sr.perComp) ? sr.perComp : [];
        let lines = "条件を満たす見込み客が見つかりませんでした。<br><br>";
        lines += '<div style="font-size:12px;line-height:1.8;font-family:monospace">'
          + '競合数: ' + (dbg.competitors||0) + '<br>'
          + '取得した絡み: ' + (dbg.fetched||0) + '件<br>'
          + 'ユニーク客: ' + (dbg.uniqueUsers||0) + '人<br>'
          + 'AI判定: ' + (dbg.judged||0) + '人<br>'
          + '通過(30点以上): ' + (dbg.passed||0) + '人'
          + '</div><br>';
        if (sr && sr.error==="NO_COMPETITORS") lines += '👉 競合が空です。⚙生成設定で登録してください。';
        else if (!dbg.fetched) lines += '👉 競合への絡みが0件。リプの少ないアカウントやと取れん。<b>もっと絡みの多い競合</b>を足すか、別の競合で試して。';
        else if (!dbg.judged) lines += '👉 顧客は取得できましたがAI判定が空でした。もう一度試すか件数を変えてみてください。';
        else lines += '👉 候補はありましたが30点未満でした。別の競合を足すと精度が上がります。';
        if (perComp.length) {
          lines += '<br><br><span class="muted" style="font-size:11px">競合別の絡みヒット数:<br>'
            + perComp.map(p=>"@"+esc(p.competitor)+" → "+p.hits+"件").join("<br>") + '</span>';
        }
        out.innerHTML = '<div class="card" style="padding:12px;font-size:12.5px;line-height:1.7">'+lines+'</div>';
        return;
      }
      renderCompetitorResults(items, sr.debug, sr.perComp, selected);
    } catch(e) { out.innerHTML = '<div class="err">'+esc(e.message)+'</div>'; }
  }

  function renderCompetitorResults(items, dbg, perComp, competitors) {
    out.innerHTML = "";
    const head2 = document.createElement("div"); head2.className = "desc"; head2.style.margin = "6px 0";
    let summary = '👥 競合: ' + competitors.map(c=>"@"+esc(c)).join(" / ");
    if (perComp && perComp.length) summary += '<br><span style="font-size:11px;color:var(--muted)">絡みヒット: ' + perComp.map(p=>"@"+esc(p.competitor)+" "+p.hits+"件").join(" / ") + '</span>';
    if (dbg) summary += '<br><span style="font-size:11px;color:var(--muted)">絡み'+(dbg.fetched||0)+'→客'+(dbg.uniqueUsers||0)+'人→判定'+(dbg.judged||0)+'→表示'+(dbg.passed||0)+'</span>';
    summary += '<br>絡み回数×見込み度の高い順。スワイプで捌く or リプ案をタップ:';
    head2.innerHTML = summary;
    out.appendChild(head2);
    const _swb = document.createElement("button"); _swb.className="mini cyan"; _swb.style.cssText="width:100%;padding:12px;margin:6px 0 10px;font-weight:800;font-size:14px"; _swb.textContent="🃏 スワイプで一気に捌く ("+items.length+"件)"; _swb.onclick=()=>openRadarSwipe(items.slice()); out.appendChild(_swb);
    items.forEach(it => out.appendChild(radarCard(it)));
  }

  function radarChoice(label, opts, cur, onPick) {
    const wrap = document.createElement("div");
    const lab = document.createElement("div"); lab.className = "desc"; lab.style.marginBottom = "4px"; lab.textContent = label; wrap.appendChild(lab);
    const row = document.createElement("div"); row.className = "chips"; wrap.appendChild(row);
    const btns = [];
    opts.forEach(([txt,val]) => {
      const b = document.createElement("button"); b.className = "chip" + (cur===val?" on":""); b.textContent = txt;
      b.onclick = ()=>{ onPick(val); btns.forEach(x=>x.b.className="chip"+(x.val===val?" on":"")); };
      btns.push({b,val}); row.appendChild(b);
    });
    return wrap;
  }

  async function runRadar() {
    if (!acct.value) { alert("対象アカウントを選んでください"); return; }
    await loadCfgFor(acct.value);
    const biz = (CFG.bizType||"").trim();
    if (!biz) { alert("先に⚙生成設定で業種を入れてください(例: 金沢のシーシャバー)"); return; }
    const area = (CFG.bizArea||"").trim();
    const desires = Object.keys(desireSel).filter(k=>desireSel[k]);
    const excludes = RADAR_EXCLUDES.filter(x=>excludeSel[x]);

    out.innerHTML = '<div class="muted" style="padding:10px">① AIが検索ワードを考え中…</div>';
    try {
      /* ① クエリ生成 */
      const qr = await gasFetch_("radarQueries", { industry: biz, area, desires, strength, period });
      lastQueries = (qr && qr.queries) ? qr.queries : [];
      if (!lastQueries.length) {
        /* 原因切り分け用: GASが実際に返した中身をそのまま見せる */
        let dump = '';
        try { dump = JSON.stringify(qr); } catch(_) { dump = String(qr); }
        out.innerHTML = '<div class="err" style="padding:12px;font-size:12px;line-height:1.7">'
          + '検索ワードを作成できませんでした。<br><br>'
          + '<b>送信した業種:</b> ' + esc(biz || '(空)') + '<br>'
          + '<b>送信した欲望:</b> ' + esc(desires.join(' / ') || '(空)') + '<br>'
          + '<b>GASからの返り:</b><br><span style="font-family:monospace;word-break:break-all">' + esc(dump.slice(0,800)) + '</span>'
          + '</div>';
        return;
      }
      out.innerHTML = '<div class="card" style="padding:10px;margin-bottom:10px;font-size:12.5px">🔍 検索ワード: ' + lastQueries.map(q=>esc(q)).join(" / ") + '</div><div class="muted" style="padding:10px">② Xを検索して見込み客をAI判定中…(30秒ほど)</div>';

      /* ② 検索+判定 */
      const sr = await gasFetch_("radarSearch", { industry: biz, area, service: biz, queries: lastQueries, excludes, period, limit, screen_name: acct.value, minScore: 30 });
      const items = (sr && sr.items) ? sr.items : [];
      if (!items.length) {
        const dbg = (sr && sr.debug) ? sr.debug : {};
        let lines = "今回は表示条件を満たす見込み客が見つかりませんでした。<br><br>";
        lines += '<div style="font-size:12px;line-height:1.8;font-family:monospace">'
          + '生成クエリ: ' + (dbg.generated||0) + '件<br>'
          + 'X取得: ' + (dbg.fetched||0) + '件<br>'
          + '重複除外後: ' + (dbg.deduped||0) + '件<br>'
          + '期間内: ' + (dbg.inPeriod||0) + '件<br>'
          + '一次除外後: ' + (dbg.afterSpam||0) + '件<br>'
          + 'AI判定対象: ' + (dbg.judgeTarget||0) + '件<br>'
          + 'AI判定通過: ' + (dbg.judged||0) + '件<br>'
          + '30点以上: ' + (dbg.shown||0) + '件'
          + '</div><br>';
        /* どこで消えたかで対策を出し分け */
        if (!dbg.fetched) lines += '👉 X検索が0件でした。<b>期間を3日/7日に広げる</b>か、狙う欲望を増やして再度お試しください。クエリが特殊すぎる可能性もあります。';
        else if (!dbg.afterSpam) lines += '👉 取れたけど一次除外で全部消えた。業者・愚痴・攻撃的投稿ばかりやったかも。欲望や客層を変えてみて。';
        else if (!dbg.judged) lines += '👉 投稿は取得できましたが、AIが見込み客と判定しませんでした。別の欲望・客層を足すと精度が上がります。';
        else lines += '👉 候補はありましたが30点未満でした。欲望や客層を見直して再度お試しください。';
        /* 各クエリのヒット数も出す(どのクエリが弱いか分かる) */
        if (dbg.perQuery && dbg.perQuery.length) {
          lines += '<br><br><span class="muted" style="font-size:11px">クエリ別ヒット数:<br>'
            + dbg.perQuery.map(p=>esc(p.query)+' → '+p.got+'件'+(p.err?' ('+esc(p.err)+')':'')).join('<br>')
            + '</span>';
        }
        out.innerHTML = '<div class="card" style="padding:12px;font-size:12.5px;line-height:1.7">'+lines+'</div>';
        return;
      }
      renderResults(items, sr.debug);
    } catch(e) { out.innerHTML = '<div class="err">'+esc(e.message)+'</div>'; }
  }

  function renderResults(items, dbg) {
    out.innerHTML = "";
    const head2 = document.createElement("div"); head2.className = "desc"; head2.style.margin = "6px 0";
    let summary = '🔍 ' + lastQueries.map(q=>esc(q)).join(" / ");
    if (dbg && dbg.cached) summary += '<br><span style="font-size:11px;color:var(--accent2)">⚡ ' + (dbg.cacheAgeMin || 0) + '分前の結果を即表示(30分以内は再検索なし・API消費なし)</span>';
    if (dbg) summary += '<br><span style="font-size:11px;color:var(--muted)">取得'+(dbg.fetched||0)+'→重複除外'+(dbg.deduped||0)+'→期間内'+(dbg.inPeriod||0)+'→除外後'+(dbg.afterSpam||0)+'→判定'+(dbg.judged||0)+'→表示'+(dbg.shown||0)+'</span>';
    summary += '<br>見込み度の高い順。リプ案をコピーしてXで送る(送信は手動):';
    head2.innerHTML = summary;
    out.appendChild(head2);
    if (!items.length) { out.innerHTML += '<div class="muted" style="padding:10px">見込み客が見つかりませんでした。期間を広げる/欲望を増やす/強度を上げて再度お試しください。</div>'; return; }
    const _swb = document.createElement("button"); _swb.className="mini cyan"; _swb.style.cssText="width:100%;padding:12px;margin:6px 0 10px;font-weight:800;font-size:14px"; _swb.textContent="🃏 スワイプで一気に捌く ("+items.length+"件)"; _swb.onclick=()=>openRadarSwipe(items.slice()); out.appendChild(_swb);
    items.forEach(it => out.appendChild(radarCard(it)));
  }

  function radarCard(it) {
    const card = document.createElement("div"); card.className = "card"; card.style.cssText = "padding:12px;margin-top:10px";
    const riskColor = it.risk_level==="high" ? "#ff5577" : it.risk_level==="medium" ? "#ffaa33" : "#33cc88";
    const riskLabel = it.risk_level==="high" ? "⚠️高" : it.risk_level==="medium" ? "注意" : "安全";
    const sc = Math.max(0, Math.min(100, it.score||0));
    const rk = Math.max(0, Math.min(100, (typeof it.risk_score==="number") ? it.risk_score : (it.risk_level==="high"?80:it.risk_level==="medium"?50:10)));
    /* 見込み度で色を変える: 高=シアン, 中=紫, 低=くすみ */
    const scColor = sc>=75 ? "#22e0ff" : sc>=50 ? "#a855f7" : "#7a8499";
    const scGlow = sc>=75 ? "rgba(34,224,255,.65)" : sc>=50 ? "rgba(168,85,247,.55)" : "rgba(122,132,153,.35)";
    /* 危険度: 高いほど赤く光る */
    const rkColor = rk>=65 ? "#ff4466" : rk>=35 ? "#ffaa33" : "#33cc88";
    const rkGlow = rk>=65 ? "rgba(255,68,102,.6)" : rk>=35 ? "rgba(255,170,51,.5)" : "rgba(51,204,136,.4)";
    card.innerHTML =
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">'
      + '<div style="font-size:12px;color:var(--accent2)">@'+esc(it.author_handle||"")+(it.posted_at?' · '+timeAgo(it.posted_at):'')+'</div>'
      + '<span style="font-size:11px;padding:2px 7px;border-radius:6px;background:'+riskColor+'22;color:'+riskColor+'">'+riskLabel+'</span>'
      + '</div>'
      /* 第2弾の絡みバッジ(engage_countがある時だけ) */
      + (it.engage_count ? '<div style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap">'
          + '<span style="font-size:11px;padding:3px 9px;border-radius:7px;background:rgba(34,224,255,.12);color:#22e0ff;font-weight:700">🔥 競合に絡み '+it.engage_count+'回</span>'
          + ((it.competitor_count>1) ? '<span style="font-size:11px;padding:3px 9px;border-radius:7px;background:rgba(168,85,247,.14);color:#c98bff;font-weight:700">🎯 競合'+it.competitor_count+'件に接触</span>' : '')
          + '</div>' : '')
      /* 近未来ネオンゲージ */
      + '<div style="margin-bottom:10px">'
        + '<div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:3px">'
          + '<span style="font-size:10px;letter-spacing:2px;color:'+scColor+';text-transform:uppercase;opacity:.85">見込み度</span>'
          + '<span style="font-size:22px;font-weight:900;line-height:1;color:'+scColor+';text-shadow:0 0 8px '+scGlow+'">'+sc+'<span style="font-size:12px;font-weight:700">%</span></span>'
        + '</div>'
        + '<div style="height:6px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden;position:relative">'
          + '<div style="height:100%;width:'+sc+'%;border-radius:99px;background:linear-gradient(90deg,'+scColor+'66,'+scColor+');box-shadow:0 0 10px '+scGlow+'"></div>'
        + '</div>'
      + '</div>'
      /* 危険度ゲージ */
      + '<div style="margin-bottom:10px">'
        + '<div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:3px">'
          + '<span style="font-size:10px;letter-spacing:2px;color:'+rkColor+';text-transform:uppercase;opacity:.85">危険度</span>'
          + '<span style="font-size:15px;font-weight:800;line-height:1;color:'+rkColor+';text-shadow:0 0 6px '+rkGlow+'">'+rk+'<span style="font-size:10px;font-weight:700">%</span></span>'
        + '</div>'
        + '<div style="height:4px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden">'
          + '<div style="height:100%;width:'+rk+'%;border-radius:99px;background:linear-gradient(90deg,'+rkColor+'66,'+rkColor+');box-shadow:0 0 8px '+rkGlow+'"></div>'
        + '</div>'
      + '</div>'
      + '<div style="font-size:13px;line-height:1.55;margin-bottom:6px;white-space:pre-wrap">'+esc((it.tweet_text||"").slice(0,200))+'</div>'
      + '<div style="font-size:12px;color:var(--muted);margin-bottom:8px">💡 '+esc(it.score_reason||"")+'</div>';

    /* リプ案 */
    const reps = [it.reply_1,it.reply_2,it.reply_3].filter(Boolean);
    if (reps.length) {
      const rl = document.createElement("div"); rl.className="desc"; rl.style.cssText="margin:4px 0"; rl.textContent="リプ案(タップでコピー):"; card.appendChild(rl);
      reps.forEach(r => {
        const wrap = document.createElement("div"); wrap.style.cssText = "background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px;margin:4px 0";
        wrap.innerHTML = '<div style="font-size:13px;line-height:1.5;white-space:pre-wrap;margin-bottom:6px">💬 ' + esc(r) + '</div>';
        const cp = document.createElement("button"); cp.className = "mini"; cp.textContent = "📋 コピー";
        cp.onclick = () => { navigator.clipboard.writeText(r); cp.textContent = "✓ コピーした"; setTimeout(() => cp.textContent = "📋 コピー", 1200); };
        const go = document.createElement("button"); go.className = "mini cyan"; go.textContent = "↗ この案でXリプ"; go.style.cssText = "margin-left:6px;font-weight:700";
        go.onclick = () => { xReplyIntent(it, r, ""); };
        wrap.appendChild(cp); wrap.appendChild(go); card.appendChild(wrap);
      });
    }
    if (it.quote_text) {
      const qb = document.createElement("button"); qb.className="mini"; qb.style.cssText="display:block;width:100%;text-align:left;margin:3px 0;white-space:normal;line-height:1.4"; qb.textContent = "🔁 引用案: "+it.quote_text;
      qb.onclick = ()=>{ navigator.clipboard.writeText(it.quote_text); qb.textContent="✓ コピーした"; setTimeout(()=>qb.textContent="🔁 引用案: "+it.quote_text,1200); };
      card.appendChild(qb);
    }

    /* 操作ボタン */
    const btnRow = document.createElement("div"); btnRow.style.cssText="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px";
    const openB = document.createElement("button"); openB.className="mini"; openB.textContent="↗ Xで開く";
    openB.onclick = ()=>{ const link = it.tweet_url || it.profile_url; if(link) window.open(link,"_blank"); };
    const saveB = document.createElement("button"); saveB.className="mini cyan"; saveB.textContent="⭐ 見込み客リストに追加";
    saveB.onclick = async ()=>{ saveB.disabled=true; saveB.textContent="保存中…";
      try {
        const r = await gasFetch_("radarSave", { row: Object.assign({ screen_name: acct.value, status:"new" }, radarRowFor(it)) });
        if (r && r.ok) { saveB.textContent="✓ 保存した"; }
        else { saveB.textContent="⭐ 追加"; saveB.disabled=false; alert("保存できませんでした: " + ((r && r.error) ? r.error : "原因不明")); }
      }
      catch(e){ saveB.textContent="⭐ 追加"; saveB.disabled=false; alert(e.message); } };
    const hideB = document.createElement("button"); hideB.className="mini"; hideB.textContent="✕ 非表示";
    hideB.onclick = ()=>{ card.style.display="none"; };
    btnRow.appendChild(openB); btnRow.appendChild(saveB); btnRow.appendChild(hideB);
    card.appendChild(btnRow);
    return card;
  }

  function radarRowFor(it) {
    return {
      tweet_id: it.tweet_id, tweet_url: it.tweet_url || it.profile_url, tweet_text: it.tweet_text,
      author_name: it.author_name, author_handle: it.author_handle,

  function openRadarSwipe(items) {
    if (!items || !items.length) return;
    let idx = 0, busy = false;
    const overlay = document.createElement("div");
    overlay.style.cssText = "position:fixed;inset:0;background:rgba(5,8,18,.97);z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px";
    const closeBtn = document.createElement("button"); closeBtn.className = "mini"; closeBtn.textContent = "✕ 閉じる";
    closeBtn.style.cssText = "position:fixed;top:16px;right:16px;z-index:100000";
    closeBtn.onclick = () => { overlay.remove(); showSavedList(); };
    const backBtn = document.createElement("button"); backBtn.className = "mini"; backBtn.textContent = "↩ 戻る";
    backBtn.style.cssText = "position:fixed;top:16px;left:16px;z-index:100000;display:none";
    backBtn.onclick = () => { if (idx <= 0 || busy) return; idx--; mark(items[idx], "new"); renderCard(); };
    const counter = document.createElement("div"); counter.style.cssText = "color:var(--muted);font-size:13px;margin-bottom:12px";
    const stack = document.createElement("div"); stack.style.cssText = "position:relative;width:100%;max-width:440px;height:62vh";
    const hint = document.createElement("div"); hint.style.cssText = "color:var(--muted);font-size:12px;margin-top:16px;text-align:center;line-height:1.7";
    hint.innerHTML = "← 左スワイプで<b style='color:#7fd4ff'>スルー</b> ／ 右スワイプで<b style='color:#ff9ec4'>リプ</b> →<br>または下のリプ案を直接タップ";
    overlay.appendChild(closeBtn); overlay.appendChild(backBtn); overlay.appendChild(counter); overlay.appendChild(stack); overlay.appendChild(hint);
    document.body.appendChild(overlay);

    const mark = (it, st) => { it.status = st; if (!it.id) return; if (!gasBeacon_("radarMark", { id: it.id, status: st })) gasFetch_("radarMark", { id: it.id, status: st }).catch(function () {}); };

    function fly(card, dir) {
      busy = true;
      card.style.transition = "transform .3s, opacity .3s";
      card.style.transform = "translateX(" + (dir > 0 ? "120%" : "-120%") + ") rotate(" + (dir * 8) + "deg)";
      card.style.opacity = "0";
      setTimeout(function () { idx++; renderCard(); }, 280);
    }
    function attachSwipe(card, it, ideas, tint, label) {
      let startX = 0, curX = 0, dragging = false;
      const start = function (x) { if (busy) return; startX = x; dragging = true; card.style.transition = "none"; };
      const move = function (x) {
        if (!dragging) return;
        curX = x - startX;
        card.style.transform = "translateX(" + curX + "px) rotate(" + (curX * 0.04) + "deg)";
        const t = Math.min(Math.abs(curX) / 150, 0.85);
        if (curX > 8) { tint.style.background = "rgba(255,158,196,.45)"; tint.style.opacity = String(t * 0.6); label.textContent = "リプ ↗"; label.style.color = "#ff9ec4"; label.style.opacity = String(t); }
        else if (curX < -8) { tint.style.background = "rgba(127,212,255,.45)"; tint.style.opacity = String(t * 0.6); label.textContent = "スルー"; label.style.color = "#7fd4ff"; label.style.opacity = String(t); }
        else { tint.style.opacity = "0"; label.style.opacity = "0"; }
      };
      const end = function () {
        if (!dragging) return; dragging = false;
        if (busy) { card.style.transition = "transform .2s"; card.style.transform = ""; curX = 0; return; }
        tint.style.opacity = "0"; label.style.opacity = "0";
        if (curX > 110) { xReplyIntent(it, ideas[0] || "", "いちばん自然"); mark(it, "replied"); fly(card, 1); }
        else if (curX < -110) { mark(it, "skip"); fly(card, -1); }
        else { card.style.transition = "transform .2s, opacity .2s"; card.style.transform = ""; card.style.opacity = "1"; }
        curX = 0;
      };
      card.addEventListener("touchstart", function (e) { start(e.touches[0].clientX); }, { passive: true });
      card.addEventListener("touchmove", function (e) { move(e.touches[0].clientX); }, { passive: true });
      card.addEventListener("touchend", end);
      card.addEventListener("mousedown", function (e) { start(e.clientX); });
      card.addEventListener("mousemove", function (e) { move(e.clientX); });
      card.addEventListener("mouseup", end);
    }
    function renderCard() {
      busy = false;
      stack.innerHTML = "";
      backBtn.style.display = idx > 0 ? "block" : "none";
      if (idx >= items.length) {
        counter.textContent = ""; hint.style.display = "none";
        stack.innerHTML = '<div style="text-align:center;color:var(--muted);padding-top:60px;font-size:16px;line-height:1.9">🎉 全部捌きました！<br>お疲れさまでした。</div>';
        return;
      }
      counter.textContent = (idx + 1) + " / " + items.length;
      const it = items[idx];
      const ideas = [it.reply_1, it.reply_2, it.reply_3].filter(Boolean);
      const card = document.createElement("div");
      card.style.cssText = "position:absolute;inset:0;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:18px;overflow-y:auto;touch-action:pan-y;box-shadow:0 12px 36px rgba(0,0,0,.55)";
      let html = '<div style="font-weight:800;font-size:17px;color:#3DFFA8;margin-bottom:5px">見込み度 ' + (it.score || 0) + '%</div>';
      html += '<div style="font-size:12px;color:var(--accent2);margin-bottom:10px">@' + esc(it.author_handle || "") + '</div>';
      html += '<div style="font-size:14px;line-height:1.6;white-space:pre-wrap;margin-bottom:12px">' + esc((it.tweet_text || "").slice(0, 260)) + '</div>';
      if (it.score_reason) html += '<div style="font-size:11.5px;color:var(--muted);background:var(--bg);border-radius:8px;padding:6px 8px;margin-bottom:10px">💡 ' + esc(it.score_reason) + '</div>';
      card.innerHTML = html;
      const labels = ["いちばん自然", "少し踏み込む", "会話続く"];
      ideas.slice(0, 3).forEach(function (rep, i) {
        const b = document.createElement("button"); b.className = "mini cyan";
        b.style.cssText = "display:block;width:100%;text-align:left;white-space:normal;line-height:1.5;margin-top:8px;padding:11px;font-size:13px;position:relative;z-index:2";
        b.innerHTML = '<span style="opacity:.6;font-size:10px">' + (labels[i] || "案") + '</span><br>↗ ' + esc(rep);
        b.onclick = function () { xReplyIntent(it, rep, labels[i]); mark(it, "replied"); fly(card, 1); };
        card.appendChild(b);
      });
      if (!ideas.length) {
        const note = document.createElement("div");
        note.style.cssText = "margin-top:10px;font-size:12px;color:var(--muted);line-height:1.6";
        note.textContent = "💡 リプ案なし。それでも絡むなら自分で書いてリプ。";
        card.appendChild(note);
        const mb = document.createElement("button"); mb.className = "mini";
        mb.style.cssText = "display:block;width:100%;margin-top:8px;padding:11px;font-size:13px;position:relative;z-index:2";
        mb.textContent = "✍ 自分で書いてXでリプ";
        mb.onclick = function () { xReplyIntent(it, "", "手動"); mark(it, "replied"); fly(card, 1); };
        card.appendChild(mb);
      }
      const tint = document.createElement("div");
      tint.style.cssText = "position:absolute;inset:0;border-radius:18px;pointer-events:none;opacity:0;transition:opacity .12s;z-index:3";
      const label = document.createElement("div");
      label.style.cssText = "position:absolute;top:18px;left:50%;transform:translateX(-50%);font-size:28px;font-weight:900;opacity:0;pointer-events:none;text-shadow:0 2px 10px rgba(0,0,0,.6);z-index:4";
      card.appendChild(tint); card.appendChild(label);
      stack.appendChild(card);
      attachSwipe(card, it, ideas, tint, label);
    }
    renderCard();
  }

  async function showSavedList() {
    if (!acct.value) { alert("対象アカウントを選んでください"); return; }
    out.innerHTML = '<div class="muted" style="padding:10px">保存した見込み客を読み込み中…</div>';
    try {
      const j = await gasFetch_("radarList", { screen_name: acct.value });

      const swipeable = items.filter(it => { const s = it.status || "new"; return s !== "replied" && s !== "skip" && s !== "contacted" && s !== "done"; });
      if (swipeable.length) {
        const sw = document.createElement("button"); sw.className = "mini cyan";
        sw.style.cssText = "width:100%;padding:12px;margin-bottom:10px;font-weight:800;font-size:14px";
        sw.textContent = "🃏 スワイプで一気に捌く (" + swipeable.length + "件)";
        sw.onclick = () => openRadarSwipe(swipeable);
        out.appendChild(sw);

      items.forEach(it => out.appendChild(radarCard(it)));

  /* アカウント一覧を読み込む */
  (async ()=>{
    if (!S.clients || !S.clients.length) { try { await loadClients(); } catch(e){} }
    const accounts = (S.clients || []);
    acct.innerHTML = "";
    accounts.forEach(a=>{ const o=document.createElement("option"); o.value=a.screen_name; o.textContent="@"+a.screen_name; acct.appendChild(o); });
    if (accounts.length) { acct.value = accounts[0].screen_name; await loadCfgFor(acct.value); }
    acct.onchange = async ()=>{ await loadCfgFor(acct.value); desireSel={}; rivalOn={}; renderBody(); };
    renderBody();
  })();
};

/* ★v49: コメント入りで引用作成画面を開く=投稿を押すだけ。
   url= に「引用元ツイートURL」を渡すとXが引用カードにする(内部ツイート参照=外部リンクではないのでリーチ低下しない)。
   コメント(text)は最初から入った状態で開く。念のためクリップボードにもコピー。
   iOS対策: ジェスチャー内で最優先にXを開く→そのあとコピー(先に非同期を挟むとブロックされる) */
function xQuoteIntent(it, textOverride) {
  const text = (textOverride != null ? textOverride : (it.quote_text || "")) || "";
  let turl = it.target_url || "";
  if (!turl && it.target_username && it.target_tweet_id) turl = "https://x.com/" + it.target_username + "/status/" + it.target_tweet_id;
  const intent = "https://x.com/intent/post?text=" + encodeURIComponent(text) + (turl ? "&url=" + encodeURIComponent(turl) : "");
  let w = null; try { w = window.open(intent, "_blank"); } catch (e) {}
  if (!w) { try { location.href = intent; } catch (e) {} }
  try { navigator.clipboard.writeText(text); } catch (e) {}
}

/* ★v49: 引用元投稿の統計行(投稿時刻・インプレ・いいね)。スキャン時に保存した値を表示 */
function quoteStatsLine_(it) {
  const parts = [];
  if (it && it.target_posted_at) { const h = Math.round((Date.now() - new Date(it.target_posted_at).getTime()) / 3600000); parts.push('🕐 ' + (h < 1 ? '1時間以内' : ('約' + h + '時間前'))); }
  if (it && it.target_views != null) parts.push('👁 ' + Number(it.target_views).toLocaleString() + ' 表示');
  if (it && it.target_likes != null) parts.push('❤ ' + Number(it.target_likes).toLocaleString());
  return parts.join('　・　');
}

/* ★v34: 承認待ちの引用候補を、挨拶と同じ横スワイプで一気にさばく(右=引用画面へ / 左=スキップ / ↩戻る)。
   引用RTタブと🎯メニューの両方から使うためグローバルに置く */
function openQuoteSwipe(items, onClose) {

  overlay.style.cssText = "position:fixed;inset:0;background:rgba(5,8,18,.97);z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px";
  const closeBtn = document.createElement("button"); closeBtn.className = "mini"; closeBtn.textContent = "✕ 閉じる"; closeBtn.style.cssText = "position:fixed;top:16px;right:16px;z-index:100000";
  closeBtn.onclick = () => { overlay.remove(); if (onClose) onClose(); };
  const backBtn = document.createElement("button"); backBtn.className = "mini"; backBtn.textContent = "↩ 戻る"; backBtn.style.cssText = "position:fixed;top:16px;left:16px;z-index:100000;display:none";
  backBtn.onclick = () => { if (idx <= 0) return; idx--; renderCard(); };
  const counter = document.createElement("div"); counter.style.cssText = "color:var(--muted);font-size:13px;margin-bottom:12px";
  const stack = document.createElement("div"); stack.style.cssText = "position:relative;width:100%;max-width:440px;height:62vh";
  const hint = document.createElement("div"); hint.style.cssText = "color:var(--muted);font-size:12px;margin-top:16px;text-align:center;line-height:1.7";
  hint.innerHTML = "← 左スワイプで<b style='color:#7fd4ff'>スキップ</b> ／ 右スワイプで<b style='color:#ff9ec4'>Xで引用（コメント入り）</b> →<br><span style='font-size:11px'>コメント入りの引用画面が開くので、投稿を押すだけ</span>";
  overlay.appendChild(closeBtn); overlay.appendChild(backBtn); overlay.appendChild(counter); overlay.appendChild(stack); overlay.appendChild(hint);
  document.body.appendChild(overlay);
  /* 右=Xの引用作成画面を開く(コメントはコピー)＋この候補は処理済みにして次へ */
  function doApprove(it) { xQuoteIntent(it); gasFetch_("quoteSkip", { id: it.id }).catch(() => {}); }
  function doSkip(it) { gasFetch_("quoteSkip", { id: it.id }).catch(() => {}); }
  function fly(card, dir) { busy = true; card.style.transition = "transform .3s, opacity .3s"; card.style.transform = "translateX(" + (dir > 0 ? "120%" : "-120%") + ") rotate(" + (dir * 8) + "deg)"; card.style.opacity = "0"; setTimeout(() => { idx++; renderCard(); }, 280); }
  function attachSwipe(card, it, tint, label) {
    let startX = 0, curX = 0, dragging = false;
    const start = (x) => { if (busy) return; startX = x; dragging = true; card.style.transition = "none"; };
    const move = (x) => {
      if (!dragging) return; curX = x - startX;
      card.style.transform = "translateX(" + curX + "px) rotate(" + (curX * 0.04) + "deg)";
      const t = Math.min(Math.abs(curX) / 150, 0.85);
      if (curX > 8) { tint.style.background = "rgba(255,158,196,.45)"; tint.style.opacity = String(t * 0.6); label.textContent = "引用 ↗"; label.style.color = "#ff9ec4"; label.style.opacity = String(t); }
      else if (curX < -8) { tint.style.background = "rgba(127,212,255,.45)"; tint.style.opacity = String(t * 0.6); label.textContent = "スキップ"; label.style.color = "#7fd4ff"; label.style.opacity = String(t); }
      else { tint.style.opacity = "0"; label.style.opacity = "0"; }
    };
    const end = () => {
      if (!dragging) return; dragging = false;
      if (busy) { card.style.transition = "transform .2s"; card.style.transform = ""; curX = 0; return; }
      tint.style.opacity = "0"; label.style.opacity = "0";
      if (curX > 110) { doApprove(it); fly(card, 1); }
      else if (curX < -110) { doSkip(it); fly(card, -1); }
      else { card.style.transition = "transform .2s, opacity .2s"; card.style.transform = ""; card.style.opacity = "1"; }
      curX = 0;
    };
    card.addEventListener("touchstart", (e) => start(e.touches[0].clientX), { passive: true });
    card.addEventListener("touchmove", (e) => move(e.touches[0].clientX), { passive: true });
    card.addEventListener("touchend", end);
    card.addEventListener("mousedown", (e) => start(e.clientX));
    card.addEventListener("mousemove", (e) => move(e.clientX));
    card.addEventListener("mouseup", end);
  }
  function renderCard() {
    busy = false; stack.innerHTML = "";
    backBtn.style.display = idx > 0 ? "block" : "none";
    if (idx >= items.length) { counter.textContent = ""; hint.style.display = "none"; stack.innerHTML = '<div style="text-align:center;color:var(--muted);padding-top:60px;font-size:16px;line-height:1.9">🎉 全部さばきました！<br>お疲れさまでした。</div>'; return; }
    counter.textContent = (idx + 1) + " / " + items.length;
    const it = items[idx];
    const card = document.createElement("div");
    card.style.cssText = "position:absolute;inset:0;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:18px;overflow-y:auto;touch-action:pan-y;box-shadow:0 12px 36px rgba(0,0,0,.55)";
    let html = '<div style="font-size:12px;color:var(--accent2);margin-bottom:4px">@' + esc(it.target_username || "") + ' の投稿を引用' + (it.target_url ? ' ・<a href="' + esc(it.target_url) + '" target="_blank" style="color:var(--accent2)">元投稿</a>' : '') + '</div>';
    const _sl = quoteStatsLine_(it); if (_sl) html += '<div style="font-size:11.5px;color:var(--muted);margin-bottom:8px">' + _sl + '</div>';
    html += '<div style="font-size:12.5px;line-height:1.6;white-space:pre-wrap;background:rgba(255,255,255,.05);border-radius:8px;padding:9px;margin-bottom:12px">' + esc(String(it.target_text || "").slice(0, 240)) + '</div>';
    html += '<div style="font-size:11px;color:var(--muted);margin-bottom:4px">あなたの引用コメント(AI生成・フック強め／コピーされます)</div>';
    html += '<div style="font-size:14.5px;line-height:1.6;white-space:pre-wrap;font-weight:600">' + esc(it.quote_text || "") + '</div>';
    card.innerHTML = html;
    const okB = document.createElement("button"); okB.className = "mini cyan"; okB.style.cssText = "display:block;width:100%;margin-top:14px;padding:12px;font-size:14px;font-weight:800;position:relative;z-index:2"; okB.textContent = "🔁 Xで引用（コメント入り・投稿押すだけ）";
    okB.onclick = () => { if (busy) return; doApprove(it); fly(card, 1); };
    card.appendChild(okB);
    const skB = document.createElement("button"); skB.className = "mini"; skB.style.cssText = "display:block;width:100%;margin-top:8px;padding:11px;font-size:13px;position:relative;z-index:2"; skB.textContent = "スキップ";
    skB.onclick = () => { if (busy) return; doSkip(it); fly(card, -1); };
    card.appendChild(skB);
    const tint = document.createElement("div"); tint.style.cssText = "position:absolute;inset:0;border-radius:18px;pointer-events:none;opacity:0;transition:opacity .12s;z-index:3";
    const label = document.createElement("div"); label.style.cssText = "position:absolute;top:18px;left:50%;transform:translateX(-50%);font-size:26px;font-weight:900;opacity:0;pointer-events:none;text-shadow:0 2px 10px rgba(0,0,0,.6);z-index:4";
    card.appendChild(tint); card.appendChild(label);
    stack.appendChild(card);
    attachSwipe(card, it, tint, label);
  }
  renderCard();
}

    return `${S.sns}の投稿に届いた以下のコメント・リプそれぞれに、「${v.tone}」なトーンで返信案を作れ。\n\n${v.comments}\n\nルール:\n- 各コメントを引用→その下に返信案\n- 短く自然に(50字前後)\n${extra}\n- 来店につながる一言は自然に混ぜられる場合のみ\n前置き不要。日本語。${sc()}`;
  },
});

/* ---- 📭 書き漏れチェック(全アカ横断で空き日を検出・古いdraft自動掃除) ---- */
BUILDERS.gapcheck = (el) => {
  head(el, "📭 書き漏れチェック", "全アカウントを横断して、今週7日間で投稿が入ってない日を検出。空きがあるアカだけ出す。古い下書き(7日以上前)は自動で掃除。", [
    "アプリを開くと自動でチェック",
    "空きアカ・空き日が出たら埋める",
    "古い下書きは勝手に消える",
  ]);

  const status = document.createElement("p");
  status.className = "desc"; status.textContent = "チェック中…";
  el.appendChild(status);

  const result = document.createElement("div");
  el.appendChild(result);

  const reBtn = runBtn(el, "🔄 もう一度チェック");

  async function cleanOldDrafts() {
    /* 7日以上前のdraftを削除 */
    try {
      const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - 7);
      await sb.from("scheduled_posts")
        .delete()
        .eq("status", "draft")
        .lt("scheduled_at", cutoff.toISOString());
    } catch(e) { /* 失敗しても致命的でない */ }
  }

  async function run() {
    status.textContent = "チェック中…";
    result.innerHTML = "";
    await cleanOldDrafts();

    const actives = S.clients.filter((c)=>c.status==="active" && c.screen_name !== "_test_" && !/^_test/.test(c.screen_name));
    if (!actives.length) { status.textContent = "連携中のアカウントがない(テスト用は除外)。"; return; }

    /* 今日から7日間の日付 */
    const wd = ["日","月","火","水","木","金","土"];
    const days = [];
    for (let i = 0; i < 7; i++) {
      const d = new Date(); d.setDate(d.getDate() + i);
      const ds = d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
      days.push({ ds, label: wd[d.getDay()], md: (d.getMonth()+1) + "/" + d.getDate() });
    }
    const from = new Date(days[0].ds + "T00:00:00").toISOString();
    const to = new Date(days[6].ds + "T23:59:59").toISOString();

    /* 全アカの予約・下書き・投稿済みを一括取得
       (postedも「その日は書いた」とカウント。予約管理の表示では消えてても判定には使う) */
    let rows = [];
    try {
      const { data } = await sb.from("scheduled_posts")
        .select("screen_name,scheduled_at,status,posted_at")
        .in("status", ["pending","draft","posted"])
        .gte("scheduled_at", from).lte("scheduled_at", to);
      rows = data || [];
    } catch(e) {
      status.textContent = "投稿データの取得に失敗した。";
      return;
    }

    /* アカ×日付で「埋まってるか」を集計。postedは実投稿日(posted_at)も見る */
    const taken = {}; // screen_name -> {ds:true}
    const dayKey = (dt) => dt.getFullYear() + "-" + String(dt.getMonth()+1).padStart(2,"0") + "-" + String(dt.getDate()).padStart(2,"0");
    rows.forEach((r) => {
      (taken[r.screen_name] = taken[r.screen_name] || {});
      taken[r.screen_name][dayKey(new Date(r.scheduled_at))] = true;
      if (r.status === "posted" && r.posted_at) {
        taken[r.screen_name][dayKey(new Date(r.posted_at))] = true;
      }
    });

    /* 空きがあるアカだけ抽出 */
    const flagged = [];
    actives.forEach((c) => {
      const gaps = days.filter((d) => !(taken[c.screen_name] && taken[c.screen_name][d.ds]));
      if (gaps.length) flagged.push({ acc: c.screen_name, gaps });
    });

    status.textContent = "";
    if (!flagged.length) {
      result.innerHTML =
        '<div style="position:relative;overflow:hidden;background:linear-gradient(135deg,rgba(16,185,129,.18),rgba(0,229,255,.12),rgba(168,85,247,.15));border:1px solid rgba(16,185,129,.5);border-radius:18px;padding:32px 20px;text-align:center;box-shadow:0 0 40px rgba(16,185,129,.25),inset 0 0 30px rgba(16,185,129,.08)">' +
          '<div style="font-size:46px;line-height:1;margin-bottom:12px;filter:drop-shadow(0 0 12px rgba(16,185,129,.6))">🏆</div>' +
          '<div style="font-size:20px;font-weight:800;letter-spacing:.04em;background:linear-gradient(90deg,#10b981,#00e5ff,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px">ALL CLEAR</div>' +
          '<div style="font-size:14px;font-weight:700;color:#e8fff5;margin-bottom:4px">全アカウント 今週ぜんぶ埋まってる</div>' +
          '<div style="font-size:12px;color:rgba(255,255,255,.6);letter-spacing:.08em">7 DAYS · NO GAPS · 書き漏れゼロ</div>' +
          '<div style="margin-top:14px;font-size:11px;color:rgba(16,185,129,.85);letter-spacing:.12em;text-transform:uppercase">Keep the streak going 🔥</div>' +
        '</div>';
      return;
    }

    const intro = document.createElement("p");
    intro.className = "desc"; intro.style.margin = "0 0 10px";
    intro.textContent = flagged.length + "アカウントに書き漏れあり。埋まってるアカは省略。";
    result.appendChild(intro);

    flagged.forEach((f) => {
      const card = document.createElement("div");
      card.style.cssText = "background:var(--card);border:1px solid var(--bad);border-radius:12px;padding:12px 14px;margin:8px 0";
      const name = document.createElement("div");
      name.style.cssText = "font-weight:700;font-size:14px;margin-bottom:8px";
      name.innerHTML = '<span style="color:var(--accent)">@'+esc(f.acc)+'</span> <span style="color:var(--bad);font-size:12px">'+f.gaps.length+'日 空き</span>';
      card.appendChild(name);
      /* 空き日ごとに「この日を生成」ボタン */
      const btnWrap = document.createElement("div");
      btnWrap.style.cssText = "display:flex;flex-wrap:wrap;gap:6px";
      f.gaps.forEach((g) => {
        const b = document.createElement("button");
        b.className = "btn"; b.style.cssText = "margin:0;padding:8px 12px;font-size:13px";
        b.textContent = "✏️ " + g.md + "(" + g.label + ")";
        b.onclick = () => genOneDay(f.acc, g, b);
        btnWrap.appendChild(b);
      });
      card.appendChild(btnWrap);
      result.appendChild(card);
    });
  }

  /* 指定アカ・指定日の投稿を1本生成して、その場で見せる(確認後に予約管理へ) */
  async function genOneDay(account, gap, btn) {
    const o = btn.textContent;
    btn.disabled = true; btn.textContent = "生成中…";
    try {
      await loadCfgFor(account);
      const isBoat = /競艇|ボートレース|ボート/.test(CFG.bizType || "");
      /* 噂のシーシャBar: 頻度に応じてミックス紹介投稿にする */
      if (isUwasaShisha(account, CFG.bizName) && CFG.mixOn && Math.random()*100 < (CFG.mixFreq||0)) {
        const sc2 = shPickScene(null, gap.ds);
        const r = await shMixPostText(null, sc2);
        if (r && r.thread) {
          btn.disabled = false; btn.textContent = o;
          showDraftPreview(account, gap, r.thread[0], "20:00", btn, r.thread.length>1?r.thread.slice(1):null);
          return;
        }
      }
      const prompt =
        `${S.sns}の投稿を1本作る。日付: ${gap.ds}(${gap.label}曜)。\n` +
        `このアカウントの業種・性格・文体設定に沿って、その日にふさわしい投稿を1本。\n` +
        `バズりやすい推奨投稿時刻(HH:MM)も決める。\n` +
        (isBoat ? "競艇アカだが、これは未来の日付の投稿で、その日のレース・出走表・モーター・展示データはまだ存在しない。\n【絶対禁止】具体的なレース場名(蒲郡・尼崎・徳山など)・レース番号・艇番・選手名・連勝率・モーター情報・展示タイム・的中実績など、データに基づく具体的な予想や数値を一切書かない(まだ確定していないデータを書くのは捏造になる)。\n代わりに、データが不要な内容にする: 競艇への向き合い方・心構え、過去の一般的な振り返り、買い方のノウハウや考え方、フォロワーへの告知・あいさつ、X運用上の小ネタ。具体的なその日の予想は別の『無料予想』機能が当日データを取得して出すので、ここでは出さない。\n" : "") +
        `出力フォーマット(厳守):\n時刻: HH:MM\n本文:\n(投稿本文)\n\n前置き不要。日本語。${sc()}`;
      const text = await callAI(prompt, false);
      if (!text || !text.trim()) throw new Error("AIが空を返した。もう一回試して。");
      let h = "12:00", bodyTxt = text.trim();
      const mt = text.match(/時刻[:：]\s*(\d{1,2}:\d{2})/);
      if (mt) h = mt[1];
      const mb = text.match(/本文[:：]\s*([\s\S]+)/);
      if (mb) bodyTxt = mb[1].trim();
      btn.disabled = false; btn.textContent = o;
      /* その場に本文を表示して、確認してから送る */
      showDraftPreview(account, gap, bodyTxt, h, btn);
    } catch (e) {
      alert("生成失敗: " + (e.message || e));
      btn.disabled = false; btn.textContent = o;
    }
  }

  /* 生成した本文をその場に出して、予約管理へ送る/作り直すを選ばせる */
  function showDraftPreview(account, gap, bodyTxt, h, srcBtn, threadRest) {
    /* 既存のプレビューがあれば消す */
    const existing = document.getElementById("gapPreview");
    if (existing) existing.remove();
    const card = document.createElement("div");
    card.id = "gapPreview";
    card.style.cssText = "background:var(--card);border:1px solid var(--accent);border-radius:12px;padding:14px;margin:12px 0;box-shadow:0 0 20px rgba(255,45,149,.15)";
    const ttl = document.createElement("div");
    ttl.style.cssText = "font-weight:700;font-size:14px;margin-bottom:8px";
    ttl.innerHTML = '<span style="color:var(--accent)">@'+esc(account)+'</span> '+gap.md+'('+gap.label+') の投稿案'+(threadRest&&threadRest.length?' 🧵スレッド':'');
    card.appendChild(ttl);
    /* 時刻 */
    const tRow = document.createElement("div");
    tRow.style.cssText = "display:flex;align-items:center;gap:8px;margin-bottom:8px";
    const tLbl = document.createElement("span"); tLbl.textContent = "⏰ 投稿時刻"; tLbl.style.fontSize = "13px";
    const tIn = document.createElement("input"); tIn.type = "time"; tIn.value = h;
    tIn.style.cssText = "padding:6px 10px;font-family:var(--mono);width:auto";
    tRow.appendChild(tLbl); tRow.appendChild(tIn);
    card.appendChild(tRow);
    /* 1本目本文(編集可) */
    const body = document.createElement("textarea");
    body.rows = 6; body.value = bodyTxt;
    body.style.cssText = "width:100%;font-size:13.5px;line-height:1.6";
    card.appendChild(body);
    const cnt = document.createElement("p"); cnt.className = "desc"; cnt.style.margin = "4px 0 8px";
    const updCnt = () => { cnt.textContent = "1本目 "+body.value.length + "字" + (S.sns==="X" && body.value.length>140 ? " ⚠140字超" : ""); };
    body.oninput = updCnt; updCnt();
    /* スレッド2本目以降(編集可) */
    const threadAreas = [];
    if (threadRest && threadRest.length) {
      threadRest.forEach((t2, i) => {
        const lbl = document.createElement("p"); lbl.className="desc"; lbl.style.margin="6px 0 2px"; lbl.textContent = "🧵 "+(i+2)+"本目(リプ)";
        card.appendChild(lbl);
        const ta2 = document.createElement("textarea"); ta2.rows = 5; ta2.value = t2;
        ta2.style.cssText = "width:100%;font-size:13px;line-height:1.6";
        card.appendChild(ta2); threadAreas.push(ta2);
      });
    }
    /* ボタン: 送る / 作り直す */
    const acts = document.createElement("div");
    acts.style.cssText = "display:flex;gap:8px;flex-wrap:wrap;margin-top:8px";
    const sendBtn = document.createElement("button");
    sendBtn.className = "btn"; sendBtn.style.cssText = "margin:0;flex:1;min-width:140px;background:linear-gradient(135deg,#10b981,#059669)";
    sendBtn.textContent = "✅ 予約管理へ送る";
    sendBtn.onclick = async () => {
      sendBtn.disabled = true; sendBtn.textContent = "送信中…";
      try {
        const threadVals = threadAreas.map(t=>t.value.trim()).filter(Boolean);
        const { error } = await saveScheduledPost({
          screen_name: account,
          text: body.value.trim(),
          scheduled_at: new Date(gap.ds + "T" + (tIn.value||"12:00") + ":00").toISOString(),
          status: "draft",
          thread: threadVals.length ? threadVals : null,
        });
        if (error) throw new Error(error.message);
        card.innerHTML = '<div style="text-align:center;color:#10b981;font-weight:700;padding:8px">✓ '+gap.md+' を予約管理に送った!'+(threadVals.length?' (🧵'+(threadVals.length+1)+'連投)':'')+'</div>';
        if (srcBtn) { srcBtn.textContent = "✓ "+gap.md+" 作成済"; srcBtn.style.background = "linear-gradient(135deg,#10b981,#059669)"; srcBtn.disabled = true; }
      } catch (e) { sendBtn.disabled = false; sendBtn.textContent = "✅ 予約管理へ送る"; alert("送信失敗: " + e.message); }
    };
    const reBtn = document.createElement("button");
    reBtn.className = "btn"; reBtn.style.cssText = "margin:0;flex:1;min-width:140px";
    reBtn.textContent = "🔀 作り直す";
    reBtn.onclick = () => { card.remove(); genOneDay(account, gap, srcBtn); };
    acts.appendChild(sendBtn); acts.appendChild(reBtn);
    card.appendChild(acts);
    /* 結果エリアの先頭に差し込む */
    result.insertBefore(card, result.firstChild);
    card.scrollIntoView({ behavior: "smooth", block: "center" });
  }

  reBtn.onclick = run;
  run();
};

/* ---- 💎 バズミラー(競合のフォロワーを狙ってリプで新規獲得) ---- */
BUILDERS.replyfactory = (el) => {
  head(el, "💎 バズミラー", "競合のXユーザー名を入れる→その人の伸びてる日本語ポストを取得→各ポストに自然なリプを量産。コピーして飛んで送信。競合のフォロワーを取りにいく。海外ポストは自動で除外。", [
    "競合のユーザー名(@なしでOK・複数は改行)を入れる",
    "伸びてるポストを取得→各ポストにリプ案",
    "良いのをコピー→そのポストに飛んでリプ&フォロー",
  ]);

  const inWrap = document.createElement("div");
  const ta = document.createElement("textarea"); ta.rows = 3;
  ta.placeholder = "競合のユーザー名を入力(@は不要)\n複数入れたい時は改行で区切る\n例:\narisa1996kyotei\nkyotei_pro";
  ta.style.cssText = "width:100%;font-size:14px";
  inWrap.appendChild(ta);

  const optRow = document.createElement("div"); optRow.style.cssText = "display:flex;gap:8px;align-items:center;margin:8px 0;flex-wrap:wrap";
  const lab = document.createElement("span"); lab.className="desc"; lab.textContent = "リプの本数:"; optRow.appendChild(lab);
  let perPost = 1;
  const cntBtns = {};
  [1,2,3].forEach(n => {
    const b = document.createElement("button"); b.className="mini"; b.textContent = "1ポストに"+n+"案";
    b.onclick = () => { perPost = n; Object.values(cntBtns).forEach(x=>x.classList.remove("cyan")); b.classList.add("cyan"); };
    cntBtns[n] = b; optRow.appendChild(b);
  });
  cntBtns[1].classList.add("cyan");
  inWrap.appendChild(optRow);

  const goBtn = document.createElement("button"); goBtn.className = "mini primary"; goBtn.textContent = "💎 伸びてるポストを取得してリプ量産";
  goBtn.style.cssText = "width:100%;margin-top:4px";
  inWrap.appendChild(goBtn);
  el.appendChild(inWrap);

  const out = document.createElement("div"); out.style.cssText = "margin-top:10px"; el.appendChild(out);

  goBtn.onclick = async () => {
    const names = ta.value.split(/[\n,、]/).map(s=>s.replace(/^@/,"").trim()).filter(Boolean);
    if (!names.length) { alert("競合のユーザー名を入れて。"); return; }
    if (acct.value) await loadCfgFor(acct.value); else await loadCfgFor("_default_");
    goBtn.disabled = true; out.innerHTML = "";
    /* 各ユーザーのポストを取得 */
    let allPosts = [];
    for (const name of names.slice(0, 5)) {
      goBtn.textContent = "@"+name+" のポスト取得中…";
      try {
        const r = await gasFetch_("twUser", { userName: name });
        if (r && r.tweets && r.tweets.length) {
          r.tweets.forEach(t => { t._author = name; allPosts.push(t); });
        } else if (r && r.error) {
          const w = document.createElement("div"); w.className="muted"; w.style.cssText="font-size:12px;margin:4px 0";
          w.textContent = "@"+name+": 取得できず("+(r.error)+")"; out.appendChild(w);
        }
      } catch(e) {
        const w = document.createElement("div"); w.className="err"; w.textContent = "@"+name+": "+e.message; out.appendChild(w);
      }
    }
    if (!allPosts.length) {
      out.innerHTML += '<div class="muted" style="padding:8px">ポストを取得できませんでした。ユーザー名が正しいか、APIキーが設定されているかご確認ください。</div>';
      goBtn.disabled = false; goBtn.textContent = "💎 伸びてるポストを取得してリプ量産"; return;
    }
    /* いいね数でソートして伸びてるポストTOP10 */
    allPosts.sort((a,b)=> (b.likes||0) - (a.likes||0));
    const top = allPosts.slice(0, 10);
    out.innerHTML = '<div class="desc" style="margin:6px 0">伸びてるポスト'+top.length+'件。各ポストにリプ案を生成中…</div>';

    /* 各ポストにリプ生成 */
    goBtn.textContent = "リプを生成中…";

    }
    goBtn.disabled = false; goBtn.textContent = "💎 伸びてるポストを取得してリプ量産";
  };

  /* リプ生成プロンプト */
  function replyFactoryPrompt(postText, n) {
    return `次のXのポストに対する「リプライ(返信)」を${n}案作る。\n`
      + `\n【相手のポスト】\n${postText}\n`
      + personaClause()
      + `\n【リプの狙い】\n`
      + `- このポストを見た人や投稿主に「お、いいこと言うな」と思わせて、プロフィールを見てもらいフォローにつなげる\n`
      + `- 投稿主への共感・補足・自分の体験・気の利いたひと言など、自然で感じのいいリプ\n`
      + `\n【ルール】\n`
      + `- 宣伝・売り込み・リンク貼りは絶対しない(リプ欄で嫌われる)。あくまで自然な会話\n`
      + `- 媚びすぎ・テンプレ褒め(「素敵です!」だけ等)はNG。中身のある一言\n`
      + `- 相手を否定・論破しない。感じよく\n`

  el.appendChild(note);

  const acct = document.createElement("select"); acct.style.cssText = "width:100%;padding:10px;border-radius:8px;font-size:14px"; el.appendChild(acct);
  S.clients.filter((c)=>c.status==="active").forEach((c)=>{ const o=document.createElement("option"); o.value=c.screen_name; o.textContent="@"+c.screen_name; acct.appendChild(o); });
  if (!acct.options.length) { const o=document.createElement("option"); o.textContent="(クライアント未登録)"; o.value=""; acct.appendChild(o); }
  acct.value = S.activeAccount;

  const goBtn = document.createElement("button"); goBtn.className = "mini primary"; goBtn.textContent = "🧹 非フォローバックを抽出";
  goBtn.style.cssText = "width:100%"; el.appendChild(goBtn);
  const statusEl = document.createElement("div"); statusEl.style.cssText="margin-top:8px"; el.appendChild(statusEl);
  const out = document.createElement("div"); out.style.cssText="margin-top:8px"; el.appendChild(out);

  goBtn.onclick = async () => {
    if (!acct.value) { alert("クライアント(アカウント)を選んで。"); return; }
    goBtn.disabled = true; goBtn.textContent = "抽出中…(フォロー数が多いと時間かかる)"; out.innerHTML = ""; statusEl.innerHTML = "";
    try {
      const j = await gasFetch_("nonFollowBack", { userName: acct.value });
      if (j.error) { out.innerHTML = '<div class="err">'+esc(j.error)+'</div>'; goBtn.disabled=false; goBtn.textContent="🧹 非フォローバックを抽出"; return; }
      const cand = j.candidates || [];
      statusEl.innerHTML = '<div class="desc">フォロー中: '+(j.followingCount||0)+' / フォロワー: '+(j.followerCount||0)+' / 非フォローバック: <b style="color:var(--accent)">'+cand.length+'件</b><br>今日の解除済み: '+(j.todayUnfollowed||0)+'/30件</div>'
        + (j.warning ? '<div style="margin-top:6px;background:rgba(255,159,67,.12);border:1px solid #ff9f43;border-radius:8px;padding:8px;font-size:11.5px;color:#ff9f43">⚠️ '+esc(j.warning)+'</div>' : '');
      if (!cand.length) { out.innerHTML = '<div class="muted" style="padding:8px">非フォローバックは見つかりませんでした。きれいな状態です👍</div>'; goBtn.disabled=false; goBtn.textContent="🧹 非フォローバックを抽出"; return; }
      let todayCount = j.todayUnfollowed || 0;
      let followLog = {};
      try { followLog = JSON.parse(localStorage.getItem("xpl_follow_log") || "{}"); } catch (e) {}
      const daysSince_ = (name) => {
        const t = followLog[String(name).replace(/^@/, "")];
        return t ? Math.floor((Date.now() - t) / 86400000) : null;
      };
      /* フォローから2日以上経過(返し待ち超過)を優先。記録なしは後ろ */
      cand.sort((a, b) => {
        const da = daysSince_(a.userName), db = daysSince_(b.userName);
        if (da == null && db == null) return 0;
        if (da == null) return 1;
        if (db == null) return -1;
        return db - da;
      });
      cand.slice(0, 100).forEach((u) => {
        const days = daysSince_(u.userName);
        const daysLabel = days == null
          ? '<span style="color:var(--muted)">フォロー日不明</span>'
          : (days >= 2
              ? '<span style="color:#ff9f43;font-weight:700">' + days + '日前にフォロー・返し無し</span>'
              : '<span style="color:var(--muted)">' + days + '日前にフォロー</span>');
        const card = document.createElement("div");
        card.style.cssText = "display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px;margin-top:6px;flex-wrap:wrap";
        card.innerHTML = '<div style="flex:1;min-width:140px"><div style="font-weight:700;font-size:13px">@'+esc(u.userName)+'</div><div style="font-size:11px;color:var(--muted)">'+esc(u.name||"")+' · フォロワー'+(u.followers||0)+'</div><div style="font-size:11px;margin-top:2px">'+daysLabel+'</div></div>';
        const unf = document.createElement("button"); unf.className="mini"; unf.textContent="Xで解除→"; unf.style.cssText="padding:6px 12px;font-size:12px;background:#ff6b35;color:#fff;border:none;border-radius:7px";
        unf.onclick = () => {
          window.open("https://x.com/" + u.userName, "_blank");
          unf.textContent = "開いた"; unf.style.background = "#666"; card.style.opacity = "0.6";
          if (todayCount < 30) { todayCount++; const d = statusEl.querySelector("div"); if (d) d.innerHTML = d.innerHTML.replace(/今日の解除済み: \d+\/30件/, "今日の解除済み: " + todayCount + "/30件"); }
        };
        card.appendChild(unf);
        out.appendChild(card);
      });
    } catch (e) { out.innerHTML = '<div class="err">'+e.message+'</div>'; }
    goBtn.disabled = false; goBtn.textContent = "🧹 非フォローバックを抽出";
  };
};

        left.style.cssText = "color:var(--fg);text-decoration:none;font-weight:600";
        left.textContent = "@" + r.target;

        right.style.color = color;

  })();
};

  btnRow.appendChild(todayBtn);

  statsBtn.onclick = async () => {
